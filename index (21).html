<!DOCTYPE html>
<html lang="es" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#062456">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<title>Control de Entes · Alcaldía de Cali</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@600;700;800&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600;700&display=swap" rel="stylesheet">
<style>
/* =====================================================================
   Control de Entes · Identidad Alcaldía de Santiago de Cali
   Paleta tomada de la bandera de Cali (azul, rojo, blanco, verde) y el oro del escudo.
   ===================================================================== */
:root{
  --azul:#0B3D91; --azul2:#2F66C9; --azul7:#082F72; --azul9:#062456; --azul10:#041A40; --oro:#D4A72C;
  --rojoCali:#D21F3C; --verdeCali:#138A44;
  --bg:#F3F5FA; --bg2:#EAEEF5; --panel:#FFFFFF; --panel2:#F6F8FC;
  --line:#E1E6EF; --line2:#CDD5E2;
  --ink:#13203A; --soft:#55627A; --faint:#6A768C;
  /* nombres heredados que usa la lógica de la app */
  --green:#0B3D91; --green2:#082F72; --glow:#0E6E36; --gdim:#E3F4EA; --gold:#D4A72C;
  --red:#D21F3C; --redbg:#FCE8EB; --redink:#B0172F;
  --yel:#F2B230; --yelbg:#FDF3DC; --yelink:#9A5B00;
  --side:276px; --side-c:78px; --r:14px;
  --shadow:0 1px 2px rgba(19,32,58,.06),0 2px 8px rgba(19,32,58,.04);
  --tab-h:64px;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){ --bg:#F3F5FA; } }
:root[data-theme="dark"]{ --bg:#F3F5FA; }
*{box-sizing:border-box}
html,body{height:100%;max-width:100%;overflow-x:clip}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;font-size:14px;-webkit-font-smoothing:antialiased;font-variant-numeric:tabular-nums;-webkit-tap-highlight-color:transparent}
h1,h2,h3,h4{font-family:Archivo,Inter,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;margin:0;letter-spacing:-.01em;color:var(--azul9)}
.mono{font-family:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,monospace}
.hidden{display:none!important}
button{font:inherit;color:inherit;cursor:pointer}
a{color:var(--azul)}
::selection{background:rgba(11,61,145,.18)}
:focus-visible{outline:3px solid var(--oro);outline-offset:2px;border-radius:8px}
::-webkit-scrollbar{width:8px;height:8px}::-webkit-scrollbar-thumb{background:#C3CCDA;border-radius:8px}

/* ---------- Estructura ---------- */
.app{display:flex;min-height:100vh}
.sidebar{width:var(--side);flex:none;color:#fff;background:linear-gradient(180deg,var(--azul9) 0%,var(--azul10) 100%);display:flex;flex-direction:column;position:sticky;top:0;height:100vh;z-index:60;transition:width .2s ease}
.sidebar::after{content:"";position:absolute;top:0;right:0;bottom:0;width:4px;background:linear-gradient(180deg,#2F66C9 0 30%,var(--rojoCali) 30% 37%,#fff 37% 63%,var(--rojoCali) 63% 70%,#1FA557 70% 100%)}
.main{flex:1;min-width:0;display:flex;flex-direction:column;overflow-x:clip}
.collapsed .sidebar{width:var(--side-c)}

.brand{display:flex;align-items:center;gap:12px;padding:18px 16px 16px;border-bottom:1px solid rgba(255,255,255,.1)}
.shield{width:44px;height:48px;flex:none;display:flex;align-items:center;justify-content:center;filter:drop-shadow(0 4px 10px rgba(0,0,0,.3))}
.shield img{width:100%;height:100%;object-fit:contain}
.brand-t{min-width:0;flex:1;overflow:hidden}
.brand-t b{display:block;font-family:Archivo,Inter,sans-serif;font-size:1rem;line-height:1.15;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.brand-t small{display:block;color:#B9CBEA;font-size:.74rem;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.icon-btn{width:36px;height:36px;border-radius:10px;background:var(--panel);border:1px solid var(--line);color:var(--soft);display:inline-flex;align-items:center;justify-content:center;flex:none}
.icon-btn:hover{color:var(--azul);border-color:var(--azul2)}
.sidebar .icon-btn{background:rgba(255,255,255,.08);border-color:rgba(255,255,255,.16);color:#D6E2F6}
.sidebar .icon-btn:hover{background:rgba(255,255,255,.16);color:#fff}
.collapsed .brand-t,.collapsed .nav-group,.collapsed .nav-label,.collapsed .user-t,.collapsed .logout{display:none}
.collapsed .brand{justify-content:center;flex-wrap:wrap}
.collapsed .nav-item{justify-content:center;padding:11px 0}
.collapsed .nav-item .badge{position:absolute;top:4px;right:14px}
.collapsed .user{justify-content:center}

.nav{flex:1;overflow-y:auto;overflow-x:hidden;padding:6px 12px 12px}
.nav::-webkit-scrollbar-thumb{background:rgba(255,255,255,.2)}
.nav-group{font-size:.7rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:#8FA6CF;padding:18px 10px 6px}
.nav-item{position:relative;display:flex;align-items:center;gap:12px;width:100%;padding:10px 12px;border:0;background:transparent;border-radius:12px;color:#D6E2F6;font-weight:600;font-size:.88rem;text-align:left;transition:background .15s,color .15s}
.nav-item i{width:18px;text-align:center;font-size:.95rem;color:#9FB4D8}
.nav-item:hover{background:rgba(255,255,255,.07);color:#fff}
.nav-item.active{background:#fff;color:var(--azul9);box-shadow:0 6px 16px rgba(0,0,0,.18)}
.nav-item.active i{color:var(--azul)}
.nav-item.active::before{content:"";position:absolute;left:-12px;top:10px;bottom:10px;width:4px;border-radius:0 4px 4px 0;background:var(--oro)}
.nav-label{flex:1;white-space:normal;line-height:1.2}
.badge{background:var(--rojoCali);color:#fff;border-radius:20px;font-size:.68rem;font-weight:700;padding:1px 7px}

.user{display:flex;align-items:center;gap:10px;padding:14px 14px;border-top:1px solid rgba(255,255,255,.1)}
.avatar{width:38px;height:38px;border-radius:50%;background:rgba(255,255,255,.12);display:flex;align-items:center;justify-content:center;color:#fff;flex:none}
.user-t{flex:1;min-width:0}
.user-t b{display:block;font-size:.8rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.user-t small{color:#B9CBEA;font-size:.72rem}

.topbar{position:sticky;top:0;z-index:40;display:flex;align-items:center;gap:12px;padding:14px 26px;padding-top:calc(14px + env(safe-area-inset-top,0px));background:rgba(243,245,250,.9);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}
.tb-shield{display:none;width:34px;height:38px;flex:none}
.tb-shield img{width:100%;height:100%;object-fit:contain}
.burger{display:none}
.title{min-width:0}
.title h2{font-size:1.22rem}
.title small{color:var(--soft);font-size:.78rem}
.spacer{flex:1}
.mode{font-size:.7rem;font-weight:700;padding:5px 10px;border-radius:20px;display:inline-flex;gap:7px;align-items:center;white-space:nowrap}
.mode .dot{width:7px;height:7px;border-radius:50%;background:currentColor;animation:pulse 1.6s infinite}
.mode.live{color:var(--glow);background:var(--gdim)}
.mode.demo{color:var(--yelink);background:var(--yelbg)}
.mode.off{color:var(--redink);background:var(--redbg)}
@keyframes pulse{50%{opacity:.35}}

select,input,textarea{font:inherit;color:var(--ink);background:var(--panel);border:1px solid var(--line2);border-radius:10px;padding:10px 12px;outline:none;width:100%}
select{appearance:none;-webkit-appearance:none;padding-right:30px;background-image:linear-gradient(45deg,transparent 50%,var(--soft) 50%),linear-gradient(135deg,var(--soft) 50%,transparent 50%);background-position:calc(100% - 15px) 50%,calc(100% - 10px) 50%;background-size:5px 5px;background-repeat:no-repeat}
input:focus,select:focus,textarea:focus{border-color:var(--azul2);box-shadow:0 0 0 3px rgba(47,102,201,.18)}
input::placeholder,textarea::placeholder{color:#97A2B5}
textarea{resize:vertical;min-height:84px}
input[type=range]{padding:0;border:0;background:transparent;box-shadow:none}
.topbar select{width:auto;padding:8px 30px 8px 12px}

.banner{margin:16px 26px 0;padding:11px 14px;border-radius:12px;font-size:.82rem;border:1px solid #F5D894;background:var(--yelbg);color:var(--yelink)}
.content{padding:20px 26px 48px;max-width:1280px;width:100%}

/* ---------- Componentes ---------- */
.card{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:18px;box-shadow:var(--shadow)}
.card h3{font-size:1rem;margin-bottom:4px}
.card .sub{color:var(--soft);font-size:.8rem;margin-bottom:14px}
.grid{display:grid;gap:12px}
.g-kpi{grid-template-columns:repeat(auto-fit,minmax(160px,1fr))}
.g-2{grid-template-columns:repeat(auto-fit,minmax(340px,1fr))}
.kpi{position:relative;padding:14px 16px;overflow:hidden}
.kpi::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--azul)}
.kpi small{display:block;font-size:.74rem;font-weight:600;color:var(--soft);margin-bottom:6px}
.kpi b{font-family:Archivo,Inter,sans-serif;font-size:1.9rem;font-weight:800;line-height:1;letter-spacing:-.03em;color:var(--azul9)}
.kpi .kpi-of{font-size:.95rem;color:var(--faint);font-weight:700}
.kpi.r::before{background:var(--rojoCali)}.kpi.r b{color:var(--redink)}
.kpi.y::before{background:var(--yel)}.kpi.y b{color:var(--yelink)}
.kpi.g::before{background:var(--verdeCali)}.kpi.g b{color:var(--glow)}

.pill{display:inline-flex;align-items:center;gap:6px;border-radius:20px;padding:3px 10px;font-size:.7rem;font-weight:700;white-space:nowrap}
.pill i{width:7px;height:7px;border-radius:50%;background:currentColor}
.pill.rojo{background:var(--redbg);color:var(--redink)}.pill.rojo i{animation:pulse 1.3s infinite}
.pill.amarillo{background:var(--yelbg);color:var(--yelink)}
.pill.verde{background:var(--gdim);color:var(--glow)}
.pill.neutral{background:var(--bg2);color:var(--soft)}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1px solid var(--line2);background:var(--panel);color:var(--azul9);padding:10px 15px;border-radius:11px;font-weight:600;font-size:.85rem;transition:.15s;white-space:nowrap;text-decoration:none;min-height:40px}
.btn:hover{border-color:var(--azul2);color:var(--azul)}
.btn.primary{background:var(--azul);border-color:transparent;color:#fff;box-shadow:0 6px 16px rgba(11,61,145,.25)}
.btn.primary:hover{background:var(--azul7);color:#fff}
.btn.danger{background:var(--rojoCali);border-color:transparent;color:#fff;box-shadow:0 6px 16px rgba(210,31,60,.22)}
.btn.danger:hover{background:#B0172F;color:#fff}
.btn.sm{padding:7px 11px;font-size:.78rem;border-radius:9px;min-height:34px}
.btn:disabled{opacity:.45;cursor:not-allowed}

.toolbar{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:14px;align-items:center}
.toolbar .grow{flex:1;min-width:200px;position:relative}
.toolbar .grow i{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--faint)}
.toolbar .grow input{padding-left:36px}
.toolbar select{width:auto;min-width:150px}

.tbl-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:14px;background:var(--panel);-webkit-overflow-scrolling:touch}
.tbl{width:100%;border-collapse:collapse;min-width:760px}
.tbl th{font-size:.72rem;font-weight:700;color:var(--soft);text-align:left;padding:11px 14px;background:var(--panel2);border-bottom:1px solid var(--line);white-space:nowrap}
.tbl td{padding:12px 14px;border-bottom:1px solid var(--line);vertical-align:top;font-size:.85rem}
.tbl tr:last-child td{border-bottom:0}
.tbl tbody tr.click{cursor:pointer}
.tbl tbody tr.click:hover{background:#F2F6FD}
.tbl .asunto{max-width:340px;color:var(--soft);line-height:1.35}
.muted{color:var(--soft)}.faint{color:var(--faint)}
.right{text-align:right}

.field{margin-bottom:14px}
.field label{display:block;font-size:.75rem;font-weight:600;color:var(--soft);margin-bottom:6px}
.field .hint{font-size:.75rem;color:var(--faint);margin-top:5px}
.field .err,.hint.err{font-size:.76rem;color:var(--redink);margin-top:5px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:12px}

.bar{display:flex;height:10px;border-radius:8px;overflow:hidden;background:var(--bg2)}
.bar span{display:block;height:100%}
.bar .rojo{background:var(--rojoCali)}.bar .amarillo{background:var(--yel)}.bar .verde{background:var(--verdeCali)}
.list-row{display:flex;align-items:center;gap:12px;padding:11px 0;border-bottom:1px solid var(--line)}
.list-row:last-child{border-bottom:0}
.list-row .grow{flex:1;min-width:0}
.list-row b{display:block;font-size:.86rem}
.list-row small{color:var(--soft);font-size:.77rem}
.ellipsis{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

.empty{text-align:center;padding:42px 16px;color:var(--soft)}
.empty i{font-size:2rem;color:#B3BCCB;margin-bottom:10px;display:block}

.alert-card{border:1px solid #F3C2CA;background:#FFF7F8;border-radius:16px;padding:14px 16px;margin-bottom:12px}
.alert-card.venc{border-color:var(--rojoCali);box-shadow:0 0 0 1px rgba(210,31,60,.2)}

dl.kv{margin:0}
dl.kv div{display:flex;justify-content:space-between;gap:16px;padding:9px 0;border-bottom:1px solid var(--line)}
dl.kv div:last-child{border-bottom:0}
dl.kv dt{color:var(--soft);font-weight:600;font-size:.82rem}
dl.kv dd{margin:0;font-weight:600;text-align:right;font-size:.85rem;word-break:break-word}
.chain-ok{border-color:var(--verdeCali)!important}
.chain-bad{border-color:var(--rojoCali)!important}

/* ---------- Modal / avisos / ingreso ---------- */
.overlay{position:fixed;inset:0;background:rgba(4,26,64,.5);backdrop-filter:blur(3px);z-index:90;display:flex;align-items:center;justify-content:center;padding:16px}
.modal{background:var(--panel);border-radius:20px;width:min(560px,100%);max-height:92vh;overflow:auto;box-shadow:0 30px 80px rgba(4,26,64,.4)}
.modal header{position:sticky;top:0;z-index:2;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:16px 20px;background:var(--azul9);color:#fff}
.modal header h3{color:#fff;font-size:1.02rem}
.modal header .icon-btn{background:rgba(255,255,255,.12);border-color:transparent;color:#fff}
.modal .body{padding:18px 20px}
.modal footer{position:sticky;bottom:0;display:flex;flex-wrap:wrap;justify-content:flex-end;gap:10px;padding:14px 20px;border-top:1px solid var(--line);background:var(--panel)}
#toasts{position:fixed;top:calc(14px + env(safe-area-inset-top,0px));right:14px;z-index:200;display:flex;flex-direction:column;gap:8px;width:min(92vw,380px);pointer-events:none}
.toast{background:var(--azul9);color:#fff;border-radius:12px;padding:12px 14px;font-size:.85rem;font-weight:600;display:flex;gap:10px;align-items:flex-start;box-shadow:0 12px 30px rgba(4,26,64,.35);animation:tin .22s ease}
.toast.err{background:#9E1028}
.toast i{margin-top:2px;color:#7CE0A6}.toast.err i{color:#FFC2CB}
@keyframes tin{from{opacity:0;transform:translateY(-8px)}}
.login{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;background:radial-gradient(90% 60% at 100% 0%,rgba(52,110,214,.45),transparent 60%),linear-gradient(180deg,var(--azul9),var(--azul10))}
.login .card{width:min(420px,100%);padding:30px;border:0;border-top:5px solid var(--oro)}
.login .shield{width:74px;height:82px;margin:0 auto 14px}

.mobile-ov{display:none}

/* ---------- Cumplimiento / histórico ---------- */
.stack{display:flex;height:12px;border-radius:8px;overflow:hidden;background:var(--bg2);min-width:120px}
.stack span{display:block;height:100%}
.stack .ok{background:#4FB57C}.stack .tar{background:#F2B230}.stack .sin{background:#E0566B}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:.76rem;color:var(--soft);margin:2px 0 12px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;vertical-align:-1px}
.top3{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));margin-bottom:14px}
.top-card{border:1px solid #F3C2CA;background:linear-gradient(180deg,#fff,#FFF5F6);border-radius:16px;padding:14px 16px}
.top-card .n{font-family:Archivo,Inter,sans-serif;font-size:2rem;font-weight:800;color:var(--redink);line-height:1}
.top-card b{display:block;font-size:.88rem;margin:8px 0 2px}
.seg{display:inline-flex;background:var(--bg2);border-radius:11px;padding:3px;gap:2px;flex-wrap:wrap}
.seg button{border:0;background:transparent;padding:8px 12px;font-size:.8rem;font-weight:600;color:var(--soft);border-radius:9px}
.seg button.on{background:var(--panel);color:var(--azul9);box-shadow:0 1px 3px rgba(19,32,58,.15)}
.pager{display:flex;gap:10px;align-items:center;justify-content:flex-end;margin-top:12px}
tr.click td .org{font-weight:600}
.tbl input{padding:7px 9px;font-size:.82rem;min-width:120px}

/* ---------- Directorio ---------- */
.warn-card{border-color:#F5D894;background:#FFFBF0}
.warn-card h3{color:var(--yelink)}
.dir-list{display:grid;gap:10px;grid-template-columns:repeat(auto-fill,minmax(330px,1fr))}
.dir-row{padding:14px 16px}
.dir-h{display:flex;align-items:flex-start;justify-content:space-between;gap:10px;flex-wrap:wrap}
.dir-org{display:block;font-size:.92rem;color:var(--azul9);margin-bottom:6px;line-height:1.25}
.dir-f{display:grid;grid-template-columns:1fr;gap:0;margin-top:12px}
.dir-f .field{margin-bottom:10px}
.dir-f .ro{padding:9px 0;font-weight:600}
.dir-a{display:flex;gap:8px;flex-wrap:wrap}

/* =====================================================================
   CENTRO DE MANDO
   ===================================================================== */
.cmd{position:relative;color:#fff;border-radius:22px;overflow:hidden;contain:paint;max-width:100%;margin-bottom:14px;padding:18px 18px 0;
  background:radial-gradient(90% 60% at 100% 0%,rgba(52,110,214,.45),transparent 60%),radial-gradient(60% 45% at 0% 100%,rgba(47,102,201,.22),transparent 60%),linear-gradient(180deg,#06204D,#030F2A);box-shadow:0 14px 40px rgba(6,36,86,.25)}
.cmd::before{content:"";position:absolute;inset:0;pointer-events:none;opacity:.4;background-image:linear-gradient(rgba(255,255,255,.05) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.05) 1px,transparent 1px);background-size:24px 24px;-webkit-mask-image:linear-gradient(180deg,#000 10%,transparent 70%);mask-image:linear-gradient(180deg,#000 10%,transparent 70%)}
.cmd>*{position:relative}
.cmd-line{display:flex;align-items:center;gap:8px;font-size:.78rem;color:#B9CBEA}
.live{width:8px;height:8px;border-radius:50%;background:#3BE07E;box-shadow:0 0 0 0 rgba(59,224,126,.7);animation:live 2s infinite;flex:none}
@keyframes live{70%{box-shadow:0 0 0 8px rgba(59,224,126,0)}100%{box-shadow:0 0 0 0 rgba(59,224,126,0)}}
.cmd-fig{display:flex;align-items:flex-end;gap:16px;margin-top:6px;flex-wrap:wrap}
.big{font:800 88px/.9 Archivo,Inter,-apple-system,"Segoe UI",sans-serif;letter-spacing:-.055em;color:#fff}
.big sup{font-size:34px;letter-spacing:-.02em;vertical-align:top;position:relative;top:12px;margin-left:3px;color:#B9CBEA}
.cmd-fig p{margin:0 0 8px;font-size:.88rem;color:#D6E2F6;max-width:300px;line-height:1.4}
.cmd-fig p b{color:#fff}
.states{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:16px}
.st{display:flex;flex-direction:column;align-items:flex-start;padding:9px 11px;border-radius:12px;background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.12);text-align:left;color:#fff;transition:background .2s,border-color .2s}
.st:hover{background:rgba(255,255,255,.12)}
.st b{font:800 22px/1 Archivo,Inter,sans-serif}
.st[data-s=rojo] b{color:#FF8A99}.st[data-s=amarillo] b{color:#FFD27A}.st[data-s=verde] b{color:#6EF0B8}.st[data-s=gris] b{color:#B9CBEA}
.st span{display:flex;align-items:center;gap:6px;margin-top:5px;font-size:.72rem;color:#C9D7EE;white-space:nowrap}
.st span i{width:9px;height:9px;border-radius:3px}
.sw-r{background:#FF5C70;box-shadow:0 0 8px rgba(255,92,112,.8)}.sw-y{background:#FFC44D;box-shadow:0 0 8px rgba(255,196,77,.7)}.sw-g{background:#38D99A;box-shadow:0 0 8px rgba(56,217,154,.7)}.sw-n{background:#8FA3C4}
.st[aria-pressed="true"]{background:rgba(255,255,255,.2);border-color:rgba(255,255,255,.6)}
.cmd-h{display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap;margin:20px 0 8px;font-size:.76rem;color:#B9CBEA}
.cmd-h b{font-size:.95rem;color:#fff}
.tmbar{display:flex;gap:12px;align-items:center;margin:0 0 12px;flex-wrap:wrap}
.tmbar .btn{background:rgba(255,255,255,.1);border-color:rgba(255,255,255,.2);color:#fff;box-shadow:none}
.tmbar .btn:hover{background:rgba(255,255,255,.18);color:#fff}
.tmbar input[type=range]{flex:1;min-width:140px;accent-color:var(--oro)}
.tmlabel{font-size:.78rem;color:var(--oro);white-space:nowrap;font-weight:600}
.tm{display:grid;grid-template-columns:repeat(auto-fill,minmax(118px,1fr));gap:7px}
.tile{position:relative;min-height:96px;border:1px solid rgba(255,255,255,.08);border-radius:12px;padding:10px 11px 12px;text-align:left;display:flex;flex-direction:column;justify-content:space-between;gap:6px;overflow:hidden;color:#E6EEFB;
  background:linear-gradient(180deg,rgba(255,255,255,.06),rgba(255,255,255,.02));backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);
  transition:opacity .25s,transform .25s,filter .25s,border-color .45s,box-shadow .45s,background .45s;--c:148,163,184}
.tile::before{content:"";position:absolute;left:0;right:0;top:0;height:2px;background:rgb(var(--c));opacity:.9;box-shadow:0 0 12px rgba(var(--c),.8)}
.tile b{font-size:.78rem;line-height:1.18;font-weight:600;color:#DCE6F7;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.tile .tl-f{display:flex;align-items:baseline;justify-content:space-between;gap:6px}
.tile .num{font:800 1.2rem/1 Archivo,Inter,sans-serif;letter-spacing:-.02em;color:rgb(var(--c));text-shadow:0 0 14px rgba(var(--c),.45)}
.tile small{white-space:nowrap;flex:none;font-size:.64rem;font-weight:600;color:rgba(220,230,247,.6);font-family:"JetBrains Mono",ui-monospace,monospace}
.tile .tl-bar{position:absolute;left:0;bottom:0;height:3px;background:rgb(var(--c));box-shadow:0 0 10px rgba(var(--c),.7);transition:width .45s}
.tile.rojo{--c:255,92,112;border-color:rgba(255,92,112,.45);background:linear-gradient(180deg,rgba(255,92,112,.16),rgba(255,92,112,.03));box-shadow:0 0 22px rgba(255,92,112,.12),inset 0 0 0 1px rgba(255,92,112,.08)}
.tile.amarillo{--c:255,196,77;border-color:rgba(255,196,77,.35);background:linear-gradient(180deg,rgba(255,196,77,.12),rgba(255,196,77,.02))}
.tile.verde{--c:56,217,154;border-color:rgba(56,217,154,.35);background:linear-gradient(180deg,rgba(56,217,154,.12),rgba(56,217,154,.02))}
.tile.gris{--c:120,138,168;border-style:dashed;border-color:rgba(255,255,255,.16);background:rgba(255,255,255,.03)}
.tile.gris::before,.tile.gris .tl-bar{display:none}
.tile.gris .num{color:#8FA3C4;text-shadow:none}
.tile.rojo::after{content:"";position:absolute;top:10px;right:10px;width:6px;height:6px;border-radius:50%;background:rgb(255,92,112);box-shadow:0 0 0 0 rgba(255,92,112,.7);animation:live 2s infinite}
.tile:hover{transform:translateY(-2px);border-color:rgba(var(--c),.8);box-shadow:0 8px 26px rgba(var(--c),.22)}
.tm.filtering .tile:not(.match){opacity:.16;filter:saturate(.2)}
.tm.reveal .tile{animation:pop .5s cubic-bezier(.2,.8,.2,1) both;animation-delay:calc(var(--i) * 20ms)}
@keyframes pop{from{opacity:0;transform:translateY(8px) scale(.94)}}
.cmd-legend{font-size:.72rem;color:#9FB4D8;margin:10px 0 0}
.ticker{position:relative;contain:paint;margin:16px -18px 0;border-top:1px solid rgba(255,255,255,.12);background:rgba(4,26,64,.65);overflow:hidden;white-space:nowrap}
.tk-lbl{position:absolute;left:0;top:0;bottom:0;z-index:2;display:flex;align-items:center;padding:0 12px 0 18px;background:var(--azul10);box-shadow:16px 0 14px var(--azul10);font-size:.72rem;font-weight:700;color:var(--oro)}
.tk-track{display:inline-flex;gap:30px;padding:12px 0 12px 130px;animation:run 70s linear infinite;font-size:.8rem;color:#D6E2F6}
.tk-track b{color:#fff}
.tk-track em{font-style:normal;font-family:"JetBrains Mono",ui-monospace,monospace;font-size:.74rem;color:#9FB4D8;margin-left:4px}
@keyframes run{to{transform:translateX(-50%)}}
.trio{display:grid;grid-template-columns:repeat(3,1fr);background:var(--panel);border:1px solid var(--line);border-radius:16px;overflow:hidden;margin-bottom:14px;box-shadow:var(--shadow)}
.trio button{background:none;border:0;border-left:1px solid var(--line);padding:13px 14px;text-align:left}
.trio button:first-child{border-left:0}
.trio button:hover{background:var(--panel2)}
.trio b{display:block;font:800 1.6rem/1.05 Archivo,Inter,sans-serif;letter-spacing:-.03em}
.trio small{display:block;font-size:.74rem;color:var(--soft);margin-top:4px;line-height:1.25}
.t-r{color:var(--redink)}.t-y{color:var(--yelink)}.t-b{color:var(--azul)}
.brief{position:relative;margin-bottom:14px;overflow:hidden;padding-left:22px}
.brief::before{content:"";position:absolute;left:0;top:0;bottom:0;width:5px;background:linear-gradient(180deg,#2F66C9 0 30%,var(--rojoCali) 30% 40%,#fff 40% 60%,var(--rojoCali) 60% 70%,#1FA557 70%)}
.brief-h{display:flex;align-items:center;gap:8px;font-size:.78rem;font-weight:700;color:var(--azul);margin-bottom:8px}
.brief p{margin:0 0 9px;font-size:.92rem;line-height:1.55}
.brief mark{background:none;color:var(--azul);font-weight:700}
.brief mark.r{color:var(--redink)}
.brief-a{display:flex;gap:8px;flex-wrap:wrap;margin-top:6px}

/* ---------- Barra de pestañas del celular ---------- */
.tabbar{display:none}

/* ---------- Informe ejecutivo ---------- */
.paper{background:#fff;color:#13203A;border-radius:12px;max-width:860px;margin:0 auto;padding:34px 40px;font-family:Arial,Helvetica,sans-serif;font-size:12.5px;line-height:1.5;box-shadow:0 12px 40px rgba(19,32,58,.15);border:1px solid var(--line);-webkit-user-select:text;user-select:text}
.paper h1{font-family:Arial,Helvetica,sans-serif;font-size:20px;line-height:1.2;margin:4px 0 6px;color:#0B3D91;letter-spacing:0}
.paper h2{font-family:Arial,Helvetica,sans-serif;font-size:14px;margin:0 0 10px;color:#0B3D91;border-bottom:2px solid #2F66C9;padding-bottom:5px;letter-spacing:0}
.paper h3{font-family:Arial,Helvetica,sans-serif;font-size:12.5px;margin:14px 0 8px;color:#0B3D91;letter-spacing:0}
.paper p{margin:0 0 9px}
.rsec{margin:0 0 20px}
.rhead{display:flex;gap:16px;align-items:center;border-bottom:3px solid #D4A72C;padding-bottom:14px}
.rsmall{font-size:10.5px;color:#55627A}
.rgrid{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin-bottom:12px}
.rk{border:1px solid #DDE3EC;border-radius:8px;padding:8px 10px;background:#F6F8FC}
.rk span{display:block;font-size:9.5px;text-transform:uppercase;letter-spacing:.04em;color:#55627A;margin-bottom:3px}
.rk b{font-size:18px}
.rt{width:100%;border-collapse:collapse;font-size:10.5px}
.rt th{background:#EAF1FB;color:#0B3D91;text-align:left;padding:6px 7px;border:1px solid #DDE3EC}
.rt td{padding:5px 7px;border:1px solid #E6EAF2;vertical-align:top}
.rt tr{break-inside:avoid;page-break-inside:avoid}
.rflow{break-inside:auto!important;page-break-inside:auto!important}
.rfoot{font-size:9.5px;color:#55627A;border-top:1px solid #DDE3EC;padding-top:8px}
@media print{
  @page{size:A4;margin:12mm 11mm}
  html,body{background:#fff!important}
  .app{display:block!important}
  .sidebar,.topbar,.banner,.no-print,#toasts,.mobile-ov,#modalRoot,.toolbar,.tabbar{display:none!important}
  .main,.content{padding:0!important;max-width:none!important;margin:0!important}
  .paper{box-shadow:none!important;border:0!important;border-radius:0!important;max-width:none!important;padding:0!important}
  .paper,.paper *{-webkit-print-color-adjust:exact;print-color-adjust:exact}
  .rsec{break-inside:avoid;page-break-inside:avoid}
  .rsec.rflow{break-inside:auto;page-break-inside:auto}
  .card{box-shadow:none}
}
@media (max-width:700px){ .paper{padding:20px 16px}.rgrid{grid-template-columns:repeat(2,1fr)} }

/* ---------- Celular ---------- */
@media (max-width:960px){
  .sidebar{position:fixed;left:0;top:0;transform:translateX(-102%);transition:transform .25s cubic-bezier(.2,.8,.2,1);width:min(var(--side),86vw)!important;box-shadow:20px 0 60px rgba(4,26,64,.45);padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
  .open .sidebar{transform:none}
  .collapsed .brand-t,.collapsed .nav-group,.collapsed .nav-label,.collapsed .user-t,.collapsed .logout{display:revert}
  .collapsed .nav-item{justify-content:flex-start;padding:10px 12px}
  .open .mobile-ov{display:block;position:fixed;inset:0;background:rgba(4,26,64,.5);z-index:55}
  .burger{display:inline-flex}
  .tb-shield{display:block}
  .topbar{padding:10px 14px;padding-top:calc(10px + env(safe-area-inset-top,0px));gap:10px;flex-wrap:wrap;background:var(--azul9);border-bottom:0;color:#fff}
  .topbar::after{content:"";position:absolute;left:0;right:0;bottom:-4px;height:4px;background:linear-gradient(90deg,#2F66C9 0 30%,var(--rojoCali) 30% 37%,#fff 37% 63%,var(--rojoCali) 63% 70%,#1FA557 70%)}
  .topbar .icon-btn{background:rgba(255,255,255,.1);border-color:transparent;color:#fff}
  .title{flex:1}
  .title h2{font-size:1.05rem;color:#fff;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .title small{display:none}
  .topbar .spacer{display:none}
  .topbar select{background-color:rgba(255,255,255,.1);border-color:rgba(255,255,255,.2);color:#fff;font-size:.8rem;padding:7px 28px 7px 10px;background-image:linear-gradient(45deg,transparent 50%,#fff 50%),linear-gradient(135deg,#fff 50%,transparent 50%)}
  .topbar select option{color:#13203A}
  .mode.demo{background:rgba(242,178,48,.2);color:#FFD27A}.mode.live{background:rgba(59,224,126,.18);color:#8AF0B4}
  .content{padding:18px 14px calc(var(--tab-h) + 30px + env(safe-area-inset-bottom,0px))}
  .banner{margin:16px 14px 0}
  #btnCollapse{display:none}
  .row2{grid-template-columns:1fr}
  .hide-m{display:none!important}
  .card{padding:15px;border-radius:16px}
  .g-kpi{grid-template-columns:repeat(2,1fr)}
  .kpi b{font-size:1.55rem}
  .g-2{grid-template-columns:1fr}
  .toolbar .grow{flex:1 1 100%;min-width:0}
  .toolbar select{flex:1;min-width:0;width:auto}
  .toolbar .btn{flex:1}
  .dir-list{grid-template-columns:1fr}
  .tabbar{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;position:fixed;left:10px;right:10px;bottom:calc(10px + env(safe-area-inset-bottom,0px));z-index:50;background:rgba(6,36,86,.95);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-radius:20px;padding:6px;box-shadow:0 14px 34px rgba(6,36,86,.38)}
  .tab{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;border:0;background:none;color:#A9BDE0;font-size:.66rem;font-weight:600;padding:8px 2px 7px;border-radius:14px;min-height:50px}
  .tab i{font-size:1.05rem}
  .tab.on{background:rgba(255,255,255,.14);color:#fff}
  .open .tabbar{display:none}
  #toasts{top:auto;bottom:calc(var(--tab-h) + 24px + env(safe-area-inset-bottom,0px));left:14px;right:14px;width:auto}
  .overlay{align-items:flex-end;padding:0}
  .modal{width:100%!important;max-height:92vh;border-radius:22px 22px 0 0}
  .modal footer{padding-bottom:calc(14px + env(safe-area-inset-bottom,0px))}
  .modal footer .btn{flex:1}
}
@media (max-width:420px){
  .big{font-size:76px}
  .states{grid-template-columns:repeat(4,1fr);gap:6px}
  .st{padding:8px}
  .st b{font-size:19px}
  .tm{grid-template-columns:repeat(3,1fr);gap:6px}
  .tile{min-height:92px;padding:8px}
  .tile b{font-size:.72rem}
  .tile .num{font-size:.95rem}
  .tile small{font-size:.58rem}
  .trio b{font-size:1.35rem}
}
@media (prefers-reduced-motion:reduce){
  .live,.tile.rojo::after,.tk-track,.pill.rojo i,.mode .dot{animation:none}
  .tm.reveal .tile{animation:none}
  .sidebar{transition:none}
}
@media print{.sidebar,.topbar,.banner,.toolbar,.no-print,.tabbar{display:none!important}body{background:#fff;color:#000}.content{padding:0}}

function diff(a,b){ const o={}; new Set([...Object.keys(a||{}),...Object.keys(b||{})]).forEach(k=>{ if(JSON.stringify((a||{})[k])!==JSON.stringify((b||{})[k])) o[k]={de:(a||{})[k]===undefined?null:a[k],a:(b||{})[k]===undefined?null:b[k]}; }); return o; }
async function demoAudit(tabla, accion, regId, payload, usuario, cambios){
  const prev = DEMO.audit.length ? DEMO.audit[DEMO.audit.length-1].hash : '0'.repeat(64);
  const ts = new Date().toISOString();
  const row = { id:DEMO.audit.length+1, tabla, accion, registro_id:String(regId), usuario:usuario||'demo@cali.gov.co', payload:JSON.parse(JSON.stringify(payload)), cambios:cambios||{}, prev_hash:prev, created_at:ts };
  row.hash = await sha256Hex([prev,tabla,accion,row.registro_id,row.usuario,ts,JSON.stringify(row.payload),JSON.stringify(row.cambios)].join('|'));
  DEMO.audit.push(row);
}

const db = {
  async catalogs(){
    if(S.demo){ S.entes = DEMO.entes.slice(); S.deps = DEMO.deps.slice(); S.cfg = {...DEMO.cfg}; return; }
    const [e,d,c] = await Promise.all([
      sb.from('entes').select('*').order('nombre'),
      sb.from('dependencias').select('*').order('nombre'),
      sb.from('config').select('*').eq('id',1).maybeSingle()
    ]);
    if(e.error) throw e.error; if(d.error) throw d.error;
    S.entes = e.data; S.deps = d.data; if(c.data) S.cfg = c.data;
  },
  async reqs(vig){
    if(S.demo){
      let list = DEMO.reqs.filter(r=>r.vigencia===vig);
      if(['secretario','enlace'].includes(rol()) && S.profile.dependencia_id) list = list.filter(r=>r.dependencia_id===S.profile.dependencia_id);
      return list.map(r=>({...r}));
    }
    let from=0, out=[];
    for(;;){
      const {data,error} = await sb.from('v_requerimientos').select('*').eq('vigencia',vig).order('fecha_limite').order('id').range(from,from+999);
      if(error) throw error;
      out = out.concat(data); if(data.length<1000) break; from+=1000;
    }
    return out;
  },
  async createReq(o){
    if(S.demo){
      if(DEMO.reqs.some(r=>r.radicado===o.radicado)) throw new Error('El radicado '+o.radicado+' ya existe');
      const r = {...o, id:'d'+Date.now(), estado:'abierto', orfeo_salida:null, fecha_cierre:null, soporte_path:null, soporte_hash:null, escalado_at:null};
      DEMO.reqs.push(r); await demoAudit('requerimientos','INSERT',r.id,r,S.user.email); return r;
    }
    const {data,error} = await sb.from('requerimientos').insert(o).select().single();
    if(error) throw dbErr(error); return data;
  },
  async closeReq(r, orfeo, fecha, file){
    let path=null, hash=null;
    if(file){ hash = await sha256Hex(await file.arrayBuffer()); }
    if(S.demo){
      if(DEMO.reqs.some(x=>x.orfeo_salida===orfeo)) throw new Error('El radicado ORFEO '+orfeo+' ya fue registrado en otro requerimiento');
      const t = DEMO.reqs.find(x=>x.id===r.id);
      const antes={...t}; Object.assign(t,{estado:'cerrado',orfeo_salida:orfeo,fecha_cierre:fecha,soporte_hash:hash,soporte_path:file?file.name:null});
      await demoAudit('requerimientos','UPDATE',t.id,t,S.user.email,diff(antes,t)); return {hash};
    }
    if(file){
      path = `${r.vigencia}/${r.radicado}_${Date.now()}.pdf`;
      const up = await sb.storage.from('soportes').upload(path, file, {contentType:'application/pdf', upsert:false});
      if(up.error) throw new Error('No se pudo subir el PDF: '+up.error.message);
    }
    const {error} = await sb.rpc('cerrar_requerimiento',{p_id:r.id,p_orfeo:orfeo,p_fecha:fecha,p_path:path,p_hash:hash});
    if(error){ if(path) await sb.storage.from('soportes').remove([path]); throw dbErr(error); }
    return {hash};
  },
  async escalate(r, canal){
    if(S.demo){
      const t = DEMO.reqs.find(x=>x.id===r.id); t.escalado_at = new Date().toISOString();
      DEMO.alertas.push({requerimiento_id:r.id,canal}); await demoAudit('alertas_log','INSERT',DEMO.alertas.length,{requerimiento_id:r.id,canal},S.user.email); return;
    }
    const {error} = await sb.rpc('escalar_requerimiento',{p_id:r.id,p_canal:canal});
    if(error) throw dbErr(error);
  },
  async audit(){
    if(S.demo) return DEMO.audit.slice().reverse().slice(0,300);
    const {data,error} = await sb.from('audit_log').select('*').order('id',{ascending:false}).limit(300);
    if(error) throw error; return data;
  },
  async verify(){
    if(S.demo){
      let prev='0'.repeat(64);
      for(let i=0;i<DEMO.audit.length;i++){
        const r = DEMO.audit[i];
        const calc = await sha256Hex([prev,r.tabla,r.accion,r.registro_id,r.usuario,r.created_at,JSON.stringify(r.payload),JSON.stringify(r.cambios||{})].join('|'));
        if(r.prev_hash!==prev || r.hash!==calc) return {ok:false,total:i+1,primer_id_roto:r.id};
        prev = r.hash;
      }
      return {ok:true,total:DEMO.audit.length,primer_id_roto:null};
    }
    const {data,error} = await sb.rpc('verificar_cadena_auditoria');
    if(error) throw dbErr(error); return data[0];
  },
  async profiles(){
    if(S.demo) return DEMO.profiles.map(p=>({...p}));
    const {data,error} = await sb.from('profiles').select('*').order('email');
    if(error) throw error; return data;
  },
  async saveProfile(p){
    if(S.demo){ const t=DEMO.profiles.find(x=>x.id===p.id); const antes={...t}; Object.assign(t,p); await demoAudit('profiles','UPDATE',p.id,t,S.user.email,diff(antes,t)); return; }
    const {id,...rest} = p; const {error} = await sb.from('profiles').update(rest).eq('id',id);
    if(error) throw dbErr(error);
  },
  async saveCatalog(table, o){
    const list = table==='entes'?DEMO.entes:DEMO.deps;
    if(S.demo){
      const isUpd=!!o.id; let antes={};
      if(isUpd){ const t=list.find(x=>x.id===o.id); antes={...t}; Object.assign(t,o); }
      else { o.id = Math.max(0,...list.map(x=>x.id))+1; list.push({activo:true,...o}); }
      await demoAudit(table,isUpd?'UPDATE':'INSERT',o.id,o,S.user.email,isUpd?diff(antes,list.find(x=>x.id===o.id)):{}); return;
    }
    const q = o.id ? sb.from(table).update(o).eq('id',o.id) : sb.from(table).insert(o);
    const {error} = await q; if(error) throw dbErr(error);
  },
  async saveConfig(c){
    if(S.demo){ Object.assign(DEMO.cfg,c); return; }
    const {error} = await sb.from('config').update(c).eq('id',1); if(error) throw dbErr(error);
  },
  async signedUrl(path){
    const {data,error} = await sb.storage.from('soportes').createSignedUrl(path,300);
    if(error) throw error; return data.signedUrl;
  }
};
function dbErr(e){
  const m = e && e.message ? e.message : String(e);
  if(/duplicate key.*radicado/i.test(m)) return new Error('Ese radicado ya existe en el sistema');
  if(/duplicate key.*orfeo/i.test(m)) return new Error('Ese radicado ORFEO ya fue registrado en otro requerimiento');
  if(/row-level security/i.test(m)) return new Error('Tu rol no tiene permiso para esta operación');
  if(/duplicate key/i.test(m)) return new Error('Ya existe un registro con esos datos');
  return new Error(m);
}

function decorate(r){
  r.dias = daysUntil(r.fecha_limite);
  r.sem = r.estado==='cerrado' ? 'verde' : (r.dias <= (S.cfg.dias_rojo||5) ? 'rojo' : 'amarillo');
  r.venc = r.estado==='abierto' && r.dias<0;
  r.ente_n = (S.entes.find(e=>e.id===r.ente_id)||{}).nombre || r.ente || '—';
  r.ente_s = (S.entes.find(e=>e.id===r.ente_id)||{}).sigla || r.ente_sigla || '';
  r.dep_n = (S.deps.find(d=>d.id===r.dependencia_id)||{}).nombre || r.dependencia || '—';
  return r;
}

function go(view){
  stopPlay(); if(!NAV.some(g=>g.items.some(i=>i.id===view && i.roles.includes(rol())))) view=defaultView();
  S.view=view; if(location.hash!=='#'+view) history.replaceState(null,'','#'+view);
  document.getElementById('app').classList.remove('open');
  const t = TITLES[view]; $('#pageTitle').textContent=t[0]; $('#pageSub').textContent=t[1];
  $('#selVigencia').classList.toggle('hidden',['mando','dependencia','notificaciones','directorio','cumplimiento','historico','informe','actividad'].includes(view));
  renderNav(); render();
}
async function render(){
  const c = $('#content');
  const v = { tablero:vTablero, requerimientos:vReqs, carga:vCarga, alertas:vAlertas, entes:()=>vCatalog('entes'), dependencias:()=>vCatalog('dependencias'), mando:vMando, informe:vInforme, actividad:vActividad, dependencia:vDependencia, notificaciones:vNotificaciones, directorio:vDirectorio, reportes:vReportes, cumplimiento:vCumplimiento, historico:vHistorico, auditoria:vAuditoria, cuentas:vCuentas, config:vConfig }[S.view];
  try{ await v(c); }catch(e){ c.innerHTML=`<div class="empty"><i class="fa-solid fa-triangle-exclamation"></i>${esc(e.message||'Error')}</div>`; }
}

function vTablero(c){
  const k = counts(S.reqs), pct = k.total?Math.round(k.verde*100/k.total):0;
  const byEnte = {}; S.reqs.forEach(r=>{ (byEnte[r.ente_n]=byEnte[r.ente_n]||[]).push(r); });
  const enteRows = Object.entries(byEnte).sort((a,b)=>b[1].length-a[1].length).map(([n,l])=>{
    const q=counts(l);
    return `<div class="list-row" style="display:block"><div style="display:flex;justify-content:space-between;gap:10px;margin-bottom:7px"><b class="ellipsis" style="font-size:.84rem">${esc(n)}</b><span class="mono muted" style="font-size:.74rem;white-space:nowrap">${q.total} · <span style="color:var(--redink)">${q.rojo}</span> / <span style="color:var(--yelink)">${q.amarillo}</span> / <span style="color:var(--glow)">${q.verde}</span></span></div>
      <div class="bar"><span class="rojo" style="width:${q.rojo*100/q.total}%"></span><span class="amarillo" style="width:${q.amarillo*100/q.total}%"></span><span class="verde" style="width:${q.verde*100/q.total}%"></span></div></div>`;
  }).join('') || '<div class="empty"><i class="fa-solid fa-inbox"></i>Sin requerimientos en esta vigencia</div>';
  const prox = S.reqs.filter(r=>r.estado==='abierto').sort((a,b)=>a.dias-b.dias).slice(0,6).map(r=>`
    <div class="list-row"><div class="grow"><b class="ellipsis">${esc(r.dep_n)}</b><small class="mono">${esc(r.radicado)} · ${esc(r.ente_s||r.ente_n)}</small></div>
    <div style="text-align:right">${pill(r.sem)}<div class="muted" style="font-size:.72rem;margin-top:4px">${diasTxt(r.dias)}</div></div></div>`).join('') || '<div class="empty"><i class="fa-solid fa-champagne-glasses"></i>No hay requerimientos abiertos</div>';
  const byDep = {}; S.reqs.filter(r=>r.estado==='abierto').forEach(r=>{ const o=byDep[r.dep_n]=byDep[r.dep_n]||{n:0,rojo:0}; o.n++; if(r.sem==='rojo') o.rojo++; });
  const depRows = Object.entries(byDep).sort((a,b)=>b[1].rojo-a[1].rojo||b[1].n-a[1].n).slice(0,6).map(([n,o])=>`
    <div class="list-row"><div class="grow"><b class="ellipsis">${esc(n)}</b><small>${o.n} abierto(s)</small></div>${o.rojo?`<span class="pill rojo"><i></i>${o.rojo} CRÍTICO${o.rojo>1?'S':''}</span>`:'<span class="pill amarillo"><i></i>EN TÉRMINO</span>'}</div>`).join('') || '<div class="empty"><i class="fa-solid fa-circle-check"></i>Sin pendientes</div>';
  c.innerHTML = `
    <div class="grid g-kpi" style="margin-bottom:14px">
      <div class="card kpi"><small>Total solicitudes</small><b>${nf(k.total)}</b></div>
      <div class="card kpi r"><small>Críticas</small><b>${nf(k.rojo)}</b></div>
      <div class="card kpi y"><small>En término</small><b>${nf(k.amarillo)}</b></div>
      <div class="card kpi g"><small>Cerradas</small><b>${nf(k.verde)}</b></div>
      <div class="card kpi g"><small>Cumplimiento</small><b>${pct}%</b></div>
    </div>
    <div class="grid g-2">
      <div class="card"><h3>Semáforo por ente de control</h3><div class="sub">Crítico / En término / Cerrado</div>${enteRows}</div>
      <div class="card"><h3>Próximos vencimientos</h3><div class="sub">Umbral crítico: ${S.cfg.dias_rojo} días o menos</div>${prox}</div>
      <div class="card"><h3>Dependencias con pendientes</h3><div class="sub">Ordenadas por criticidad</div>${depRows}</div>
    </div>`;
}

function renderReqRows(){
  const q = S.f.q.toLowerCase().trim();
  const list = S.reqs.filter(r=>
    (!S.f.sem||r.sem===S.f.sem) && (!S.f.ente||String(r.ente_id)===S.f.ente) && (!S.f.dep||String(r.dependencia_id)===S.f.dep) &&
    (!q||[r.radicado,r.asunto,r.ente_n,r.dep_n,r.orfeo_salida].some(x=>String(x||'').toLowerCase().includes(q)))
  ).sort((a,b)=>({rojo:0,amarillo:1,verde:2}[a.sem]-{rojo:0,amarillo:1,verde:2}[b.sem])||a.dias-b.dias);
  $('#reqBody').innerHTML = list.length ? list.map(r=>`
    <tr class="click" data-act="detail" data-id="${esc(r.id)}">
      <td>${pill(r.sem)}</td><td class="mono">${esc(r.radicado)}</td>
      <td>${esc(r.ente_s||r.ente_n)}</td><td>${esc(r.dep_n)}</td><td class="asunto">${esc(r.asunto)}</td>
      <td style="white-space:nowrap">${fmtD(r.fecha_limite)}<div class="muted" style="font-size:.72rem">${r.estado==='abierto'?diasTxt(r.dias):'Cerrado '+fmtD(r.fecha_cierre)}</div></td>
      <td class="right">${r.estado==='abierto'&&canClose()?`<button class="btn sm" data-act="closeFor" data-id="${esc(r.id)}"><i class="fa-solid fa-check"></i> Cerrar</button>`:''}</td>
    </tr>`).join('') : `<tr><td colspan="7"><div class="empty"><i class="fa-solid fa-inbox"></i>Sin resultados</div></td></tr>`;

    <div class="row2">
      <div class="field"><label>Ente de control</label><select id="nrEnte">${opts(S.entes.filter(e=>e.activo!==false))}</select></div>

    </div><div id="nrErr" class="err hidden"></div>`,
    footer:`<button class="btn" data-act="closeModal">Cancelar</button><button class="btn primary" data-act="saveReq"><i class="fa-solid fa-floppy-disk"></i> Guardar</button>` });

async function saveReq(){
  const err = m => { const e=$('#nrErr'); e.textContent=m; e.classList.remove('hidden'); };
  const rad = $('#nrRad').value.trim().toUpperCase(), asu=$('#nrAsu').value.trim(), fr=$('#nrFr').value, fl=$('#nrFl').value;
  if(!/^[0-9]{4}[A-Z]{2}[0-9]{4,10}$/.test(rad)) return err('Radicado inválido. Ejemplo: '+S.vigencia+'EE004812');
  if(asu.length<4) return err('Escribe el asunto del requerimiento');
  if(!fr||!fl) return err('Completa las fechas');
  if(fl<fr) return err('La fecha límite no puede ser anterior a la radicación');
  if(S.reqs.some(r=>r.radicado===rad)) return err('Ese radicado ya existe en esta vigencia');
  try{
    await db.createReq({ radicado:rad, vigencia:parseD(fr).getFullYear(), ente_id:+$('#nrEnte').value, dependencia_id:+$('#nrDep').value, asunto:asu, fecha_radicacion:fr, fecha_limite:fl });
    closeModal(); toast('Requerimiento '+rad+' registrado'); await reload(); render();
  }catch(e){ err(e.message); }
}

function vCarga(c){
  const abiertos = S.reqs.filter(r=>r.estado==='abierto').sort((a,b)=>a.dias-b.dias);
  if(!abiertos.length){ c.innerHTML='<div class="card"><div class="empty"><i class="fa-solid fa-champagne-glasses"></i>No hay requerimientos abiertos en la vigencia '+S.vigencia+'</div></div>'; return; }
  const hoy = iso(new Date());
  c.innerHTML = `<div class="card" style="max-width:640px">
    <h3>Registrar respuesta ORFEO</h3><div class="sub">Vigencia <b class="mono" style="color:var(--glow)">${S.vigencia}</b> · el cierre queda firmado en la pista de auditoría</div>
    <form id="cargaForm" novalidate>
      <div class="field"><label>Requerimiento pendiente</label><select id="cSel">${abiertos.map(r=>`<option value="${esc(r.id)}"${String(r.id)===String(S.preselect)?' selected':''}>${esc(r.radicado)} · ${esc(r.ente_s||r.ente_n)} · ${esc(r.dep_n)} (${r.sem==='rojo'?'crítico':'en término'})</option>`).join('')}</select></div>
      <div class="field"><label>Radicado ORFEO de salida</label><input id="cOrfeo" class="mono" inputmode="numeric" placeholder="202641430100000171" maxlength="20"><div class="hint">Solo dígitos (10 a 20). Se valida contra duplicados.</div><div class="err hidden" id="cOrfeoErr"></div></div>
      <div class="row2">
        <div class="field"><label>Fecha de envío oficial</label><input id="cFecha" type="date" value="${hoy}" max="${hoy}"></div>
        <div class="field"><label>Soporte PDF</label><input id="cFile" type="file" accept="application/pdf,.pdf"><div class="hint">Máx. 10 MB · se calcula su huella SHA-256</div></div>
      </div>
      <div class="err hidden" id="cErr" style="margin-bottom:12px"></div>
      <button class="btn primary" id="cBtn" type="submit"><i class="fa-solid fa-check-circle"></i> Guardar y marcar en verde</button>
    </form></div>`;
  S.preselect = null;
  $('#cOrfeo').addEventListener('input',e=>{
    e.target.value = e.target.value.replace(/\D/g,'');
    const v=e.target.value, er=$('#cOrfeoErr'); let m='';
    if(v && DEMO_or_loaded(v)) m='Este ORFEO ya está asociado a otro requerimiento';
    er.textContent=m; er.classList.toggle('hidden',!m);
  });
  $('#cargaForm').addEventListener('submit', async ev=>{
    ev.preventDefault();
    const err=m=>{const e=$('#cErr');e.textContent=m;e.classList.remove('hidden');};
    $('#cErr').classList.add('hidden');
    const r = S.reqs.find(x=>String(x.id)===$('#cSel').value);
    const orfeo=$('#cOrfeo').value, fecha=$('#cFecha').value, file=$('#cFile').files[0];
    if(!/^[0-9]{10,20}$/.test(orfeo)) return err('El radicado ORFEO debe tener entre 10 y 20 dígitos');
    if(DEMO_or_loaded(orfeo)) return err('Este radicado ORFEO ya está asociado a otro requerimiento');
    if(!fecha) return err('Indica la fecha de envío');
    if(fecha>iso(new Date())) return err('La fecha de envío no puede ser futura');
    if(fecha<r.fecha_radicacion) return err('La fecha de envío no puede ser anterior a la radicación ('+fmtD(r.fecha_radicacion)+')');
    if(!file) return err('Adjunta el soporte en PDF');
    if(file.type!=='application/pdf' && !/\.pdf$/i.test(file.name)) return err('El soporte debe ser un archivo PDF');
    if(file.size>10*1024*1024) return err('El PDF supera los 10 MB');
    const head = new Uint8Array(await file.slice(0,5).arrayBuffer());
    if(String.fromCharCode(...head)!=='%PDF-') return err('El archivo no parece ser un PDF válido');
    const btn=$('#cBtn'); btn.disabled=true; btn.innerHTML='<i class="fa-solid fa-spinner fa-spin"></i> Guardando…';
    try{
      const res = await db.closeReq(r, orfeo, fecha, file);
      toast(`${r.radicado} cerrado · huella ${res.hash.slice(0,10)}…`);
      await reload(); go('requerimientos');
    }catch(e){ err(e.message); btn.disabled=false; btn.innerHTML='<i class="fa-solid fa-check-circle"></i> Guardar y marcar en verde'; }
  });
}
const DEMO_or_loaded = v => S.reqs.some(r=>r.orfeo_salida===v);

function waLink(r){
  const msg = `Cordial saludo. Se informa que el requerimiento ${r.radicado} del ente ${r.ente_n}, a cargo de ${r.dep_n}, `+
    (r.dias<0?`se encuentra vencido desde el ${fmtD(r.fecha_limite)}. `:`vence el ${fmtD(r.fecha_limite)} (${diasTxt(r.dias).toLowerCase()}). `)+
    `Asunto: ${r.asunto} Se solicita dar respuesta de manera prioritaria y registrar el radicado ORFEO de salida en el sistema Control de Entes.`;
  const _ct=(contactsOf(r.dep_n)[0]||{}), _tel=normPhone(_ct.telefono);
  return { msg, wa:'https://wa.me/'+_tel+'?text='+encodeURIComponent(msg),
           mail:'mailto:'+encodeURIComponent((S.deps.find(d=>d.id===r.dependencia_id)||{}).correo||'')+'?subject='+encodeURIComponent('Alerta de cumplimiento '+r.radicado)+'&body='+encodeURIComponent(msg) };
}

      <div class="sub" style="margin:4px 0 0">Cada envío por WhatsApp o correo abre tu aplicación con el mensaje redactado; luego registra el escalamiento para dejar trazabilidad.</div></div>

          ${r.escalado_at?`<span class="pill neutral">Escalado ${fmtTs(r.escalado_at)}</span>`:''}
          <span class="spacer"></span>
          <a class="btn sm" href="${l.wa}" target="_blank" rel="noopener" data-act="log" data-id="${esc(r.id)}" data-canal="whatsapp"><i class="fa-brands fa-whatsapp"></i> WhatsApp</a>
          <a class="btn sm" href="${l.mail}" data-act="log" data-id="${esc(r.id)}" data-canal="correo"><i class="fa-regular fa-envelope"></i> Correo</a>
          ${r.venc&&S.cfg.correo_disciplinario?`<a class="btn sm" href="mailto:${esc(S.cfg.correo_disciplinario)}?subject=${encodeURIComponent('Requerimiento vencido '+r.radicado)}&body=${encodeURIComponent(l.msg)}" data-act="log" data-id="${esc(r.id)}" data-canal="disciplinario"><i class="fa-solid fa-scale-balanced"></i> Control Disciplinario</a>`:''}
          ${canEscalate()&&!r.escalado_at?`<button class="btn sm danger" data-act="escalate" data-id="${esc(r.id)}">Registrar</button>`:''}
        </div>
      </div>`; }).join('')}`;

/* =====================================================================
   HISTÓRICO Y CUMPLIMIENTO POR SECRETARÍA (datos de los Excel 2024-2026)
   ===================================================================== */
const SEMP = {verde_lt:0.20, rojo_ge:0.40, min:10};   // umbrales del semáforo (mismos del Excel)
const OPO_PILL = [['verde','A TIEMPO'],['amarillo','TARDÍA'],['rojo','SIN RESPUESTA'],['neutral','PENDIENTE'],['neutral','SIN FECHA'],['neutral','NO REQUIERE']];
const C = {vig:'todas', niv:'principal', sort:'inc'};
const Hs = {q:'',vig:'todas',ente:'',org:'',opo:'',page:0};
const semOf = (ev,t)=> ev<SEMP.min?'muestra':(t>=SEMP.rojo_ge?'rojo':(t<SEMP.verde_lt?'verde':'amarillo'));
const semPill = s => s==='muestra' ? '<span class="pill neutral">MUESTRA INSUFICIENTE</span>' : `<span class="pill ${s}"><i></i>${s.toUpperCase()}</span>`;
const pct1 = x => (x*100).toFixed(1).replace('.',',')+'%';

function aggOrgs(vig,niv){
  const m = new Map();
  hrows().forEach(r=>{
    if(vig!=='todas' && r.v!==+vig) return;
    if(r.org==='Sin dato' || r.org==='Todos los organismos' || r.niv==='Otro') return;
    if(niv==='principal' && r.niv==='Subunidad') return;
    if(niv==='sub' && r.niv!=='Subunidad') return;
    let o = m.get(r.org);
    if(!o){ o={org:r.org,niv:r.niv,ok:0,tar:0,sin:0,pend:0,retSum:0,y:{2024:0,2025:0,2026:0}}; m.set(r.org,o); }
    if(r.opo===0) o.ok++;
    else if(r.opo===1){ o.tar++; o.retSum+=(r.ret||0); o.y[r.v]++; }
    else if(r.opo===2){ o.sin++; o.y[r.v]++; }
    else if(r.opo===3) o.pend++;
  });
  return [...m.values()].map(o=>{ o.ev=o.ok+o.tar+o.sin; o.inc=o.tar+o.sin; o.tasa=o.ev?o.inc/o.ev:0; o.ret=o.tar?o.retSum/o.tar:0; o.sem=semOf(o.ev,o.tasa); return o; }).filter(o=>o.ev>0);
}
function sortOrgs(list){
  if(C.sort==='tasa') return list.sort((a,b)=>(a.sem==='muestra')-(b.sem==='muestra') || b.tasa-a.tasa || b.inc-a.inc);
  return list.sort((a,b)=>b.inc-a.inc || b.tasa-a.tasa);
}

    ${list.length?list.map((o,i)=>`<tr class="click" data-act="drill" data-org="${esc(o.org)}">
      <td class="mono muted">${i+1}</td><td style="min-width:250px"><span class="org">${esc(o.org)}</span></td>
      <td><div class="stack"><span class="ok" style="width:${o.ok*100/o.ev}%"></span><span class="tar" style="width:${o.tar*100/o.ev}%"></span><span class="sin" style="width:${o.sin*100/o.ev}%"></span></div></td>

      <td class="right mono"><b>${o.inc}</b></td><td class="right mono">${pct1(o.tasa)}</td><td>${semPill(o.sem)}</td>
      <td class="right mono">${o.tar?o.ret.toFixed(1).replace('.',',')+' d':'—'}</td>
      <td class="right mono muted">${o.y[2024]} / ${o.y[2025]} / ${o.y[2026]}</td></tr>`).join(''):'<tr><td colspan="11"><div class="empty"><i class="fa-solid fa-inbox"></i>Sin datos</div></td></tr>'}
    </tbody></table></div>
    <div class="muted" style="margin-top:10px;font-size:.78rem">Toca una fila para ver los radicados que incumplieron. "Retraso prom." = días hábiles promedio de las respuestas tardías.</div>`;
  $('#cVig').addEventListener('change',e=>{ C.vig=e.target.value; render(); });
  $('#cNiv').addEventListener('change',e=>{ C.niv=e.target.value; render(); });
}

function histFromPayload(j){

  return {corte:j.corte,rows,entes:j.entes,orgs:j.orgs.map(o=>o[0]),source:'embebido',loaded:true};
}
function histFromDb(list){
  const rows = list.map((r,i)=>({i,v:r.vigencia,rad:r.radicacion_ente,ente:r.ente||'—',orfE:r.orfeo_entrada,rec:r.fecha_recibo,org:r.organismo,niv:r.tipo_organismo||'',asu:r.asunto,term:r.termino_dias_habiles,fmax:r.fecha_maxima,orfR:r.orfeo_respuesta,fresp:r.fecha_respuesta,resp:r.respondio==='Sí'?1:(r.respondio==='No'?0:2),opo:Math.max(0,OPO_NAMES.indexOf(r.oportunidad)),ret:r.retraso_dias_habiles,tiem:r.dias_habiles_responder}));
  let corte=''; rows.forEach(r=>{ [r.fresp,r.rec].forEach(d=>{ if(d&&d>corte) corte=d; }); });
  return {corte:String(corte).slice(0,10),rows,entes:[...new Set(rows.map(r=>r.ente))].sort(),orgs:[...new Set(rows.map(r=>r.org))],source:'supabase',loaded:true};

const orgKey = s => String(s||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().replace(/\(.*?\)/g,' ').replace(/[^a-z0-9 ]/g,' ').replace(/\s+/g,' ').trim();

function statsOf(rows){
  const s={ok:0,tar:0,sin:0,pend:0,retSum:0,tiemSum:0,tiemN:0};
  rows.forEach(r=>{
    if(r.opo===0) s.ok++; else if(r.opo===1){ s.tar++; s.retSum+=(r.ret||0); } else if(r.opo===2) s.sin++; else if(r.opo===3) s.pend++;
    if(r.tiem!=null && r.tiem>=0 && r.opo<=1){ s.tiemSum+=r.tiem; s.tiemN++; }
  });
  s.ev=s.ok+s.tar+s.sin; s.inc=s.tar+s.sin; s.tasa=s.ev?s.inc/s.ev:0; s.ret=s.tar?s.retSum/s.tar:0; s.tiem=s.tiemN?s.tiemSum/s.tiemN:0; s.sem=semOf(s.ev,s.tasa);
  return s;
}
const semColor = s => ({rojo:'#D21F3C',amarillo:'#F2B230',verde:'#138A44',muestra:'#A7B0BE'})[s]||'#A7B0BE';
function maskPII(s){
  s=String(s==null?'':s);
  s=s.replace(/\b(?:C\.?\s?C\.?|c[eé]dula|PPT|T\.?\s?I\.?|NUIP)\s*[:.]?\s*(?:No\.?|N[°º.]|#)?\s*[:.]?\s*[\d.\-]{5,}/gi,'[documento reservado]');
  const TRIG=/^(favor|peticionari[oa]|se[ñn]or[a]?|sr[a]?|estudiantes?|joven|ni[ñn][oa]|menor|ciudadan[oa]|accionante|solicitante|quejos[oa]|denunciante|usuari[oa]|paciente|se[ñn]or\(a\))$/i;
  const NAME=/^[A-ZÁÉÍÓÚÑ][A-Za-zÁÉÍÓÚÑáéíóúñ'.\-]+$/, CONN=/^(de|del|la|las|los|y|e)$/i;
  const parts=s.split(/(\s+)/), out=[]; let i=0;
  while(i<parts.length){
    const w=parts[i], bare=w.replace(/[:.,;()]/g,'');
    out.push(w); i++;
    if(w.trim() && TRIG.test(bare)){
      let j=i, names=0, last=-1;
      while(j<parts.length){
        const t=parts[j]; if(!t.trim()){ j++; continue; }
        const tb=t.replace(/[,;:]$/,'');
        if(names===0 && CONN.test(tb) && /^favor$/i.test(bare)){ j++; continue; }
        if(NAME.test(tb) && !/^(Contralor|Personer|Procurad|Defensor|Alcald|Secretar)/i.test(tb)){ names++; last=j; j++; if(names>=6||/[,;]$/.test(t)) break; continue; }
        if(names>0 && CONN.test(tb) && j+1<parts.length){ j++; continue; }
        break;
      }
      if(names>0){ out.push(' [nombre reservado]'); i=last+1; }
    }
  }
  return out.join('').replace(/(\[nombre reservado\])\s*[\d.\-]{6,}\.*/g,'$1');
}

function squarify(items,x,y,w,h){
  const out=[], total=items.reduce((s,i)=>s+i.v,0), k=(w*h)/total;
  let rest=items.map(i=>({...i,a:i.v*k}));
  while(rest.length){
    const side=Math.min(w,h);
    const worst=(r,s)=>{ const mx=Math.max(...r.map(i=>i.a)), mn=Math.min(...r.map(i=>i.a)); return Math.max(side*side*mx/(s*s), s*s/(side*side*mn)); };
    let row=[rest[0]], sum=rest[0].a, i=1;
    while(i<rest.length){ const nr=row.concat(rest[i]), ns=sum+rest[i].a; if(worst(nr,ns)<=worst(row,sum)){ row=nr; sum=ns; i++; } else break; }
    const thick=sum/side; let off=0;
    row.forEach(it=>{ const len=it.a/thick; out.push(w>=h?{it,x:x,y:y+off,w:thick,h:len}:{it,x:x+off,y:y,w:len,h:thick}); off+=len; });
    if(w>=h){ x+=thick; w-=thick; } else { y+=thick; h-=thick; }
    rest=rest.slice(row.length);
  }
  return out;
}

function renderBrief(){

function queueData(){
  const m=new Map();
  HIST.rows.forEach(r=>{
    if(!MAIN_NIV.includes(r.niv) || !Q.vigs[r.v] || (r.opo!==2&&r.opo!==3)) return;
    let o=m.get(r.org); if(!o){ o={org:r.org,venc:0,pend:0,maxRet:0}; m.set(r.org,o); }
    if(r.opo===2){ o.venc++; o.maxRet=Math.max(o.maxRet,r.ret||0); } else o.pend++;
  });
  return [...m.values()].sort((a,b)=>b.venc-a.venc||b.pend-a.pend);
}

function svgDonut(p,color,txt){
  const r=52, C=2*Math.PI*r, off=C*(1-Math.max(0,Math.min(1,p)));
  return `<svg viewBox="0 0 140 140" width="150" height="150" style="font-family:Arial,sans-serif"><circle cx="70" cy="70" r="${r}" fill="none" stroke="#E6EAF2" stroke-width="14"/>
  <circle cx="70" cy="70" r="${r}" fill="none" stroke="${color}" stroke-width="14" stroke-linecap="round" stroke-dasharray="${C}" stroke-dashoffset="${off}" transform="rotate(-90 70 70)"/>
  <text x="70" y="68" text-anchor="middle" font-size="26" font-weight="700" fill="#13203A">${txt}</text><text x="70" y="88" text-anchor="middle" font-size="10" fill="#55627A">a tiempo</text></svg>`;
}
function svgTrend(pts){
  const W=620,H=190,L=34,R=10,T=12,B=26, n=pts.length; if(n<2) return '<div class="muted" style="padding:20px;font-size:.82rem">Sin datos suficientes para la tendencia.</div>';
  const X0=i=>L+(W-L-R)*i/(n-1), Y0=v=>T+(H-T-B)*(1-Math.min(1,v));
  const y20=Y0(SEMP.verde_lt), y40=Y0(SEMP.rojo_ge);
  const line=pts.map((p,i)=>p.v==null?null:`${X0(i).toFixed(1)},${Y0(p.v).toFixed(1)}`).filter(Boolean).join(' ');
  const dots=pts.map((p,i)=>p.v==null?'':`<circle cx="${X0(i).toFixed(1)}" cy="${Y0(p.v).toFixed(1)}" r="4" fill="${semColor(semOf(Math.max(p.ev,SEMP.min),p.v))}" stroke="#FFFFFF" stroke-width="1.5"><title>${p.label}: ${pct1(p.v)} (${p.inc} de ${p.ev})</title></circle>`).join('');
  const step=Math.ceil(n/8), xl=pts.map((p,i)=>i%step===0?`<text x="${X0(i).toFixed(1)}" y="${H-8}" text-anchor="middle" font-size="9" fill="#55627A">${p.short}</text>`:'').join('');
  return `<svg viewBox="0 0 ${W} ${H}" width="100%" style="font-family:Arial,sans-serif"><rect x="${L}" y="${T}" width="${W-L-R}" height="${y40-T}" fill="rgba(210,31,60,.06)"/><rect x="${L}" y="${y20}" width="${W-L-R}" height="${H-B-y20}" fill="rgba(19,138,68,.06)"/>
  <line x1="${L}" x2="${W-R}" y1="${y40}" y2="${y40}" stroke="#D21F3C" stroke-dasharray="4 4" stroke-opacity=".5"/><line x1="${L}" x2="${W-R}" y1="${y20}" y2="${y20}" stroke="#138A44" stroke-dasharray="4 4" stroke-opacity=".5"/>
  <text x="4" y="${y40+3}" font-size="9" fill="#55627A">40%</text><text x="4" y="${y20+3}" font-size="9" fill="#55627A">20%</text><text x="4" y="${Y0(1)+3}" font-size="9" fill="#55627A">100%</text><text x="4" y="${Y0(0)+3}" font-size="9" fill="#55627A">0%</text>
  <polyline points="${line}" fill="none" stroke="#0B3D91" stroke-width="2" stroke-linejoin="round"/>${dots}${xl}</svg>`;
}

const TPL = {
  vencidos:['Requerimientos sin respuesta (vencidos)'],
  preventivo:['Recordatorio preventivo (por vencer)'],
  desempeno:['Resumen de desempeño'],
  reconocimiento:['Reconocimiento por buen cumplimiento']

function buildMsg(org,tpl,vigs,ct){
  const rows = HIST.rows.filter(r=>r.org===org && vigs.includes(r.v)), st=statsOf(rows), per=vigs.slice().sort().join(', ');
  const hi = 'Cordial saludo'+(ct&&ct.nombre?', '+ct.nombre:'')+'.';
  const foot = '\n\nDespacho del Alcalde\nAlcaldía de Santiago de Cali';
  const corte = fmtD(HIST.corte);
  const limit = 1500;
  const pack = (head,items,fmt,tail)=>{
    let lines=[], extra=0;
    for(let i=0;i<items.length;i++){
      const l=fmt(items[i],lines.length+1);
      const trial=head+lines.concat(l).join('\n')+(items.length>lines.length+1?'\n(y '+(items.length-lines.length-1)+' más)':'')+tail+foot;
      if(trial.length>limit || lines.length>=10){ extra=items.length-lines.length; break; }
      lines.push(l);
    }
    return head+lines.join('\n')+(extra>0?`\n... y ${extra} más (el detalle está disponible en el Centro de Mando).`:'')+tail+foot;
  };
  if(tpl==='vencidos'){
    const it=rows.filter(r=>r.opo===2).sort((a,b)=>(b.ret||0)-(a.ret||0));
    const head=`${hi}\n\nDesde el Despacho del Alcalde se informa que, según el Control de Requerimientos de Entes de Control (corte ${corte}; vigencia ${per}), ${org} registra ${it.length} requerimiento(s) sin respuesta registrada y con el término vencido:\n\n`;
    return pack(head,it,(r,n)=>`${n}. ${r.ente}, radicado ${r.rad||'sin número'}. Venció el ${fmtD(r.fmax)}${r.ret!=null?' ('+r.ret+' días hábiles de retraso)':''}.`,
      '\n\nEl detalle de cada radicado puede consultarse en el Control de Requerimientos. Se solicita dar respuesta de manera prioritaria, radicarla en ORFEO y reportar el número de radicado de salida al Despacho. Si el requerimiento ya fue respondido, favor informar el número de ORFEO para actualizar el registro.');
  }
  if(tpl==='preventivo'){
    const it=rows.filter(r=>r.opo===3).sort((a,b)=>String(a.fmax).localeCompare(String(b.fmax)));
    const head=`${hi}\n\nDesde el Despacho del Alcalde se recuerda que ${org} tiene ${it.length} requerimiento(s) de entes de control próximos a vencer:\n\n`;
    return pack(head,it,(r,n)=>`${n}. ${r.ente}, radicado ${r.rad||'sin número'}. Vence el ${fmtD(r.fmax)}.`,
      '\n\nSe agradece dar respuesta dentro del término y registrar el radicado ORFEO de salida.');
  }
  if(tpl==='reconocimiento'){
    return `${hi}\n\nDesde el Despacho del Alcalde se reconoce el compromiso de ${org} con la atención oportuna de los entes de control. En el periodo evaluado (vigencia ${per}; corte ${corte}) la dependencia respondió dentro del término ${st.ok} de ${st.ev} requerimientos (${st.ev?Math.round(st.ok*100/st.ev):0}%).\n\nAgradecemos mantener este nivel de cumplimiento.${foot}`;
  }
  return `${hi}\n\nDesde el Despacho del Alcalde se comparte el resumen de cumplimiento de ${org} frente a los entes de control (vigencia ${per}; corte ${corte}):\n\n- Requerimientos evaluados: ${st.ev}\n- Respondidos dentro del término: ${st.ok}\n- Respondidos fuera del término: ${st.tar}${st.tar?' (retraso promedio de '+st.ret.toFixed(1).replace('.',',')+' días hábiles)':''}\n- Sin respuesta registrada: ${st.sin}\n- Porcentaje de incumplimiento: ${pct1(st.tasa)}\n\nSe solicita revisar los pendientes y priorizar su respuesta.${foot}`;
}

  const win=(a,b)=>{ let ok=0,inc=0; rows.forEach(r=>{ if(!r.fmax||r.opo>2||r.fmax<=a||r.fmax>b) return; if(r.opo===0) ok++; else inc++; }); return {ev:ok+inc,inc,t:(ok+inc)?inc/(ok+inc):null}; };
  const q1=win(d1,corte), q0=win(d2,d1);

  const semCount={rojo:0,amarillo:0,verde:0,muestra:0}; orgs.forEach(o=>semCount[o.sem]++);

function narrative(m){
  const s=m.st, out=[], per=RP.vig==='todas'?'las vigencias 2024, 2025 y 2026':'la vigencia '+RP.vig, who=m.org||'las dependencias del Distrito';
  out.push(`En ${per} se evaluaron ${nf(s.ev)} requerimientos de entes de control atendidos por ${who}. De ellos, ${nf(s.ok)} (${pct1(s.ev?s.ok/s.ev:0)}) se respondieron dentro del término, ${nf(s.tar)} (${pct1(s.ev?s.tar/s.ev:0)}) fuera del término y ${nf(s.sin)} (${pct1(s.ev?s.sin/s.ev:0)}) permanecen sin respuesta registrada y con el término vencido. La tasa de incumplimiento es ${pct1(s.tasa)}, que corresponde a semáforo ${semTxt(s.sem).toLowerCase()}.`);
  if(!m.org && m.orgs.length){
    const t3=m.orgs.slice(0,3).map(o=>`${o.name} (${o.inc} incumplimientos, ${pct1(o.tasa)})`).join('; ');
    out.push(`Las dependencias con mayor número de incumplimientos son: ${t3}. Hay ${m.semCount.rojo} dependencia(s) en semáforo rojo, ${m.semCount.amarillo} en amarillo y ${m.semCount.verde} en verde.`);
  }
  if(m.q1.t!=null && m.q0.t!=null){
    const d=(m.q1.t-m.q0.t)*100, w=Math.abs(d).toFixed(1).replace('.',',');
    out.push(`En los últimos tres meses la tasa de incumplimiento fue ${pct1(m.q1.t)} frente a ${pct1(m.q0.t)} del trimestre anterior: ${Math.abs(d)<0.5?'se mantiene estable':(d<0?'mejora en '+w+' puntos porcentuales':'empeora en '+w+' puntos porcentuales')}.`);
  }
  if(m.entes.length) out.push(`El ente de control con más requerimientos incumplidos es ${m.entes[0][0]} (${m.entes[0][1]} casos).`);
  if(s.sin||m.pend) out.push(`Hay ${nf(s.sin)} requerimiento(s) sin respuesta registrada y ${nf(m.pend)} por vencer. Se recomienda priorizar su atención y notificar a los responsables.`);
  return out;
}

function chDonut(parts,center,sub){

let INFS=[];
async function logInforme(){
  const {m,huella}=RP._last||{}; if(!m) return;
  const e={ts:new Date().toISOString(),usuario:S.user.email,alcance:m.org||'Todas las dependencias',vigencias:RP.vig==='todas'?'2024, 2025, 2026':String(RP.vig),corte:HIST.corte,n:m.rows.length,huella};
  if(S.demo||!sb){ try{ INFS=JSON.parse(lsGet('ce_inf')||'[]'); }catch(x){ INFS=[]; } }
  INFS.unshift(e);
  if(S.demo||!sb){ lsSet('ce_inf',JSON.stringify(INFS.slice(0,100))); await demoAudit('informes','INSERT',INFS.length,{alcance:e.alcance,vigencias:e.vigencias,huella:e.huella},e.usuario); return; }
  const {error}=await sb.from('informes').insert({alcance:e.alcance,vigencias:e.vigencias,corte:e.corte||null,n_registros:e.n,huella:e.huella});
  if(error) toast('El informe se generó pero no se pudo registrar: '+error.message,'err');
}
async function rpPdf(){
  await logInforme();
  const t=document.title; document.title='Informe_Ejecutivo_Cumplimiento_'+(HIST.corte||'')+(RP._last&&RP._last.m.org?'_'+shortOrg(RP._last.m.org).replace(/\W+/g,'_'):'');
  const back=()=>{ document.title=t; window.removeEventListener('afterprint',back); };
  window.addEventListener('afterprint',back); setTimeout(()=>window.print(),80); setTimeout(back,60000);
}

function auditWhat(a){
  const p=a.payload||{};
  const id = p.radicado||p.email||p.nombre||(p.organismo?(p.organismo+(p.cargo?' - '+p.cargo:'')):'')||p.alcance||p.canal||a.registro_id;
  return `${TABLA_LBL[a.tabla]||a.tabla}: ${shortTxt(String(id),70)}`;
}
function auditDetail(a){
  const ch=a.cambios||{}, keys=Object.keys(ch).filter(k=>!['updated_at','updated_by','created_at'].includes(k));
  if(a.accion==='UPDATE'&&keys.length) return keys.slice(0,4).map(k=>{ const v=x=>x==null||x===''?'vacío':(k==='telefono'?fmtPhone(String(x)):shortTxt(String(x),38)); return `${FIELD_LBL[k]||k}: ${v(ch[k].de)} → ${v(ch[k].a)}`; }).join('; ')+(keys.length>4?' …':'');
  if(a.accion==='INSERT') return a.tabla==='notificaciones'?`Mensaje a ${(a.payload||{}).destinatario||'—'}`:(a.tabla==='informes'?`Huella ${String((a.payload||{}).huella||'').slice(0,12)}…`:'Registro nuevo');
  return '';
}
async function loadActividad(){
  let audit=[],profs=[],acc={};
  try{ audit=await db.audit(); }catch(e){}
  try{ profs=await db.profiles(); }catch(e){}
  if(S.demo||!sb){ try{ acc=JSON.parse(lsGet('ce_acc')||'{}'); }catch(e){} try{ INFS=JSON.parse(lsGet('ce_inf')||'[]'); }catch(e){} }
  else{
    const a=await sb.from('accesos').select('user_id,created_at').order('created_at',{ascending:false}).limit(1000);
    if(!a.error) (a.data||[]).forEach(x=>{ if(!acc[x.user_id]) acc[x.user_id]=x.created_at; });
    const i=await sb.from('informes').select('*').order('created_at',{ascending:false}).limit(100);
    if(!i.error) INFS=(i.data||[]).map(x=>({ts:x.created_at,usuario:x.generado_por,alcance:x.alcance,vigencias:x.vigencias,corte:x.corte,n:x.n_registros,huella:x.huella}));
  }
  ACT={audit,profs,acc,loaded:true};
}
