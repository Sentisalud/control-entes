    case 'newReq': newReqModal(); break;
    case 'saveReq': saveReq(); break;
    case 'closeFor': e.stopPropagation(); closeModal(); S.preselect=id; go('carga'); break;
    case 'openPdf': try{ window.open(await db.signedUrl(t.dataset.path),'_blank','noopener'); }catch(er){ toast(er.message,'err'); } break;
    case 'escalate': try{ await db.escalate(S.reqs.find(r=>String(r.id)===id),'registro'); toast('Escalamiento registrado'); await reload(); render(); }catch(er){ toast(er.message,'err'); } break;
    case 'escalateAll': {
      const pend = S.reqs.filter(r=>r.sem==='rojo'&&!r.escalado_at); let n=0;
      for(const r of pend){ try{ await db.escalate(r,'registro'); n++; }catch(er){ toast(er.message,'err'); break; } }
      if(n) toast(n+' escalamiento(s) registrado(s)'); await reload(); render(); break; }
    case 'log': { const r=S.reqs.find(x=>String(x.id)===id); if(r&&canEscalate()) db.escalate(r,t.dataset.canal).then(async()=>{ await reload(); render(); }).catch(()=>{}); break; }
    case 'editCat': catModal(t.dataset.table, id); break;
    case 'saveCat': saveCat(t.dataset.table, id); break;
    case 'csv': exportCsv(); break;
    case 'print': window.print(); break;
    case 'verify': verifyChain(); break;
    case 'tamper': if(DEMO.audit.length>1){ DEMO.audit[1].payload.asunto='ALTERADO'; DEMO.audit[1].payload.manipulado=true; toast('Se alteró en memoria el evento #2. Verifica la integridad.'); } else toast('Genera primero algún evento (cierra o crea un requerimiento)','err'); break;
    case 'saveProfile': {
      const tr = t.closest('tr'), g = k => tr.querySelector(`[data-k="${k}"]`).value;
      try{ await db.saveProfile({id, rol:g('rol'), dependencia_id:g('dependencia_id')?+g('dependencia_id'):null, activo:g('activo')==='true'}); toast('Cuenta actualizada'); }catch(er){ toast(er.message,'err'); } break; }
    case 'saveCfg': try{
      const d = +$('#cfDias').value; if(!(d>=1&&d<=30)) return toast('Los días deben estar entre 1 y 30','err');
      await db.saveConfig({dias_rojo:d, correo_disciplinario:$('#cfDisc').value.trim()}); await db.catalogs(); await reload(); toast('Parámetros guardados'); render();
    }catch(er){ toast(er.message,'err'); } break;
    case 'cSort': C.sort=t.dataset.s; render(); break;
    case 'drill': drillModal(t.dataset.org); break;
    case 'cumCsv': { const l=sortOrgs(aggOrgs(C.vig,C.niv)); csvDownload('cumplimiento_por_organismo.csv',['Puesto','Organismo','Tipo','Evaluados','A tiempo','Tardías','Sin respuesta vencida','Incumplimientos','% incumplimiento','Semáforo','Retraso promedio (días hábiles)'],l.map((o,i)=>[i+1,o.org,o.niv,o.ev,o.ok,o.tar,o.sin,o.inc,pct1(o.tasa),o.sem.toUpperCase(),o.tar?o.ret.toFixed(1):''])); break; }
    case 'hPage': Hs.page=Math.max(0,Hs.page+(+t.dataset.d)); renderHist(); break;
    case 'histDetail': histDetail(+t.dataset.i); break;
    case 'histCsv': csvDownload('historico_requerimientos.csv',['Vigencia','N.º radicación ente','Ente','ORFEO entrada','Fecha recibo','Organismo','Asunto','Término (días hábiles)','Fecha máxima','ORFEO respuesta','Fecha respuesta','¿Respondió?','¿Tardía?','Oportunidad','Retraso (días hábiles)'],histFiltered().map(r=>[r.v,r.rad,r.ente,r.orfE,r.rec,r.org,maskPII(r.asu),r.term,r.fmax,r.orfR,r.fresp,r.resp===1?'Sí':r.resp===0?'No':'No aplica',r.opo===1?'Sí':(r.opo===5?'No aplica':'No'),OPO_PILL[r.opo][1],r.ret])); break;
    case 'unmask': { const r=hrows().find(x=>x.i===+t.dataset.i); const dd=$('#asuDd'); if(r&&dd){ dd.textContent=r.asu||'—'; t.remove(); } break; }
    case 'acTab': AC.tab=t.dataset.t; render(); break;
    case 'rpPdf': rpPdf(); break;
    case 'rpCsv': { const m=(RP._last||{}).m; if(m) csvDownload('informe_datos_'+(HIST.corte||'')+'.csv',['Vigencia','Dependencia','Ente','N.º radicación ente','Fecha máxima','Fecha respuesta','ORFEO respuesta','Oportunidad','Retraso (días hábiles)'],m.rows.map(r=>[r.v,r.org,r.ente,r.rad,r.fmax,r.fresp,r.orfR,OPO_PILL[r.opo][1],r.ret])); break; }
    case 'tmFilter': { TM.filter = TM.filter===t.dataset.s ? null : t.dataset.s; const box=$('#tm'); if(box) box.classList.toggle('filtering',!!TM.filter); paintTreemap(); break; }
    case 'tmPlay': tmPlay(); break;
    case 'qVig': Q.vigs[t.dataset.y]=!Q.vigs[t.dataset.y]; render(); break;
    case 'openOrg': X.org=t.dataset.org; closeModal(); go('dependencia'); break;
    case 'notify': notifyModal(t.dataset.org); break;
    case 'despacho': despachoModal(); break;
    case 'sendWa': sendWa(); break;
    case 'copyMsg': { const v=$('#nMsg').value; try{ await navigator.clipboard.writeText(v); toast('Mensaje copiado'); }catch(er){ $('#nMsg').select(); document.execCommand('copy'); toast('Mensaje copiado'); } break; }
    case 'dirSave': {
      const i=+t.dataset.i, tr=t.closest('[data-di]'), x=DIRLIST[i]; if(!x||!tr) break;
      const g=k=>tr.querySelector(`[data-k="${k}"]`).value.trim().replace(/\s+/g,' ');
      const tel=g('telefono'); if(tel && !normPhone(tel)){ toast('El celular debe tener 10 dígitos e iniciar en 3','err'); break; }
      if(g('nombre') && !fullName(g('nombre'))){ toast('Escribe el nombre completo: nombres y apellidos','err'); break; }
      if(tel && !g('nombre')){ toast('Agrega el nombre completo del responsable antes de guardar el celular','err'); break; }
      const otro=DIRLIST.find((y,k)=>k!==i && tel && normPhone(y.telefono)===normPhone(tel)); if(otro){ toast('Ese celular ya está asignado a '+shortOrg(otro.organismo),'err'); break; }
      const antes={...x}; x.cargo=g('cargo')||x.cargo; x.nombre=g('nombre'); x.telefono=tel?normPhone(tel):'';
      try{ await saveDirRow(x); if(S.demo||!sb) await demoAudit('directorio','UPDATE',i,x,S.user.email,diff(antes,x)); toast('Directorio actualizado'); render(); }catch(er){ toast(er.message,'err'); } break; }
    case 'dirAdd': if(!DIRLIST.some(x=>orgKey(x.organismo)===orgKey(t.dataset.org)&&x.cargo===defaultCargo(t.dataset.org))) DIRLIST.push({organismo:t.dataset.org,cargo:defaultCargo(t.dataset.org),nombre:'',telefono:''}); DIRF.q=''; DIRF.f='todos'; render(); break;
    case 'dirCsv': csvDownload('directorio_gabinete.csv',['Dependencia','Cargo','Nombre','Celular'],DIRLIST.map(x=>[x.organismo,x.cargo,x.nombre,x.telefono])); break;
    case 'notifCsv': csvDownload('notificaciones.csv',['Fecha','Dependencia','Destinatario','Celular','Mensaje','Casos','Enviado por','Texto'],NOTIF.map(n=>[n.ts,n.org,n.nombre,n.tel,(TPL[n.tpl]||[n.tpl])[0],n.n,n.usuario,n.mensaje])); break;
    case 'depCsv': { const org=scopeOrg()||X.org; csvDownload('reporte_'+shortOrg(org).replace(/\W+/g,'_')+'.csv',['Vigencia','N.º radicación ente','Ente','Asunto','Fecha máxima','Fecha respuesta','ORFEO respuesta','Oportunidad','Retraso (días hábiles)'],HIST.rows.filter(r=>r.org===org).map(r=>[r.v,r.rad,r.ente,maskPII(r.asu),r.fmax,r.fresp,r.orfR,OPO_PILL[r.opo][1],r.ret])); break; }
    case 'saveConn': lsSet('ce_url',$('#cfUrl').value.trim()); lsSet('ce_key',$('#cfKey').value.trim()); location.reload(); break;
  }
});

$('#btnCollapse').addEventListener('click',()=>{
  const app=$('#app'); app.classList.toggle('collapsed'); lsSet('ce_collapsed',app.classList.contains('collapsed')?'1':'0');
  $('#btnCollapse i').className = 'fa-solid '+(app.classList.contains('collapsed')?'fa-angles-right':'fa-angles-left');
});
$('#btnBurger').addEventListener('click',()=>$('#app').classList.add('open'));
$('#mobileOv').addEventListener('click',()=>$('#app').classList.remove('open'));
$('#btnLogout').addEventListener('click',async()=>{ if(S.demo){ location.reload(); return; } await sb.auth.signOut(); location.reload(); });
$('#selVigencia').addEventListener('change',async e=>{ S.vigencia=+e.target.value; await reload(); render(); });
function syncDemoDep(){
  const sel=$('#demoDep'), scoped=['secretario','enlace'].includes(rol()); sel.classList.toggle('hidden',!scoped);
  if(scoped){
    if(!S.deps.some(d=>d.id===S.profile.dependencia_id && HIST.rows.some(r=>r.org===d.nombre))){ const f=S.deps.find(d=>HIST.rows.some(r=>r.org===d.nombre)); if(f) S.profile.dependencia_id=f.id; }
    S.profile.org=(S.deps.find(d=>d.id===S.profile.dependencia_id)||{}).nombre;
    sel.innerHTML=S.deps.filter(d=>HIST.rows.some(r=>r.org===d.nombre)).map(d=>`<option value="${d.id}"${d.id===S.profile.dependencia_id?' selected':''}>${esc(shortOrg(d.nombre))}</option>`).join('');
  }
}
$('#demoRole').addEventListener('change',async e=>{
  const p = {...DEMO.profiles.find(x=>x.rol===e.target.value)}; S.profile=p; S.user={email:p.email}; syncDemoDep(); await reload(); go(S.view);
});
$('#demoDep').addEventListener('change',async e=>{
  const d=S.deps.find(x=>x.id===+e.target.value); if(!d) return; S.profile={...S.profile,dependencia_id:d.id,org:d.nombre}; await reload(); go(S.view);
});
window.addEventListener('resize',onResizeTm);
window.addEventListener('hashchange',()=>{ const v=location.hash.slice(1); if(v&&TITLES[v]&&S.profile) go(v); });

/* =====================================================================
   Arranque y autenticación
   ===================================================================== */
function fillVigencias(){
  const y = new Date().getFullYear();
  $('#selVigencia').innerHTML = [y,y-1,y-2].map(v=>`<option value="${v}"${v===S.vigencia?' selected':''}>Vigencia ${v}</option>`).join('');
}
async function enterApp(){
  $('#loginScreen').classList.add('hidden'); $('#app').classList.remove('hidden');
  if(lsGet('ce_collapsed')==='1'){ $('#app').classList.add('collapsed'); $('#btnCollapse i').className='fa-solid fa-angles-right'; }
  fillVigencias(); renderMode();
  try{ if(S.demo||!sb){ const a=JSON.parse(lsGet('ce_acc')||'{}'); a[S.user.email]=new Date().toISOString(); lsSet('ce_acc',JSON.stringify(a)); } else { sb.from('accesos').insert({}).then(()=>{},()=>{}); } }catch(e){}
  if(S.demo){
    $('#banner').classList.remove('hidden');
    $('#banner').innerHTML=window.CE_PUBLIC_DEMO?'<b>Versión de demostración con datos de ejemplo.</b> Los nombres, cifras y radicados son ficticios y no corresponden a la realidad. En la versión institucional los datos reales viven en Supabase y cada usuario solo ve lo que le corresponde.':'<b>Modo demostración.</b> Los datos son de ejemplo y se reinician al recargar. Para conectar tu base real pega la URL y la anon key de Supabase en <b>Configuración</b> (o en el bloque CFG del archivo).';
    const dr=$('#demoRole'); dr.classList.remove('hidden'); dr.innerHTML=Object.entries(ROLES).map(([k,v])=>`<option value="${k}">Ver como: ${v}</option>`).join('');
  }
  try{ await db.catalogs(); }catch(e){ toast('No se pudieron cargar los catálogos: '+e.message,'err'); }
  await loadHist(); await loadDir(); await loadNotifs(); if(S.demo) syncDemoDep();
  await reload();
  const v = location.hash.slice(1); go(TITLES[v]?v:defaultView());
}
async function afterLogin(session){
  const {data:p,error} = await sb.from('profiles').select('*').eq('id',session.user.id).maybeSingle();
  if(error||!p){ await sb.auth.signOut(); return showLogin('No se pudo cargar tu perfil. Contacta al administrador.'); }
  if(!p.activo){ await sb.auth.signOut(); return showLogin('Tu cuenta está pendiente de activación por un administrador.'); }
  S.user={email:session.user.email}; S.profile=p; await enterApp();
}
function showLogin(msg){
  $('#app').classList.add('hidden'); $('#loginScreen').classList.remove('hidden');
  const e=$('#loginErr'); if(msg){ e.textContent=msg; e.classList.remove('hidden'); } else e.classList.add('hidden');
  const b=$('#loginBtn'); b.disabled=false; b.innerHTML='<i class="fa-solid fa-right-to-bracket"></i> Ingresar';
}
$('#loginForm').addEventListener('submit',async ev=>{
  ev.preventDefault(); const b=$('#loginBtn'); b.disabled=true; b.innerHTML='<i class="fa-solid fa-spinner fa-spin"></i> Verificando…';
  const {data,error} = await sb.auth.signInWithPassword({email:$('#loginEmail').value.trim(), password:$('#loginPass').value});
  if(error) return showLogin('Correo o contraseña incorrectos.');
  await afterLogin(data.session);
});

$('#loginShield').src = $('.brand .shield img').src; $('#tbShield').src = $('.brand .shield img').src;
if('serviceWorker' in navigator && /^https?:$/.test(location.protocol)){ window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{})); }

(async function boot(){
  const url = CFG.SUPABASE_URL || lsGet('ce_url'), key = CFG.SUPABASE_ANON_KEY || lsGet('ce_key');
  if(url && key && window.supabase){
    try{ sb = window.supabase.createClient(url,key,{auth:{persistSession:true,autoRefreshToken:true}}); S.demo=false; }
    catch(e){ console.error(e); }
  }
  if(S.demo){
    await loadHist(); seedDemo(); S.profile = {...DEMO.profiles[0]}; S.user = {email:S.profile.email};
    await demoAudit('requerimientos','INSERT','seed',{nota:'Carga inicial de demostración'},'sistema');
    return enterApp();
  }
  const {data} = await sb.auth.getSession();
  if(data.session) await afterLogin(data.session); else showLogin();
})();
if(false) window.__CE_TEST={go:v=>go(v),NAV,rol:()=>rol(),view:()=>S.view,closeModal:()=>closeModal(),dir:()=>DIRLIST,contactsOf:o=>contactsOf(o),orgs:()=>mainOrgsAll()};

})();
</script>
