/* Numeración oficial de las columnas del PM_01 CGSC: (6) a (18) */
const PM_COD = {
  6: 'numero',
  7: 'descripcion',
  8: 'connotacion',
  9: 'macro',
  10: 'accion',
  11: 'meta',
  12: 'fuente',
  13: 'lugar',
  14: 'ffin',
  15: 'responsable',
  16: 'descav',
  17: 'fcorte',
  18: 'pct'
};
function pmAoa(X, ws) {
  /* Rellena las celdas combinadas con el valor de su celda superior izquierda */
  (ws['!merges'] || []).forEach(m => {
    const tl = ws[X.utils.encode_cell(m.s)];
    if (!tl) return;
    for (let r = m.s.r; r <= m.e.r; r++)
      for (let c = m.s.c; c <= m.e.c; c++) {
        const a = X.utils.encode_cell({ r, c });
        if (a !== X.utils.encode_cell(m.s)) ws[a] = { ...tl };
      }
  });
  return X.utils.sheet_to_json(ws, { header: 1, raw: true, defval: '', blankrows: true });
}
function pmMapHeader(row) {
  const map = {};
  row.forEach((cell, ci) => {
    const raw = pmKey(cell);
    if (!raw) return;
    const cod = (raw.match(/\((\d{1,2})\)\s*$/) || [])[1];
    const t = raw
      .replace(/\(\d{1,2}\)/g, ' ')
      .replace(/[()]/g, ' ')
      .replace(/\s+/g, ' ')
      .trim();
    const hit = PM_COLS.find(([k, re]) => !(k in map) && re.test(t));
    if (hit) map[hit[0]] = ci;
    else if (cod && PM_COD[cod] && !(PM_COD[cod] in map)) map[PM_COD[cod]] = ci;
  });
  return map;
}
function pmParseSheet(X, ws, name) {
  const rows = pmAoa(X, ws);
  let hr = -1,
    map = null,
    best = 0;
  for (let r = 0; r < Math.min(rows.length, 60); r++) {
    const m = pmMapHeader(rows[r]),
      n = Object.keys(m).length;
    if (('accion' in m || 'actividad' in m) && n > best && n >= 4) {
      best = n;
      hr = r;
      map = m;
    }
  }
  if (hr < 0) return null;
  /* metadatos del encabezado */
  const meta = {};
  const LBL = [
    ['entidad', /^entidad( auditada)?\b/],
    ['nit', /^nit\b/],
    ['representante_legal', /^representante legal/],
    ['ejercicio', /^nombre del ejercicio/],
    ['tipo_ejercicio', /^tipo de ejercicio/],
    ['fecha_suscripcion', /^fecha de suscripcion/],
    ['vigencia_pvcft', /^vigencia pvcft|^vigencia pvcf|^vigencia/],
    ['periodo_auditado', /^periodo fiscal/],
    ['modalidad', /^modalidad de auditoria/],
    ['fecha_eval', /^fecha de evaluacion/]
  ];
  const isLabel = s =>
    LBL.some(([, re]) =>
      re.test(
        pmKey(s)
          .replace(/\(\d+\)/g, '')
          .trim()
      )
    );
  const texto = [];
  for (let r = 0; r < hr; r++) {
    const row = rows[r];
    row.forEach((cell, ci) => {
      const raw = pmTxt(cell);
      if (!raw) return;
      texto.push(raw);
      const k = pmKey(raw)
        .replace(/\(\d+\)/g, '')
        .trim();
      const lb = LBL.find(([key, re]) => !(key in meta) && re.test(k));
      if (!lb) return;
      let v = '';
      const ix = raw.indexOf(':');
      if (ix >= 0) v = pmTxt(raw.slice(ix + 1));
      if (!v) {
        for (let c = ci + 1; c < row.length; c++) {
          const x = row[c];
          if (x === '' || x == null) continue;
          if (isLabel(x)) break;
          v = x;
          break;
        }
      }
      if (v !== '' && v != null) meta[lb[0]] = v;
    });
  }
  /* filas de datos */
  const data = [];
  let vacias = 0;
  for (let r = hr + 1; r < rows.length; r++) {
    const row = rows[r];
    const g = k => (k in map ? row[map[k]] : '');
    const all = row.map(pmTxt).filter(Boolean);
    if (!all.length) {
      if (++vacias >= 8) break;
      continue;
    }
    vacias = 0;
    const acc = pmTxt(g('accion')) || pmTxt(g('actividad'));
    /* totales y firmas (también cuando su celda combinada cubre la columna de la acción) */
    const k0 = pmKey(all[0]);
    const pie =
      /^totales?\b/.test(k0) || /\b(firma del representante|nombre y firma|elaboro|convenciones)\b/.test(k0);
    if (pie && (!acc || pmKey(acc) === k0)) break;
    /* segunda fila de un encabezado combinado */
    if (Object.keys(pmMapHeader(row)).length >= 4) continue;
    if (!acc && !pmTxt(g('descripcion'))) continue;
    if (/^\(?\d{1,2}\)?$/.test(acc)) continue; /* fila con la numeración de columnas */
    data.push({ fila: r + 1, g, acc });
  }
  /* filas finales sin acción (firmas, nombres, notas al pie) no son hallazgos */
  while (data.length && !data[data.length - 1].acc) data.pop();
  return { name, map, meta, data, texto: texto.join(' '), hr };
}
function pmParseWorkbook(X, wb, fileName) {
  const hojas = wb.SheetNames.map(n => pmParseSheet(X, wb.Sheets[n], n)).filter(Boolean);
  if (!hojas.length)
    throw new Error(
      'No se encontró la tabla del plan: el archivo debe tener la fila de encabezados con las columnas del hallazgo y de la acción.'
    );
  /* hoja con más filas; ante empate, la que trae avance (F14.1) */
  hojas.sort(
    (a, b) =>
      b.data.length - a.data.length ||
      ('avfis' in b.map || 'pct' in b.map) - ('avfis' in a.map || 'pct' in a.map)
  );
  const H = hojas[0];
  if (!H.data.length)
    throw new Error('La hoja «' + H.name + '» tiene encabezados pero no trae acciones diligenciadas.');
  /* El Formulario 14.1 no trae el área responsable: se toma del Formulario 14 del mismo libro */
  const respOtra = {};
  if (!('responsable' in H.map))
    hojas.slice(1).forEach(o => {
      if ('responsable' in o.map)
        o.data.forEach(d => {
          const k = pmKey(d.g('numero')) + '|' + pmKey(d.acc);
          if (!(k in respOtra)) respOtra[k] = pmTxt(d.g('responsable'));
        });
    });
  const kt = pmKey(H.texto);
  const formato =
    'avfis' in H.map ||
    'proposito' in H.map ||
    'unidad' in H.map ||
    /formulario no 14|contraloria general de la republica/.test(kt)
      ? 'F14_CGR'
      : 'connotacion' in H.map || /pm 01|contraloria general de santiago de cali/.test(kt)
        ? 'PM_01_CGSC'
        : 'OTRO';
  const m = H.meta,
    avisos = [];
  const fs = pmFecha(m.fecha_suscripcion);
  const plan = {
    formato,
    contraloria: (PM_FMT[formato] || PM_FMT.OTRO).contraloria,
    entidad: pmTxt(m.entidad) || 'Distrito Especial de Santiago de Cali',
    nit: pmTxt(m.nit),
    representante_legal: pmTxt(m.representante_legal),
    ordenador_gasto: '',
    ejercicio: pmTxt(m.ejercicio) || (formato === 'F14_CGR' ? pmTxt(m.modalidad) : ''),
    tipo_ejercicio: pmTxt(m.tipo_ejercicio) || (formato === 'F14_CGR' ? pmTxt(m.modalidad) : ''),
    modalidad: pmTxt(m.modalidad),
    vigencia_pvcft: pmTxt(m.vigencia_pvcft).replace(/\.0$/, ''),
    periodo_auditado: pmTxt(m.periodo_auditado).replace(/\.0$/, ''),
    numero_informe: '',

    fecha_informe: null,
    fecha_suscripcion: fs || '',
    estado: 'en_ejecucion',
    observaciones: 'Importado del archivo ' + fileName
  };
  if (!fs)
    avisos.push({ n: 'y', t: 'El archivo no trae una fecha de suscripción reconocible: escríbela abajo.' });
  if (!plan.ejercicio)
    avisos.push({
      n: 'y',
      t: 'El archivo no trae el nombre del ejercicio de fiscalización: escríbelo abajo.'
    });
  const fevalRaw = m.fecha_eval,
    feval = pmFecha(fevalRaw);
  /* % de avance del PM_01: 0..1 o 0..100 */
  let escala = 1;
  if (formato !== 'F14_CGR' && 'pct' in H.map) {
    const nums = H.data.map(d => pmNum(d.g('pct'))).filter(v => !isNaN(v));
    const conPct = H.data.some(d => /%/.test(String(d.g('pct'))));
    if (nums.length && !conPct && Math.max(...nums) <= 1) escala = 100;
  }
  const hall = [],
    porNum = {};
  let cur = null;
  H.data.forEach(d => {
    const g = d.g;
    let num = pmTxt(g('numero')).replace(/\.0$/, '');
    if (num.length > 20) {
      /* celda con texto largo ("Hallazgo No 7 AGEI Especial…"): se toma el número */
      const mm = num.match(
        /^(?:hallazgo\s*)?(?:n(?:o|ro|um(?:ero)?)?\s*[.°º]*\s*)?(\d+[a-z]?(?:[.-]\d+)*)\b/i
      );
      if (mm) num = mm[1];
    } else num = num.replace(/^hallazgo\s*(n[°ºo.]*\s*)?/i, '');
    const des = pmTxt(g('descripcion'));
    if (!num && !des && cur) {
      /* fila que continúa el hallazgo anterior */
    } else if (!cur || num !== cur.numeroOrig || (des && des !== cur.descripcion)) {
      if (!num) num = cur && des === cur.descripcion ? cur.numeroOrig : 'S/N-' + (hall.length + 1);
      let numero = num;
      if (porNum[numero] && porNum[numero].descripcion !== des) {
        let k = 2;
        while (porNum[num + ' (' + k + ')']) k++;
        numero = num + ' (' + k + ')';
        avisos.push({
          n: 'y',
          t: `Fila ${d.fila}: el número de hallazgo «${num}» se repite con otra descripción; se registró como «${numero}».`
        });
      }
      if (porNum[numero] && porNum[numero].descripcion === des) cur = porNum[numero];
      else {
        cur = {
          numero,
          numeroOrig: num,
          descripcion: des,
          causa: pmTxt(g('causa')),
          efecto: pmTxt(g('efecto')),
          connotaciones: pmConnOf(g('connotacion')),

    }
    const accion = pmTxt(g('accion')) || pmTxt(g('actividad'));
    if (!accion) return;
    const resp = pmTxt(g('responsable')) || respOtra[pmKey(g('numero')) + '|' + pmKey(accion)] || '';
    const prev = cur.acciones[cur.acciones.length - 1];

      prev.accion === accion &&
      prev.meta === pmTxt(g('meta')) &&
      prev.responsable === resp &&

      pmTxt(prev.actividad) === pmTxt(g('actividad'))

      return;
    const a = {
      fila: d.fila,
      accion,
      proposito: pmTxt(g('proposito')),
      actividad: pmTxt(g('actividad')),
      meta: pmTxt(g('meta')),
      unidad_medida: formato === 'F14_CGR' ? pmTxt(g('unidad')) : 'Porcentaje',
      cantidadRaw: g('cantidad'),
      cantidad: formato === 'F14_CGR' ? pmNum(g('cantidad')) : 100,
      fuente_verificacion: pmTxt(g('fuente')),
      lugar_verificacion: pmTxt(g('lugar')),
      finiRaw: g('fini'),
      fini: pmFecha(g('fini')),
      ffinRaw: g('ffin'),
      ffin: pmFecha(g('ffin')),
      responsable: resp,
      dependencia_id: pmDepMatch(resp),
      avance: null,
      fecha_corte: null,
      descripcion_avance: pmTxt(g('descav')) || pmTxt(g('obs'))

    if (formato === 'F14_CGR' && 'avfis' in H.map) {
      const v = pmNum(g('avfis'));
      if (!isNaN(v) && pmTxt(g('avfis')) !== '') {
        a.avance = v;
        a.fecha_corte = feval;
        a.sinCorte = !feval;
      }
    } else if ('pct' in H.map && pmTxt(g('pct')) !== '') {
      const v = pmNum(g('pct'));
      if (!isNaN(v)) {
        a.avance = Math.round(v * escala * 100) / 100;
        a.fecha_corte = pmFecha(g('fcorte'));

}

  if (dup)
    err.push(
      'Ya existe un plan con el mismo formato, ejercicio y fecha de suscripción. Si quieres reemplazarlo, elimina primero el plan anterior.'
    );
  let nAcc = 0,
    nAv = 0;
  imp.hall.forEach(h => {
    if (pmTxt(h.descripcion).length < 4)
      err.push(`Fila ${h.fila}: el hallazgo ${h.numero} no tiene descripción.`);
    if (!h.acciones.length) err.push(`Fila ${h.fila}: el hallazgo ${h.numero} no tiene acciones.`);
    h.acciones.forEach(a => {
      nAcc++;
      const ini = a.fini || (pmFecha(p.fecha_suscripcion) ? p.fecha_suscripcion : null);
      if (!a.ffin)
        err.push(`Fila ${a.fila}: fecha de terminación no reconocida («${pmTxt(a.ffinRaw) || 'vacía'}»).`);
      if (imp.formato === 'F14_CGR' && !a.fini)
        warn.push({
          n: 'y',
          t: `Fila ${a.fila}: sin fecha de iniciación reconocible; se usa la fecha de suscripción.`
        });
      if (a.ffin && ini && a.ffin < ini)
        err.push(
          `Fila ${a.fila}: la fecha de terminación (${fmtD(a.ffin)}) es anterior a la de inicio (${fmtD(ini)}).`
        );
      if (!(a.cantidad > 0))
        err.push(
          `Fila ${a.fila}: la cantidad de la meta no es un número mayor que cero («${pmTxt(a.cantidadRaw) || 'vacía'}»).`
        );
      if (imp.formato === 'F14_CGR' && !a.unidad_medida)
        warn.push({ n: 'y', t: `Fila ${a.fila}: sin unidad de medida; se registrará como «Unidades».` });
      if (!a.dependencia_id)
        warn.push({
          n: 'r',
          t: `Fila ${a.fila}: no se reconoció la dependencia responsable («${shortTxt(a.responsable || 'vacío', 70)}»). Asígnala en la tabla.`
        });
      if (a.avance != null) {
        if (a.sinCorte)
          warn.push({
            n: 'y',
            t: `Fila ${a.fila}: trae avance pero no fecha de corte; ese avance no se importa.`
          });
        else if (a.fecha_corte > hoy)
          warn.push({
            n: 'y',
            t: `Fila ${a.fila}: la fecha de corte del avance es futura; ese avance no se importa.`
          });
        else nAv++;
        if (a.avance > a.cantidad)
          warn.push({
            n: 'y',
            t: `Fila ${a.fila}: el avance (${pmNumTxt(a.avance)}) supera la meta (${pmNumTxt(a.cantidad)}); para los indicadores cuenta como 100%.`
          });
      }
    });
  });
  return { err, warn, nAcc, nAv };
}

async function pmDoImport(btn) {
  const imp = PM.imp;
  if (!imp || !imp.__k || imp.__k.err.length) return;
  const p = imp.plan,
    hoy = pmHoy();
  const en = S.entes.find(x => pmKey(x.nombre) === pmKey(p.contraloria));
  const payload = {
    archivo: imp.archivo,
    plan: { ...p, ente_id: en ? en.id : null },
    hallazgos: imp.hall.map(h => ({
      numero: h.numero,
      descripcion: h.descripcion,
      causa: h.causa,
      efecto: h.efecto,
      connotaciones: h.connotaciones,
      cuantia: h.cuantia,
      macroproceso: h.macroproceso,
      acciones: h.acciones.map(a => {
        const ok = a.avance != null && a.fecha_corte && a.fecha_corte <= hoy;
        return {
          dependencia_id: a.dependencia_id || null,
          responsable: a.responsable,
          accion: a.accion,
          proposito: a.proposito,
          actividad: a.actividad,
          meta: a.meta,
          unidad_medida: a.unidad_medida || 'Unidades',
          cantidad: a.cantidad,
          fuente_verificacion: a.fuente_verificacion,
          lugar_verificacion: a.lugar_verificacion,
          fecha_inicio: a.fini || p.fecha_suscripcion,
          fecha_fin: a.ffin,
          avance: ok ? a.avance : null,
          fecha_corte: ok ? a.fecha_corte : null,
          descripcion_avance: ok ? a.descripcion_avance : ''
        };
      })
    }))
  };
  if (btn) {
    btn.disabled = true;
    btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> Importando…';
  }
  try {
    const id = await pmImportar(payload);
    closeModal();
    PM.imp = null;
    PM.plan = id;
    PM.tab = 'acciones';
    toast(`Plan importado: ${payload.hallazgos.length} hallazgos y ${imp.__k.nAcc} acciones`);
    await pmRefresh();
  } catch (e) {
    toast(e.message, 'err');
    if (btn) {
      btn.disabled = false;
      btn.innerHTML = '<i class="fa-solid fa-file-import"></i> Importar';
    }
  }
}

const pmXDate = s => {

function pmPlanData(p) {

async function pmAct(a, t) {
  const id = t.dataset.id;
  switch (a) {
    case 'pmReload':
      await pmRefresh();
      break;
    case 'pmCtl':
      PM.f.ctl = t.dataset.k;
      render();
      break;
    case 'pmOpen':
      PM.plan = id;
      PM.tab = 'acciones';
      PM.fa = { est: '', dep: '', q: '' };
      PM.eval = pmHoy();
      render();
      window.scrollTo(0, 0);
      break;
    case 'pmOpenAcc': {
      const x = pmAccOf(id);
      if (!x) break;
      closeModal();
      if (pmScoped()) {
        PM.plan = null;
      } else {
        PM.plan = x.plan_id;
        PM.tab = 'acciones';
        PM.fa = { est: '', dep: '', q: '' };
      }
      if (S.view !== 'planes') go('planes');
      else render();

        const el = document.getElementById('pmA-' + id);
        if (el) {
          el.scrollIntoView({ block: 'center', behavior: 'smooth' });
          el.classList.add('pm-flash');
        }
      }, 60);
      break;
    }
    case 'pmBack':
      PM.plan = null;
      render();
      break;
    case 'pmTab':
      PM.tab = t.dataset.tab;
      render();
      break;
    case 'pmMore':
      PM.abiertos[id] = !PM.abiertos[id];
      render();
      break;
    case 'pmNewPlan':
      pmPlanModal(null);
      break;
    case 'pmEditPlan':
      pmPlanModal(pmPlanOf(id || PM.plan));
      break;
    case 'pmSavePlan':
      await pmSavePlan(id);
      break;
    case 'pmDelPlan': {
      const p = pmPlanOf(PM.plan);
      if (
        !p ||
        !confirm(
          `¿Eliminar el plan «${shortTxt(p.ejercicio, 80)}» con sus hallazgos y acciones? Esta acción queda en la auditoría y no se puede deshacer.`

      )

        toast('Plan eliminado');
        await pmRefresh();
      } catch (e) {
        toast(e.message, 'err');
      }
      break;
    }
    case 'pmNewHall':
      pmHallModal(null, PM.plan);
      break;
    case 'pmEditHall': {
      const h = pmHallOf(id);
      if (h) pmHallModal(h, h.plan_id);
      break;
    }
    case 'pmSaveHall':
      await pmSaveHall(id, t.dataset.plan);
      break;
    case 'pmDelHall': {
      const h = pmHallOf(id);
      if (!h || !confirm(`¿Eliminar el hallazgo ${h.numero} y sus acciones?`)) break;
      try {
        await pmDelete('hall', id);
        toast('Hallazgo eliminado');
        await pmRefresh();
      } catch (e) {
        toast(e.message, 'err');
      }
      break;
    }
    case 'pmNewAcc':
      closeModal();
      if (pmHallOf(id)) pmAccModal(null, id);
      break;
    case 'pmEditAcc': {
      const x = pmAccOf(id);
      if (x) pmAccModal(x);
      break;
    }
    case 'pmSaveAcc':
      await pmSaveAcc(id, t.dataset.hall);
      break;
    case 'pmDelAcc': {
      const x = pmAccOf(id);
      if (!x || !confirm('¿Eliminar esta acción?')) break;
      try {
        await pmDelete('acc', id);
        toast('Acción eliminada');
        await pmRefresh();
      } catch (e) {
        toast(e.message, 'err');
      }
      break;
    }
    case 'pmReport': {
      const x = pmAccOf(id);
      if (x) pmReportModal(x);
      break;
    }
    case 'pmSaveAv':
      await pmSaveAv(id, t);
      break;
    case 'pmReview': {
      const v = PM.av.find(x => x.id === id);
      if (v) pmReviewModal(v);
      break;
    }
    case 'pmDoReview':
      await pmDoReview(id, t.dataset.estado);
      break;
    case 'pmHist': {
      const x = pmAccOf(id);
      if (x) pmHistModal(x);
      break;
    }
    case 'pmNotify':
      pmNotifyModal(t.dataset.dep);
      break;

      break;

      pmImportModal();

      break;
    case 'pmExport': {
      const p = pmPlanOf(PM.plan);
      if (p) pmExportModal(p);
      break;
    }

/* =====================================================================
   1. VALORES DE CELDA CON LA MISMA SEMÁNTICA DE PYTHON/OPENPYXL
   Una celda queda como: null | texto | {n, f, raw} (número; f = era decimal en el archivo) | {d, h} (fecha)
   ===================================================================== */
const CE = { res: null, cargando: false };
/* Texto crudo de cada celda numérica, leído del XML del archivo: openpyxl distingue "1" (entero) de "1.0"
   (decimal) y esa diferencia cambia cómo Python escribe el valor como texto. */
function ceNumerosCrudos(wb, idx) {
  const out = new Map();
  try {
    const path = (wb.Directory.sheets[idx] || '').replace(/^\//, '');
    const f = wb.files && (wb.files[path] || wb.files['/' + path]);
    if (!f) return out;
    const xml = new TextDecoder('utf-8').decode(f.content);
    const re = /<c r="([A-Z]+[0-9]+)"([^>]*?)(?:\/>|>([\s\S]*?)<\/c>)/g;
    let m;
    while ((m = re.exec(xml))) {
      if (/\bt="(s|str|inlineStr|b|e|d)"/.test(m[2]) || !m[3]) continue;
      const v = /<v>([^<]*)<\/v>/.exec(m[3]);
      if (v) out.set(m[1], v[1]);
    }
  } catch (e) {
    console.error(e);
  }
  return out;
}
function ceLimpiar(v) {
  if (v == null) return null;
  if (typeof v === 'string') {
    const t = v
      .replace(/\u00a0/g, ' ')
      .replace(/\s+/g, ' ')
      .trim();
    return t === '' || t === '-' ? null : t;
  }
  return v;
}
function ceCelda(X, ws, crudos, r, c) {
  const ref = X.utils.encode_cell({ r, c }),
    cell = ws[ref];
  if (!cell || cell.v == null) return null;
  if (cell.t === 's' || cell.t === 'str') return ceLimpiar(String(cell.v));
  if (cell.t === 'b') return cell.v ? 'True' : 'False';
  if (cell.t === 'e') return ceLimpiar(cell.w || '#N/A');
  if (cell.t === 'd' && cell.v instanceof Date) return { d: iso(cell.v), h: '00:00:00' };
  if (cell.t === 'n') {
    if (cell.z && X.SSF.is_date(cell.z)) {
      const p = X.SSF.parse_date_code(cell.v);
      if (p && p.y)
        return {
          d: p.y + '-' + pad(p.m) + '-' + pad(p.d),
          h: pad(p.H || 0) + ':' + pad(p.M || 0) + ':' + pad(Math.floor(p.S || 0))
        };
    }
    const raw = crudos.get(ref) || String(cell.v);
    return { n: cell.v, f: /[.eE]/.test(raw), raw };
  }
  return ceLimpiar(String(cell.v));
}
const ceEsNum = v => v != null && typeof v === 'object' && 'n' in v;
const ceEsFecha = v => v != null && typeof v === 'object' && 'd' in v;
/* bool(v) de Python: None, '', 0 y 0.0 son falsos */
const ceVerdad = v => v != null && v !== '' && !(ceEsNum(v) && v.n === 0);
/* str(v) de Python */
function cePyFloat(n) {
  if (!isFinite(n)) return isNaN(n) ? 'nan' : n > 0 ? 'inf' : '-inf';
  const a = Math.abs(n);
  if (Number.isInteger(n) && a < 1e16) return n.toFixed(0) + '.0';
  if (a >= 1e16 || (a < 1e-4 && n !== 0)) {
    const [m, e] = n.toExponential().split('e');
    const s = e[0] === '-' ? '-' : '+',
      d = e.replace(/^[+-]/, '');
    return m + 'e' + s + (d.length < 2 ? '0' + d : d);
  }

  if (!filasNR) return [];
  const T = new Set(),
    R = new Set(),
    A = new Set();
  control.forEach(c => {
    ceTokens(c.orfeo_entrada).forEach(t => T.add(t));
    if (!CE_SINNUM.test(cePyStr(ceVerdad(c.rad_ente) ? c.rad_ente : '').trim()))
      R.add(cePyStr(c.rad_ente).trim().toLowerCase());
    A.add(
      [
        ceFold(cePyStr(c.ente)).slice(0, 40),
        (ceFecha(c.fecha_radicacion).d || 'NaT').slice(0, 10),
        ceFold(cePyStr(c.asunto)).slice(0, 40)
      ].join('\u0001')
    );
  });
  const vistos = new Set(),
    out = [];
  for (let i = 6; i <= filasNR.length; i++) {
    const r = filasNR[i - 1];
    if (!r.slice(1, 9).some(ceVerdad)) continue;
    const nr = {
      rad_ente: r[1],
      fecha_oficio: r[2],
      ente: r[3],
      orfeo_entrada: r[4],
      fecha_radicacion: r[5],
      fecha_daci: r[6],
      dirigido: r[7],
      asunto: r[8]
    };
    const t = ceTokens(nr.orfeo_entrada),
      rad = cePyStr(ceVerdad(nr.rad_ente) ? nr.rad_ente : '')
        .trim()
        .toLowerCase();
    if ((t.size && [...t].some(x => T.has(x))) || (rad && !CE_SINNUM.test(rad) && R.has(rad))) continue;
    if (
      A.has(
        [
          ceFold(cePyStr(nr.ente)).slice(0, 40),
          (ceFecha(nr.fecha_radicacion).d || 'NaT').slice(0, 10),
          ceFold(cePyStr(nr.asunto)).slice(0, 40)
        ].join('\u0001')
      )
    )
      continue;
    const k = [[...t].sort().join(','), rad, ceFold(cePyStr(nr.asunto)).slice(0, 60)].join('\u0001');
    if (vistos.has(k)) continue;
    vistos.add(k);
    out.push({
      vigencia: vig,
      hoja: 'NO RESPUESTA',
      fila_excel: i,
      ...nr,
      dias_habiles: null,
      fecha_max: null,
      responde: null,
      orfeo_resp: null,
      fecha_resp: null,
      estado: 'No requiere respuesta',
      obs: null,
      clase: 'Informativo'
    });
  }
  return out;
}

/* =====================================================================
   4. CLASIFICACIÓN (build() de etl/clean.py)
   ===================================================================== */
function ceCorte(regs) {
  let max = null;
  regs.forEach(r =>
    [r.fecha_radicacion, r.fecha_resp].forEach(v => {
      const f = ceFecha(v).d;
      if (f && (!max || f > max)) max = f;
    })
  );
  return max;
}
function ceClasificar(regs, HOY) {
  const out = [],
    calidad = [];
  regs.forEach(r => {
    const q = (tipo, detalle) =>
      calidad.push({
        vigencia: r.vigencia,
        hoja: r.hoja,
        fila_excel: r.fila_excel,
        rad_ente: ceIdStr(r.rad_ente),
        tipo,
        detalle
      });
    const fm = ceFecha(r.fecha_max),
      fr = ceFecha(r.fecha_resp),
      frad = ceFecha(r.fecha_radicacion).d,
      fdaci = ceFecha(r.fecha_daci).d;
    const fmax = fm.d,
      fresp = fr.d,
      frecibo = fdaci || frad;
    const dh = ceEntero(r.dias_habiles);
    const requiere = r.hoja === 'NO RESPUESTA' ? false : r.vigencia >= 2026 ? dh != null && dh > 0 : true;
    if (r.vigencia < 2026 && dh == null)
      q('Término sin dato', 'Días hábiles vacío o no numérico: ' + cePyStr(r.dias_habiles));
    const base = ceVerdad(r.responde) ? r.responde : r.dirigido;
    let orgs = ceOrganismos(base);
    if (!orgs.length) orgs = ceOrganismos(r.dirigido);
    let org, nivel;
    if (orgs.length) [org, nivel] = orgs[0];
    else {
      org = 'Sin dato';
      nivel = 'Otro';
      q('Organismo vacío', 'No hay organismo responsable registrado');
    }
    if (nivel === 'Sin clasificar') q('Organismo sin clasificar', cePyStr(base));
    const orfeoTxt =
      r.orfeo_resp == null || CE_NOAPL.test(cePyStr(r.orfeo_resp)) ? null : cePyStr(r.orfeo_resp);
    const cerrado = cePyStr(r.estado).toLowerCase() === 'cerrado';
    if (fr.malo) q('Fecha de respuesta ilegible', 'Valor en Excel: ' + fr.malo);
    if (fm.malo && requiere) q('Fecha máxima ilegible', 'Valor en Excel: ' + fm.malo);
    const respondio = !!fresp || (cerrado && orfeoTxt != null);
    let oport;
    if (requiere) {
      if (fresp && fmax) oport = fresp <= fmax ? 'A tiempo' : 'Tardía';
      else if (respondio) {
        oport = 'Respondida (sin fecha para medir)';
        q(
          'Respondida sin fecha medible',
          'Tiene ORFEO/estado cerrado pero la fecha de respuesta falta o es ilegible'
        );
      } else if (!fmax) {
        oport = 'Pendiente en término';
        q('Sin fecha máxima', 'No se puede evaluar el vencimiento');
      } else if (fmax < HOY) oport = 'Sin respuesta (vencida)';
      else oport = 'Pendiente en término';
    } else oport = 'No requiere respuesta';
    if (requiere && cerrado && !respondio)
      q('Cerrado sin respuesta', 'Estado Cerrado pero sin fecha ni radicado ORFEO de respuesta');
    if (requiere && !cerrado && respondio && r.estado != null)
      q('Abierto con respuesta', 'Estado "Abierto" pero ya tiene respuesta registrada');
    if (fresp && frecibo && fresp < frecibo)
      q('Respuesta anterior a recepción', 'Fecha de respuesta menor a la fecha de recibo');
    const retraso =
      oport === 'Tardía'
        ? ceHabiles(fmax, fresp)
        : oport === 'Sin respuesta (vencida)'
          ? ceHabiles(fmax, HOY)
          : null;
    const tiempo = requiere && fresp ? ceHabiles(frecibo, fresp) : null;
    out.push({
      vigencia: r.vigencia,
      hoja_excel: r.hoja,
      radicacion_ente: ceIdStr(r.rad_ente),
      ente: ceTexto(r.ente),
      orfeo_entrada: ceIdStr(r.orfeo_entrada),
      fecha_recibo: frecibo || null,
      organismo: org,
      tipo_organismo: nivel,
      asunto: ceTexto(r.asunto),
      termino_dias_habiles: dh,
      fecha_maxima: fmax || null,
      orfeo_respuesta: orfeoTxt,
      fecha_respuesta: fresp || null,
      respondio: requiere ? (respondio ? 'Sí' : 'No') : 'No aplica',
      tardia: requiere ? (oport === 'Tardía' ? 'Sí' : 'No') : 'No aplica',
      oportunidad: oport,
      retraso_dias_habiles: retraso,
      dias_habiles_responder: tiempo,
      estado_excel: ceTexto(r.estado),
      observaciones: ceTexto(r.obs),
      fila_excel: r.fila_excel
    });
  });
  return { filas: out, calidad };
}
/* Vigencia de un libro: la del nombre del archivo ("Vigencia 2026") o, si no, el año más frecuente de radicación */
function ceVigencia(nombreArchivo, regs) {
  const m = /vigencia[\s_-]*(20\d\d)/i.exec(nombreArchivo || '');
  if (m) return +m[1];
  const n = {};
  regs.forEach(r => {
    const f = ceFecha(r.fecha_radicacion).d;
    if (f) n[f.slice(0, 4)] = (n[f.slice(0, 4)] || 0) + 1;
  });
  const y = Object.entries(n).sort((a, b) => b[1] - a[1])[0];
  return y ? +y[0] : null;
}
/* Lee un libro completo. Devuelve los registros sin clasificar (la clasificación necesita el corte de todos los libros). */
function ceLeerLibro(X, wb, nombreArchivo, vigForzada) {
  const ctl = ceFilas(X, wb, 'CONTROL');
  if (!ctl) throw new Error('«' + nombreArchivo + '» no tiene la hoja CONTROL.');
  const ini = ceInicio(ctl.filas);
  let vig = vigForzada || null;
  let control = ceLeerControl(ctl.filas, vig || 0, ini);
  if (!vig) vig = ceVigencia(nombreArchivo, control);
  if (!vig)
    throw new Error(
      'No se pudo saber la vigencia de «' +
        nombreArchivo +
        '». Inclúyala en el nombre del archivo, por ejemplo "Vigencia 2026".'
    );
  if (ini.nuevo && ini.faltan.length)
    throw new Error(
      `Vigencia ${vig}: la hoja CONTROL cambió de columnas en la fila ${ini.fila - 1}. No coinciden: ${ini.faltan.join('; ')}`
    );
  if (!ini.nuevo && vig >= 2026)
    throw new Error(`Vigencia ${vig}: no se encontró la fila de encabezados "No. Orden" en la hoja CONTROL.`);
  control.forEach(c => (c.vigencia = vig));
  const nr = vig < 2026 ? ceFilas(X, wb, 'NO RESPUESTA') : null;
  const norep = ceNoRespuesta(nr && nr.filas, control, vig);
  return { archivo: nombreArchivo, vigencia: vig, control, norep, registros: control.concat(norep) };
}

/* =====================================================================
   5. PANTALLA DE CARGA (Super administrador)
   ===================================================================== */
const ceClave = f => [f.vigencia, f.orfeo_entrada || '', f.radicacion_ente || '', f.organismo].join('|');
const CE_ABIERTO = ['Sin respuesta (vencida)', 'Pendiente en término'];
function ceAbrir() {
  if (rol() !== 'admin') return toast('Solo el Super administrador carga el Excel de control', 'err');
  CE.res = null;
  openModal({
    title: 'Cargar Excel de control',

    body: `<div class="pm-drop">
        <i class="fa-solid fa-file-excel"></i>

        <div class="muted">Puede elegir uno o varios archivos (por ejemplo, 2025 y 2026). La app lee las hojas CONTROL y NO RESPUESTA, le muestra qué cambia frente a lo que ya está cargado y las filas con problemas. Nada se guarda hasta que usted confirme.</div>
        <input type="file" id="ceFile" multiple accept=".xlsx,.xlsm,application/vnd.openxmlformats-officedocument.spreadsheetml.sheet">
      </div>
      <div id="ceOut"></div>`,
    footer: `<button class="btn" data-act="closeModal">Cancelar</button><button class="btn primary" id="ceBtn" data-act="ceGuardar" disabled><i class="fa-solid fa-database"></i> Cargar</button>`
  });
  $('#ceFile').addEventListener('change', e => ceLeerArchivos([...e.target.files]));
}
async function ceLeerArchivos(files) {
  const out = $('#ceOut');
  if (!files.length) return;
  out.innerHTML =
    '<div class="empty"><i class="fa-solid fa-spinner fa-spin"></i>Leyendo ' +
    files.length +
    ' archivo(s)…</div>';
  $('#ceBtn').disabled = true;
  try {
    const X = await pmXlsx();
    const libros = [];
    for (const f of files) {
      const wb = X.read(new Uint8Array(await f.arrayBuffer()), {
        type: 'array',
        cellNF: true,
        bookFiles: true
      });
      libros.push(ceLeerLibro(X, wb, f.name));
    }
    const vigs = libros.map(l => l.vigencia);
    const dup = vigs.find((v, i) => vigs.indexOf(v) !== i);
    if (dup) throw new Error('Eligió dos archivos de la vigencia ' + dup + '. Deje solo el más reciente.');
    /* Corte: la fecha más reciente de los archivos o de lo ya cargado (si se carga solo una vigencia antigua,
       sus vencidos se miden hasta la misma fecha que el resto), nunca posterior a hoy */
    let corte = ceCorte(libros.flatMap(l => l.registros)) || '';
    if (HIST.corte && HIST.corte > corte) corte = HIST.corte;
    if (!corte || corte > pmHoy()) corte = pmHoy();
    const { filas, calidad } = ceClasificar(
      libros.flatMap(l => l.registros),
      corte
    );
    CE.res = { libros, vigs, corte, filas, calidad };
    ceVistaPrevia();
  } catch (e) {
    CE.res = null;
    out.innerHTML = `<div class="pm-note r"><i class="fa-solid fa-circle-exclamation"></i> ${esc(e.message)}</div>`;
  }
}
/* Comparación con lo que ya está cargado y vista previa */

        <div><small>Registros</small><b>${nf(s.n)}</b><span>${s.ctl} de CONTROL${s.nr ? ' y ' + s.nr + ' de NO RESPUESTA' : ''}</span></div>
        <div><small>Ya cargados</small><b>${nf(s.hay)}</b><span>${s.hay ? 'se reemplazan' : 'vigencia nueva'}</span></div>
        <div><small>Nuevos</small><b>${nf(s.nuevos)}</b><span>no estaban en la app</span></div>

        <div><small>Ya no aparecen</small><b class="${s.salen ? 'ce-ojo' : ''}">${nf(s.salen)}</b><span>${s.salen ? 'revise si se borraron filas o cambió el radicado' : 'ninguno'}</span></div>
        <div><small>Abiertos</small><b>${nf(s.abN)}</b><span>antes ${nf(s.abA)}</span></div>

    ${

        ? `<div class="pm-note y"><b>Organismos que no se reconocieron (${Object.keys(sinClas).length}).</b> Se cargan con el texto del Excel y no cuentan en el semáforo de ninguna dependencia. Corrija el nombre en el Excel si es un error de digitación.<ul>${Object.entries(
            sinClas

      <button class="btn sm" data-act="ceCalidad" style="margin-top:8px"><i class="fa-solid fa-file-csv"></i> Descargar filas para revisar</button></div>`

    <div class="pm-note b" style="margin-top:12px">Al cargar se <b>reemplaza</b> la${R.vigs.length > 1 ? 's vigencias' : ' vigencia'} ${R.vigs.join(' y ')} con lo que trae el Excel. Las respuestas registradas en la app con radicado ORFEO y PDF se conservan. Los casos abiertos nuevos pasan a "Cargar respuesta ORFEO".</div>`;
  const b = $('#ceBtn');
  b.disabled = false;
  b.innerHTML = `<i class="fa-solid fa-database"></i> Cargar vigencia${R.vigs.length > 1 ? 's' : ''} ${R.vigs.join(' y ')}`;
}

/* En modo demostración o en la versión con datos en el equipo, la carga se aplica solo en este navegador */
function ceAplicarEnMemoria(R) {
  const otras = HIST.rows.filter(r => !R.vigs.includes(r.v));
  const nuevas = histFromDb(R.filas).rows;
  const rows = otras.concat(nuevas).map((r, i) => ({ ...r, i }));
  let corte = '';
  rows.forEach(r => [r.fresp, r.rec].forEach(d => d && d > corte && (corte = d)));
  HIST = {
    ...HIST,
    rows,
    corte: String(corte).slice(0, 10),
    entes: [...new Set(rows.map(r => r.ente))].sort(),
    orgs: [...new Set(rows.map(r => r.org))],
    loaded: true
  };

async function ceGuardar(btn) {
  const R = CE.res;

    !confirm(
      `¿Reemplazar la${R.vigs.length > 1 ? 's vigencias' : ' vigencia'} ${R.vigs.join(' y ')} con ${nf(R.filas.length)} registros del Excel?`
    )

  CE.cargando = true;
  if (btn) {

    btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> Cargando…';

  try {
    let res;
    if (S.demo || !sb) {

        p: { vigencias: R.vigs, archivos: R.libros.map(l => l.archivo), corte: R.corte, filas: R.filas }
      });

        if (

          /function|exist|schema cache/i.test(error.message || '')
        )

    toast(e.message, 'err');
    if (btn) {

      btn.innerHTML = '<i class="fa-solid fa-database"></i> Cargar';

/* =====================================================================
   Arranque y autenticación
   ===================================================================== */
function fillVigencias() {
  const y = new Date().getFullYear();
  $('#selVigencia').innerHTML = [y, y - 1, y - 2]
    .map(v => `<option value="${v}"${v === S.vigencia ? ' selected' : ''}>Vigencia ${v}</option>`)
    .join('');
}
async function enterApp() {
  $('#loginScreen').classList.add('hidden');
  $('#app').classList.remove('hidden');
  if (lsGet('ce_collapsed') === '1') {
    $('#app').classList.add('collapsed');
    $('#btnCollapse i').className = 'fa-solid fa-angles-right';
  }
  fillVigencias();
  renderMode();
  try {
    if (S.demo || !sb) {
      const a = JSON.parse(lsGet('ce_acc') || '{}');
      a[S.user.email] = new Date().toISOString();
      lsSet('ce_acc', JSON.stringify(a));
    } else {
      sb.from('accesos')
        .insert({})
        .then(
          () => {},
          () => {}
        );
    }
  } catch (e) {}
  if (S.demo) {
    $('#banner').classList.remove('hidden');
    $('#banner').innerHTML = ES_PRIVADA
      ? '<b>Versión privada con datos reales.</b> Radicados reales de las vigencias 2024, 2025 y 2026 con corte al ' +
        fmtD(HIST.corte) +
        ' y directorio real del gabinete. Uso interno del Despacho: no reenviar este archivo.'
      : ES_DEMO_PUBLICA
        ? '<b>Versión de demostración con datos de ejemplo.</b> Los nombres, cifras y radicados son ficticios y no corresponden a la realidad. En la versión institucional los datos reales viven en Supabase y cada usuario solo ve lo que le corresponde.'
        : '<b>Modo demostración.</b> Los datos son de ejemplo y se reinician al recargar. Para conectar tu base real pega la URL y la anon key de Supabase en <b>Configuración</b> (o en el bloque CFG del archivo).';
    const dr = $('#demoRole');
    dr.classList.remove('hidden');
    dr.innerHTML = Object.entries(ROLES)
      .map(([k, v]) => `<option value="${k}">Ver como: ${v}</option>`)
      .join('');
  }
  try {
    await db.catalogs();
  } catch (e) {
    toast('No se pudieron cargar los catálogos: ' + e.message, 'err');
  }
  await loadHist();
  await loadDir();
  await loadNotifs();
  await loadCruceMeta();
  if (S.demo) syncDemoDep();
  await pmLoad();
  await reload();
  const v = location.hash.slice(1);
  go(TITLES[v] ? v : defaultView());
}
async function afterLogin(session) {
  const { data: p, error } = await sb.from('profiles').select('*').eq('id', session.user.id).maybeSingle();
  if (error || !p) {
    await sb.auth.signOut();
    return showLogin('No se pudo cargar tu perfil. Contacta al administrador.');
  }
  if (!p.activo) {
    await sb.auth.signOut();
    return showLogin('Tu cuenta está pendiente de activación por un administrador.');
  }
  /* Verificación en dos pasos: si la cuenta la tiene activa, se pide el código antes de entrar */
  try {
    const { data: aal } = await sb.auth.mfa.getAuthenticatorAssuranceLevel();
    if (aal && aal.nextLevel === 'aal2' && aal.currentLevel !== 'aal2') {
      const ok = await mfaPedirCodigo();
      if (!ok) {
        await sb.auth.signOut();
        return showLogin('Ingreso cancelado.');
      }
    }
  } catch (e) {
    console.error(e);
  }
  S.user = { email: session.user.email };
  S.profile = p;
  await enterApp();
  if (LLEGADA_CLAVE) claveModal(true);
  else await mfaRevisarTrasIngreso();
}
function showLogin(msg) {
  $('#app').classList.add('hidden');
  $('#loginScreen').classList.remove('hidden');
  const e = $('#loginErr');
  if (msg) {
    e.textContent = msg;
    e.classList.remove('hidden');
  } else e.classList.add('hidden');
  const b = $('#loginBtn');
  b.disabled = false;
  b.innerHTML = '<i class="fa-solid fa-right-to-bracket"></i> Ingresar';
}
$('#loginForm').addEventListener('submit', async ev => {
  ev.preventDefault();
  const b = $('#loginBtn');
  b.disabled = true;
  b.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> Verificando…';
  const { data, error } = await sb.auth.signInWithPassword({
    email: $('#loginEmail').value.trim(),
    password: $('#loginPass').value
  });
  if (error) return showLogin('Correo o contraseña incorrectos.');
  await afterLogin(data.session);
});

$('#loginShield').src = $('.brand .shield img').src;
$('#tbShield').src = $('.brand .shield img').src;
if ('serviceWorker' in navigator && /^https?:$/.test(location.protocol)) {
  window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
}

/* Si se llega desde el correo de invitación o de recuperación, se pedirá definir la contraseña.
   Se lee antes de crear el cliente, porque supabase-js limpia el enlace de la barra de direcciones. */
const LLEGADA_CLAVE = /type=(invite|recovery)/.test(location.hash);
(async function boot() {
  const url = CFG.SUPABASE_URL || lsGet('ce_url'),
    key = CFG.SUPABASE_ANON_KEY || lsGet('ce_key');
  if (url && key && window.supabase) {
    try {
      sb = window.supabase.createClient(url, key, { auth: { persistSession: true, autoRefreshToken: true } });
      S.demo = false;
    } catch (e) {
      console.error(e);
    }
  }
  if (S.demo) {
    await loadHist();
    seedDemo();
    S.profile = { ...DEMO.profiles[0] };
    S.user = { email: S.profile.email };
    await demoAudit('requerimientos', 'INSERT', 'seed', { nota: 'Carga inicial de demostración' }, 'sistema');
    return enterApp();
  }
  const { data } = await sb.auth.getSession();
  if (data.session) await afterLogin(data.session);
  else showLogin();
})();
/* Gancho para las pruebas automáticas: solo existe si se construye con --pruebas y se abre con ?cetest */
if (CE_BUILD.pruebas && /[?&]cetest\b/.test(location.search))
  window.__CE_TEST = {
    go: v => go(v),
    NAV,
    rol: () => rol(),
    view: () => S.view,
    closeModal: () => closeModal(),
    dir: () => DIRLIST,
    contactsOf: o => contactsOf(o),
    orgs: () => mainOrgsAll()
  };

})();
</script>
