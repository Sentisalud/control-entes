<!DOCTYPE html>
<html lang="es" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#040A19">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<title>Control de Entes · Alcaldía de Cali</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..800&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600;700&display=swap" rel="stylesheet">
<!-- Estilos: src/css/*.css, unidos en orden por scripts/build.mjs -->
<style>
/* ===== src/css/01-base-y-variables.css ===== */
/**
 * src/css/01-base-y-variables.css
 * Variables de color, tipografía y tamaños (paleta de la bandera de Cali y oro del escudo).
 * Los archivos se unen en orden numérico; un archivo posterior puede sobrescribir reglas de uno anterior.
 */
/* =====================================================================
   Control de Entes · Identidad Alcaldía de Santiago de Cali
   Paleta tomada de la bandera de Cali (azul, rojo, blanco, verde) y el oro del escudo.
   ===================================================================== */
:root {
  --azul: #0b3d91;
  --azul2: #2f66c9;
  --azul7: #082f72;
  --azul9: #062456;
  --azul10: #041a40;
  --oro: #d4a72c;
  --rojoCali: #d21f3c;
  --verdeCali: #138a44;
  --bg: #f3f5fa;
  --bg2: #eaeef5;
  --panel: #ffffff;
  --panel2: #f6f8fc;
  --line: #e1e6ef;
  --line2: #cdd5e2;
  --ink: #13203a;
  --soft: #55627a;
  --faint: #6a768c;
  /* nombres heredados que usa la lógica de la app */
  --green: #0b3d91;
  --green2: #082f72;
  --glow: #0e6e36;
  --gdim: #e3f4ea;
  --gold: #d4a72c;
  --red: #d21f3c;
  --redbg: #fce8eb;
  --redink: #b0172f;
  --yel: #f2b230;
  --yelbg: #fdf3dc;
  --yelink: #9a5b00;
  --side: 276px;
  --side-c: 78px;
  --r: 14px;
  --shadow: 0 1px 2px rgba(19, 32, 58, 0.06), 0 2px 8px rgba(19, 32, 58, 0.04);
  --tab-h: 64px;
  color-scheme: dark;
}
* {
  box-sizing: border-box;
}
html,
body {
  height: 100%;
  max-width: 100%;
  overflow-x: clip;
}
body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font-family:
    Inter,
    -apple-system,
    BlinkMacSystemFont,
    "Segoe UI",
    Roboto,
    Arial,
    sans-serif;
  font-size: 14px;
  -webkit-font-smoothing: antialiased;
  font-variant-numeric: tabular-nums;
  -webkit-tap-highlight-color: transparent;
}
h1,
h2,
h3,
h4 {
  font-family:
    Archivo,
    Inter,
    -apple-system,
    "Segoe UI",
    Roboto,
    Arial,
    sans-serif;
  margin: 0;
  letter-spacing: -0.01em;
  color: var(--azul9);
}
.mono {
  font-family: "JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, monospace;
}
.hidden {
  display: none !important;
}
button {
  font: inherit;
  color: inherit;
  cursor: pointer;
}
a {
  color: var(--azul);
}
::selection {
  background: rgba(11, 61, 145, 0.18);
}
:focus-visible {
  outline: 3px solid var(--oro);
  outline-offset: 2px;
  border-radius: 8px;
}
::-webkit-scrollbar {
  width: 8px;
  height: 8px;
}
::-webkit-scrollbar-thumb {
  background: #c3ccda;
  border-radius: 8px;
}

/* ===== src/css/02-estructura.css ===== */
/**
 * src/css/02-estructura.css
 * Estructura general: barra lateral, barra superior y contenido.
 * Los archivos se unen en orden numérico; un archivo posterior puede sobrescribir reglas de uno anterior.
 */
/* ---------- Estructura ---------- */
.app {
  display: flex;
  min-height: 100vh;
}
.sidebar {
  width: var(--side);
  flex: none;
  color: #fff;
  background: linear-gradient(180deg, var(--azul9) 0%, var(--azul10) 100%);
  display: flex;
  flex-direction: column;
  position: sticky;
  top: 0;
  height: 100vh;
  z-index: 60;
  transition: width 0.2s ease;
}
.sidebar::after {
  content: "";
  position: absolute;
  top: 0;
  right: 0;
  bottom: 0;
  width: 4px;
  background: linear-gradient(
    180deg,
    #2f66c9 0 30%,
    var(--rojoCali) 30% 37%,
    #fff 37% 63%,
    var(--rojoCali) 63% 70%,
    #1fa557 70% 100%
  );
}
.main {
  flex: 1;
  min-width: 0;
  display: flex;
  flex-direction: column;
  overflow-x: clip;
}
.collapsed .sidebar {
  width: var(--side-c);
}

.brand {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 18px 16px 16px;
  border-bottom: 1px solid rgba(255, 255, 255, 0.1);
}
.shield {
  width: 44px;
  height: 48px;
  flex: none;
  display: flex;
  align-items: center;
  justify-content: center;
  filter: drop-shadow(0 4px 10px rgba(0, 0, 0, 0.3));
}
.shield img {
  width: 100%;
  height: 100%;
  object-fit: contain;
}
.brand-t {
  min-width: 0;
  flex: 1;
  overflow: hidden;
}
.brand-t b {
  display: block;
  font-family: Archivo, Inter, sans-serif;
  font-size: 1rem;
  line-height: 1.15;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.brand-t small {
  display: block;
  color: #b9cbea;
  font-size: 0.74rem;
  font-weight: 500;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.icon-btn {
  width: 36px;
  height: 36px;
  border-radius: 10px;
  background: var(--panel);
  border: 1px solid var(--line);
  color: var(--soft);
  display: inline-flex;
  align-items: center;
  justify-content: center;
  flex: none;
}
.icon-btn:hover {
  color: var(--azul);
  border-color: var(--azul2);
}
.sidebar .icon-btn {
  background: rgba(255, 255, 255, 0.08);
  border-color: rgba(255, 255, 255, 0.16);
  color: #d6e2f6;
}
.sidebar .icon-btn:hover {
  background: rgba(255, 255, 255, 0.16);
  color: #fff;
}
.collapsed .brand-t,
.collapsed .nav-group,
.collapsed .nav-label,
.collapsed .user-t,
.collapsed .logout {
  display: none;
}
.collapsed .brand {
  justify-content: center;
  flex-wrap: wrap;
}
.collapsed .nav-item {
  justify-content: center;
  padding: 11px 0;
}
.collapsed .nav-item .badge {
  position: absolute;
  top: 4px;
  right: 14px;
}
.collapsed .user {
  justify-content: center;
}

.nav {
  flex: 1;
  overflow-y: auto;
  overflow-x: hidden;
  padding: 6px 12px 12px;
}
.nav::-webkit-scrollbar-thumb {
  background: rgba(255, 255, 255, 0.2);
}
.nav-group {
  font-size: 0.7rem;
  font-weight: 700;
  letter-spacing: 0.06em;
  text-transform: uppercase;
  color: #8fa6cf;
  padding: 18px 10px 6px;
}
.nav-item {
  position: relative;
  display: flex;
  align-items: center;
  gap: 12px;
  width: 100%;
  padding: 10px 12px;
  border: 0;
  background: transparent;
  border-radius: 12px;
  color: #d6e2f6;
  font-weight: 600;
  font-size: 0.88rem;
  text-align: left;
  transition:
    background 0.15s,
    color 0.15s;
}
.nav-item i {
  width: 18px;
  text-align: center;
  font-size: 0.95rem;
  color: #9fb4d8;
}
.nav-item:hover {
  background: rgba(255, 255, 255, 0.07);
  color: #fff;
}
.nav-item.active {
  background: #fff;
  color: var(--azul9);
  box-shadow: 0 6px 16px rgba(0, 0, 0, 0.18);
}
.nav-item.active i {
  color: var(--azul);
}
.nav-item.active::before {
  content: "";
  position: absolute;
  left: -12px;
  top: 10px;
  bottom: 10px;
  width: 4px;
  border-radius: 0 4px 4px 0;
  background: var(--oro);
}
.nav-label {
  flex: 1;
  white-space: normal;
  line-height: 1.2;
}
.badge {
  background: var(--rojoCali);
  color: #fff;
  border-radius: 20px;
  font-size: 0.68rem;
  font-weight: 700;
  padding: 1px 7px;
}

.user {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 14px 14px;
  border-top: 1px solid rgba(255, 255, 255, 0.1);
}
.avatar {
  width: 38px;
  height: 38px;
  border-radius: 50%;
  background: rgba(255, 255, 255, 0.12);
  display: flex;
  align-items: center;
  justify-content: center;
  color: #fff;
  flex: none;
}
.user-t {
  flex: 1;
  min-width: 0;
}
.user-t b {
  display: block;
  font-size: 0.8rem;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.user-t small {
  color: #b9cbea;
  font-size: 0.72rem;
}

.topbar {
  position: sticky;
  top: 0;
  z-index: 40;
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 14px 26px;
  padding-top: calc(14px + env(safe-area-inset-top, 0px));
  background: rgba(243, 245, 250, 0.9);
  backdrop-filter: blur(12px);
  -webkit-backdrop-filter: blur(12px);
  border-bottom: 1px solid var(--line);
}
.tb-shield {
  display: none;
  width: 34px;
  height: 38px;
  flex: none;
}
.tb-shield img {
  width: 100%;
  height: 100%;
  object-fit: contain;
}
.burger {
  display: none;
}
.title {
  min-width: 0;
}
.title h2 {
  font-size: 1.22rem;
}
.title small {
  color: var(--soft);
  font-size: 0.78rem;
}
.spacer {
  flex: 1;
}
.mode {
  font-size: 0.7rem;
  font-weight: 700;
  padding: 5px 10px;
  border-radius: 20px;
  display: inline-flex;
  gap: 7px;
  align-items: center;
  white-space: nowrap;
}
.mode .dot {
  width: 7px;
  height: 7px;
  border-radius: 50%;
  background: currentColor;
  animation: pulse 1.6s infinite;
}
.mode.live {
  color: var(--glow);
  background: var(--gdim);
}
.mode.demo {
  color: var(--yelink);
  background: var(--yelbg);
}
.mode.off {
  color: var(--redink);
  background: var(--redbg);
}
@keyframes pulse {
  50% {
    opacity: 0.35;
  }
}

select,
input,
textarea {
  font: inherit;
  color: var(--ink);
  background: var(--panel);
  border: 1px solid var(--line2);
  border-radius: 10px;
  padding: 10px 12px;
  outline: none;
  width: 100%;
}
select {
  appearance: none;
  -webkit-appearance: none;
  padding-right: 30px;
  background-image: linear-gradient(45deg, transparent 50%, var(--soft) 50%),
    linear-gradient(135deg, var(--soft) 50%, transparent 50%);
  background-position:
    calc(100% - 15px) 50%,
    calc(100% - 10px) 50%;
  background-size: 5px 5px;
  background-repeat: no-repeat;
}
input:focus,
select:focus,
textarea:focus {
  border-color: var(--azul2);
  box-shadow: 0 0 0 3px rgba(47, 102, 201, 0.18);
}
input::placeholder,
textarea::placeholder {
  color: #97a2b5;
}
textarea {
  resize: vertical;
  min-height: 84px;
}
input[type="range"] {
  padding: 0;
  border: 0;
  background: transparent;
  box-shadow: none;
}
.topbar select {
  width: auto;
  padding: 8px 30px 8px 12px;
}

.banner {
  margin: 16px 26px 0;
  padding: 11px 14px;
  border-radius: 12px;
  font-size: 0.82rem;
  border: 1px solid #f5d894;
  background: var(--yelbg);
  color: var(--yelink);
}
.content {
  padding: 20px 26px 48px;
  max-width: 1280px;
  width: 100%;
}

/* ===== src/css/03-componentes.css ===== */
/**
 * src/css/03-componentes.css
 * Componentes reutilizables: tarjetas, indicadores, botones, tablas, formularios, pastillas de estado.
 * Los archivos se unen en orden numérico; un archivo posterior puede sobrescribir reglas de uno anterior.
 */
/* ---------- Componentes ---------- */
.card {
  background: var(--panel);
  border: 1px solid var(--line);
  border-radius: 18px;
  padding: 18px;
  box-shadow: var(--shadow);
}
.card h3 {
  font-size: 1rem;
  margin-bottom: 4px;
}
.card .sub {
  color: var(--soft);
  font-size: 0.8rem;
  margin-bottom: 14px;
}
.grid {
  display: grid;
  gap: 12px;
}
.g-kpi {
  grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
}
.g-2 {
  grid-template-columns: repeat(auto-fit, minmax(340px, 1fr));
}
.kpi {
  position: relative;
  padding: 14px 16px;
  overflow: hidden;
}
.kpi::before {
  content: "";
  position: absolute;
  left: 0;
  top: 0;
  bottom: 0;
  width: 4px;
  background: var(--azul);
}
.kpi small {
  display: block;
  font-size: 0.74rem;
  font-weight: 600;
  color: var(--soft);
  margin-bottom: 6px;
}
.kpi b {
  font-family: Archivo, Inter, sans-serif;
  font-size: 1.9rem;
  font-weight: 800;
  line-height: 1;
  letter-spacing: -0.03em;
  color: var(--azul9);
}
.kpi .kpi-of {
  font-size: 0.95rem;
  color: var(--faint);
  font-weight: 700;
}
.kpi.r::before {
  background: var(--rojoCali);
}
.kpi.r b {
  color: var(--redink);
}
.kpi.y::before {
  background: var(--yel);
}
.kpi.y b {
  color: var(--yelink);
}
.kpi.g::before {
  background: var(--verdeCali);
}
.kpi.g b {
  color: var(--glow);
}

.pill {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  border-radius: 20px;
  padding: 3px 10px;
  font-size: 0.7rem;
  font-weight: 700;
  white-space: nowrap;
}
.pill i {
  width: 7px;
  height: 7px;
  border-radius: 50%;
  background: currentColor;
}
.pill.rojo {
  background: var(--redbg);
  color: var(--redink);
}
.pill.rojo i {
  animation: pulse 1.3s infinite;
}
.pill.amarillo {
  background: var(--yelbg);
  color: var(--yelink);
}
.pill.verde {
  background: var(--gdim);
  color: var(--glow);
}
.pill.neutral {
  background: var(--bg2);
  color: var(--soft);
}

.btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  border: 1px solid var(--line2);
  background: var(--panel);
  color: var(--azul9);
  padding: 10px 15px;
  border-radius: 11px;
  font-weight: 600;
  font-size: 0.85rem;
  transition: 0.15s;
  white-space: nowrap;
  text-decoration: none;
  min-height: 40px;
}
.btn:hover {
  border-color: var(--azul2);
  color: var(--azul);
}
.btn.primary {
  background: var(--azul);
  border-color: transparent;
  color: #fff;
  box-shadow: 0 6px 16px rgba(11, 61, 145, 0.25);
}
.btn.primary:hover {
  background: var(--azul7);
  color: #fff;
}
.btn.danger {
  background: var(--rojoCali);
  border-color: transparent;
  color: #fff;
  box-shadow: 0 6px 16px rgba(210, 31, 60, 0.22);
}
.btn.danger:hover {
  background: #b0172f;
  color: #fff;
}
.btn.sm {
  padding: 7px 11px;
  font-size: 0.78rem;
  border-radius: 9px;
  min-height: 34px;
}
.btn:disabled {
  opacity: 0.45;
  cursor: not-allowed;
}

.toolbar {
  display: flex;
  flex-wrap: wrap;
  gap: 10px;
  margin-bottom: 14px;
  align-items: center;
}
.toolbar .grow {
  flex: 1;
  min-width: 200px;
  position: relative;
}
.toolbar .grow i {
  position: absolute;
  left: 12px;
  top: 50%;
  transform: translateY(-50%);
  color: var(--faint);
}
.toolbar .grow input {
  padding-left: 36px;
}
.toolbar select {
  width: auto;
  min-width: 150px;
}

.tbl-wrap {
  overflow-x: auto;
  border: 1px solid var(--line);
  border-radius: 14px;
  background: var(--panel);
  -webkit-overflow-scrolling: touch;
}
.tbl {
  width: 100%;
  border-collapse: collapse;
  min-width: 760px;
}
.tbl th {
  font-size: 0.72rem;
  font-weight: 700;
  color: var(--soft);
  text-align: left;
  padding: 11px 14px;
  background: var(--panel2);
  border-bottom: 1px solid var(--line);
  white-space: nowrap;
}
.tbl td {
  padding: 12px 14px;
  border-bottom: 1px solid var(--line);
  vertical-align: top;
  font-size: 0.85rem;
}
.tbl tr:last-child td {
  border-bottom: 0;
}
.tbl tbody tr.click {
  cursor: pointer;
}
.tbl tbody tr.click:hover {
  background: #f2f6fd;
}
.tbl .asunto {
  max-width: 340px;
  color: var(--soft);
  line-height: 1.35;
}
.muted {
  color: var(--soft);
}
.faint {
  color: var(--faint);
}
.right {
  text-align: right;
}

.field {
  margin-bottom: 14px;
}
.field label {
  display: block;
  font-size: 0.75rem;
  font-weight: 600;
  color: var(--soft);
  margin-bottom: 6px;
}
.field .hint {
  font-size: 0.75rem;
  color: var(--faint);
  margin-top: 5px;
}
.field .err,
.hint.err {
  font-size: 0.76rem;
  color: var(--redink);
  margin-top: 5px;
}
.row2 {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 12px;
}

.bar {
  display: flex;
  height: 10px;
  border-radius: 8px;
  overflow: hidden;
  background: var(--bg2);
}
.bar span {
  display: block;
  height: 100%;
}
.bar .rojo {
  background: var(--rojoCali);
}
.bar .amarillo {
  background: var(--yel);
}
.bar .verde {
  background: var(--verdeCali);
}
.list-row {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 11px 0;
  border-bottom: 1px solid var(--line);
}
.list-row:last-child {
  border-bottom: 0;
}
.list-row .grow {
  flex: 1;
  min-width: 0;
}
.list-row b {
  display: block;
  font-size: 0.86rem;
}
.list-row small {
  color: var(--soft);
  font-size: 0.77rem;
}
.ellipsis {
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.empty {
  text-align: center;
  padding: 42px 16px;
  color: var(--soft);
}
.empty i {
  font-size: 2rem;
  color: #b3bccb;
  margin-bottom: 10px;
  display: block;
}

.alert-card {
  border: 1px solid #f3c2ca;
  background: #fff7f8;
  border-radius: 16px;
  padding: 14px 16px;
  margin-bottom: 12px;
}
.alert-card.venc {
  border-color: var(--rojoCali);
  box-shadow: 0 0 0 1px rgba(210, 31, 60, 0.2);
}

dl.kv {
  margin: 0;
}
dl.kv div {
  display: flex;
  justify-content: space-between;
  gap: 16px;
  padding: 9px 0;
  border-bottom: 1px solid var(--line);
}
dl.kv div:last-child {
  border-bottom: 0;
}
dl.kv dt {
  color: var(--soft);
  font-weight: 600;
  font-size: 0.82rem;
}
dl.kv dd {
  margin: 0;
  font-weight: 600;
  text-align: right;
  font-size: 0.85rem;
  word-break: break-word;
}
.chain-ok {
  border-color: var(--verdeCali) !important;
}
.chain-bad {
  border-color: var(--rojoCali) !important;
}

/* ===== src/css/04-modal-avisos-ingreso.css ===== */
/**
 * src/css/04-modal-avisos-ingreso.css
 * Ventanas modales, avisos emergentes y pantalla de ingreso.
 * Los archivos se unen en orden numérico; un archivo posterior puede sobrescribir reglas de uno anterior.
 */
/* ---------- Modal / avisos / ingreso ---------- */
.overlay {
  position: fixed;
  inset: 0;
  background: rgba(4, 26, 64, 0.5);
  backdrop-filter: blur(3px);
  z-index: 90;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 16px;
}
.modal {
  background: var(--panel);
  border-radius: 20px;
  width: min(560px, 100%);
  max-height: 92vh;
  overflow: auto;
  box-shadow: 0 30px 80px rgba(4, 26, 64, 0.4);
}
.modal header {
  position: sticky;
  top: 0;
  z-index: 2;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  padding: 16px 20px;
  background: var(--azul9);
  color: #fff;
}
.modal header h3 {
  color: #fff;
  font-size: 1.02rem;
}
.modal header .icon-btn {
  background: rgba(255, 255, 255, 0.12);
  border-color: transparent;
  color: #fff;
}
.modal .body {
  padding: 18px 20px;
}
.modal footer {
  position: sticky;
  bottom: 0;
  display: flex;
  flex-wrap: wrap;
  justify-content: flex-end;
  gap: 10px;
  padding: 14px 20px;
  border-top: 1px solid var(--line);
  background: var(--panel);
}
#toasts {
  position: fixed;

  right: 14px;
  z-index: 200;
  display: flex;
  flex-direction: column;
  gap: 8px;
  width: min(92vw, 380px);

.toast {
  background: var(--azul9);

  border-radius: 12px;
  padding: 12px 14px;
  font-size: 0.85rem;
  font-weight: 600;
  display: flex;
  gap: 10px;
  align-items: flex-start;

.toast.err {

}
.toast i {
  margin-top: 2px;
  color: #7ce0a6;
}
.toast.err i {

}
@keyframes tin {

}
.login {
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 20px;

}
.login .card {

}
.login .shield {

  height: 82px;
  margin: 0 auto 14px;
}

.mobile-ov {
  display: none;
}

/* ===== src/css/07-centro-de-mando.css ===== */
/**
 * src/css/07-centro-de-mando.css
 * Centro de mando: cifra global, mosaico, máquina del tiempo, cinta y lectura del corte.
 * Los archivos se unen en orden numérico; un archivo posterior puede sobrescribir reglas de uno anterior.
 */
/* =====================================================================
   CENTRO DE MANDO
   ===================================================================== */
.cmd {
  position: relative;
  color: #fff;
  border-radius: 22px;
  overflow: hidden;
  contain: paint;
  max-width: 100%;
  margin-bottom: 14px;
  padding: 18px 18px 0;
  background: radial-gradient(90% 60% at 100% 0%, rgba(52, 110, 214, 0.45), transparent 60%),
    radial-gradient(60% 45% at 0% 100%, rgba(47, 102, 201, 0.22), transparent 60%),
    linear-gradient(180deg, #06204d, #030f2a);
  box-shadow: 0 14px 40px rgba(6, 36, 86, 0.25);
}
.cmd::before {
  content: "";
  position: absolute;
  inset: 0;
  pointer-events: none;
  opacity: 0.4;
  background-image: linear-gradient(rgba(255, 255, 255, 0.05) 1px, transparent 1px),
    linear-gradient(90deg, rgba(255, 255, 255, 0.05) 1px, transparent 1px);
  background-size: 24px 24px;
  -webkit-mask-image: linear-gradient(180deg, #000 10%, transparent 70%);
  mask-image: linear-gradient(180deg, #000 10%, transparent 70%);
}
.cmd > * {
  position: relative;
}
.cmd-line {
  display: flex;
  align-items: center;
  gap: 8px;
  font-size: 0.78rem;
  color: #b9cbea;
}
.pulso-vivo {
  width: 8px;
  height: 8px;
  border-radius: 50%;
  background: #3be07e;
  box-shadow: 0 0 0 0 rgba(59, 224, 126, 0.7);
  animation: pulsoVivo 2s infinite;
  flex: none;
}
@keyframes pulsoVivo {
  70% {
    box-shadow: 0 0 0 8px rgba(59, 224, 126, 0);
  }
  100% {
    box-shadow: 0 0 0 0 rgba(59, 224, 126, 0);
  }
}
.cmd-fig {
  display: flex;
  align-items: flex-end;
  gap: 16px;
  margin-top: 6px;
  flex-wrap: wrap;
}
.big {
  font:
    800 88px/0.9 Archivo,
    Inter,
    -apple-system,
    "Segoe UI",
    sans-serif;
  letter-spacing: -0.055em;
  color: #fff;
}
.big sup {
  font-size: 34px;
  letter-spacing: -0.02em;
  vertical-align: top;
  position: relative;
  top: 12px;
  margin-left: 3px;
  color: #b9cbea;
}
.cmd-fig p {
  margin: 0 0 8px;
  font-size: 0.88rem;
  color: #d6e2f6;
  max-width: 300px;
  line-height: 1.4;
}
.cmd-fig p b {
  color: #fff;
}
.states {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 8px;
  margin-top: 16px;
}
.st {
  display: flex;
  flex-direction: column;
  align-items: flex-start;
  padding: 9px 11px;
  border-radius: 12px;
  background: rgba(255, 255, 255, 0.07);
  border: 1px solid rgba(255, 255, 255, 0.12);
  text-align: left;
  color: #fff;
  transition:
    background 0.2s,
    border-color 0.2s;
}
.st:hover {
  background: rgba(255, 255, 255, 0.12);
}
.st b {
  font:
    800 22px/1 Archivo,
    Inter,
    sans-serif;
}
.st[data-s="rojo"] b {
  color: #ff8a99;
}
.st[data-s="amarillo"] b {
  color: #ffd27a;
}
.st[data-s="verde"] b {
  color: #6ef0b8;
}
.st[data-s="gris"] b {
  color: #b9cbea;
}
.st span {
  display: flex;
  align-items: center;
  gap: 6px;
  margin-top: 5px;
  font-size: 0.72rem;
  color: #c9d7ee;
  white-space: nowrap;
}
.st span i {
  width: 9px;
  height: 9px;
  border-radius: 3px;
}
.sw-r {
  background: #ff5c70;
  box-shadow: 0 0 8px rgba(255, 92, 112, 0.8);
}
.sw-y {
  background: #ffc44d;
  box-shadow: 0 0 8px rgba(255, 196, 77, 0.7);
}
.sw-g {
  background: #38d99a;
  box-shadow: 0 0 8px rgba(56, 217, 154, 0.7);
}
.sw-n {
  background: #8fa3c4;
}
.st[aria-pressed="true"] {
  background: rgba(255, 255, 255, 0.2);
  border-color: rgba(255, 255, 255, 0.6);
}
.cmd-h {
  display: flex;
  justify-content: space-between;
  align-items: baseline;
  gap: 10px;
  flex-wrap: wrap;
  margin: 20px 0 8px;
  font-size: 0.76rem;
  color: #b9cbea;
}
.cmd-h b {
  font-size: 0.95rem;
  color: #fff;
}
.tmbar {
  display: flex;
  gap: 12px;
  align-items: center;
  margin: 0 0 12px;
  flex-wrap: wrap;
}
.tmbar .btn {
  background: rgba(255, 255, 255, 0.1);
  border-color: rgba(255, 255, 255, 0.2);
  color: #fff;
  box-shadow: none;
}
.tmbar .btn:hover {
  background: rgba(255, 255, 255, 0.18);
  color: #fff;
}
.tmbar input[type="range"] {
  flex: 1;
  min-width: 140px;
  accent-color: var(--oro);
}
.tmlabel {
  font-size: 0.78rem;
  color: var(--oro);
  white-space: nowrap;
  font-weight: 600;
}
.tm {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(118px, 1fr));
  gap: 7px;
}
.tile {
  position: relative;
  min-height: 96px;
  border: 1px solid rgba(255, 255, 255, 0.08);
  border-radius: 12px;
  padding: 10px 11px 12px;
  text-align: left;
  display: flex;
  flex-direction: column;
  justify-content: space-between;
  gap: 6px;
  overflow: hidden;
  color: #e6eefb;
  background: linear-gradient(180deg, rgba(255, 255, 255, 0.06), rgba(255, 255, 255, 0.02));
  backdrop-filter: blur(6px);
  -webkit-backdrop-filter: blur(6px);
  transition:
    opacity 0.25s,
    transform 0.25s,
    filter 0.25s,
    border-color 0.45s,
    box-shadow 0.45s,
    background 0.45s;
  --c: 148, 163, 184;
}
.tile::before {
  content: "";
  position: absolute;
  left: 0;
  right: 0;
  top: 0;
  height: 2px;
  background: rgb(var(--c));
  opacity: 0.9;
  box-shadow: 0 0 12px rgba(var(--c), 0.8);
}
.tile b {
  font-size: 0.78rem;
  line-height: 1.18;
  font-weight: 600;
  color: #dce6f7;
  display: -webkit-box;
  -webkit-line-clamp: 3;
  -webkit-box-orient: vertical;
  overflow: hidden;
}
.tile .tl-f {
  display: flex;
  align-items: baseline;
  justify-content: space-between;
  gap: 6px;
}
.tile .num {
  font:
    800 1.2rem/1 Archivo,
    Inter,
    sans-serif;
  letter-spacing: -0.02em;
  color: rgb(var(--c));
  text-shadow: 0 0 14px rgba(var(--c), 0.45);
}
.tile small {
  white-space: nowrap;
  flex: none;
  font-size: 0.64rem;
  font-weight: 600;
  color: rgba(220, 230, 247, 0.6);
  font-family: "JetBrains Mono", ui-monospace, monospace;
}
.tile .tl-bar {
  position: absolute;
  left: 0;
  bottom: 0;
  height: 3px;
  background: rgb(var(--c));
  box-shadow: 0 0 10px rgba(var(--c), 0.7);
  transition: width 0.45s;
}
.tile.rojo {
  --c: 255, 92, 112;
  border-color: rgba(255, 92, 112, 0.45);
  background: linear-gradient(180deg, rgba(255, 92, 112, 0.16), rgba(255, 92, 112, 0.03));
  box-shadow:
    0 0 22px rgba(255, 92, 112, 0.12),
    inset 0 0 0 1px rgba(255, 92, 112, 0.08);
}
.tile.amarillo {
  --c: 255, 196, 77;
  border-color: rgba(255, 196, 77, 0.35);
  background: linear-gradient(180deg, rgba(255, 196, 77, 0.12), rgba(255, 196, 77, 0.02));
}
.tile.verde {
  --c: 56, 217, 154;
  border-color: rgba(56, 217, 154, 0.35);
  background: linear-gradient(180deg, rgba(56, 217, 154, 0.12), rgba(56, 217, 154, 0.02));
}
.tile.gris {
  --c: 120, 138, 168;
  border-style: dashed;
  border-color: rgba(255, 255, 255, 0.16);
  background: rgba(255, 255, 255, 0.03);
}
.tile.gris::before,
.tile.gris .tl-bar {
  display: none;
}
.tile.gris .num {
  color: #8fa3c4;
  text-shadow: none;
}
.tile.rojo::after {
  content: "";
  position: absolute;
  top: 10px;
  right: 10px;
  width: 6px;
  height: 6px;
  border-radius: 50%;
  background: rgb(255, 92, 112);
  box-shadow: 0 0 0 0 rgba(255, 92, 112, 0.7);
  animation: pulsoVivo 2s infinite;
}
.tile:hover {
  transform: translateY(-2px);
  border-color: rgba(var(--c), 0.8);
  box-shadow: 0 8px 26px rgba(var(--c), 0.22);
}
.tm.filtering .tile:not(.match) {
  opacity: 0.16;
  filter: saturate(0.2);
}
.tm.reveal .tile {
  animation: pop 0.5s cubic-bezier(0.2, 0.8, 0.2, 1) both;
  animation-delay: calc(var(--i) * 20ms);
}
@keyframes pop {
  from {
    opacity: 0;
    transform: translateY(8px) scale(0.94);
  }
}
.cmd-legend {
  font-size: 0.72rem;
  color: #9fb4d8;
  margin: 10px 0 0;
}
.ticker {
  position: relative;
  contain: paint;
  margin: 16px -18px 0;
  border-top: 1px solid rgba(255, 255, 255, 0.12);
  background: rgba(4, 26, 64, 0.65);
  overflow: hidden;
  white-space: nowrap;
}
.tk-lbl {
  position: absolute;
  left: 0;
  top: 0;
  bottom: 0;
  z-index: 2;
  display: flex;
  align-items: center;
  padding: 0 12px 0 18px;
  background: var(--azul10);
  box-shadow: 16px 0 14px var(--azul10);
  font-size: 0.72rem;
  font-weight: 700;
  color: var(--oro);
}
.tk-track {
  display: inline-flex;
  gap: 30px;
  padding: 12px 0 12px 130px;
  animation: run 70s linear infinite;
  font-size: 0.8rem;
  color: #d6e2f6;
}
.tk-track b {
  color: #fff;
}
.tk-track em {
  font-style: normal;
  font-family: "JetBrains Mono", ui-monospace, monospace;
  font-size: 0.74rem;
  color: #9fb4d8;
  margin-left: 4px;
}
@keyframes run {
  to {
    transform: translateX(-50%);
  }
}
.trio {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  background: var(--panel);
  border: 1px solid var(--line);
  border-radius: 16px;
  overflow: hidden;
  margin-bottom: 14px;
  box-shadow: var(--shadow);
}
.trio button {
  background: none;
  border: 0;
  border-left: 1px solid var(--line);
  padding: 13px 14px;
  text-align: left;
}
.trio button:first-child {
  border-left: 0;
}
.trio button:hover {
  background: var(--panel2);
}
.trio b {
  display: block;
  font:
    800 1.6rem/1.05 Archivo,
    Inter,
    sans-serif;
  letter-spacing: -0.03em;
}
.trio small {
  display: block;
  font-size: 0.74rem;
  color: var(--soft);
  margin-top: 4px;
  line-height: 1.25;
}
.t-r {
  color: var(--redink);
}
.t-y {
  color: var(--yelink);
}
.t-b {
  color: var(--azul);
}
.brief {
  position: relative;
  margin-bottom: 14px;
  overflow: hidden;
  padding-left: 22px;
}
.brief::before {
  content: "";
  position: absolute;
  left: 0;
  top: 0;
  bottom: 0;
  width: 5px;
  background: linear-gradient(
    180deg,
    #2f66c9 0 30%,
    var(--rojoCali) 30% 40%,
    #fff 40% 60%,
    var(--rojoCali) 60% 70%,
    #1fa557 70%
  );
}
.brief-h {
  display: flex;
  align-items: center;
  gap: 8px;
  font-size: 0.78rem;
  font-weight: 700;
  color: var(--azul);
  margin-bottom: 8px;
}
.brief p {
  margin: 0 0 9px;
  font-size: 0.92rem;
  line-height: 1.55;
}
.brief mark {
  background: none;
  color: var(--azul);
  font-weight: 700;
}
.brief mark.r {
  color: var(--redink);
}
.brief-a {
  display: flex;
  gap: 8px;
  flex-wrap: wrap;
  margin-top: 6px;
}
.tmbar .tm-vent {
  flex: none;
}

/* ===== src/css/08-barra-de-pestanas.css ===== */
/**

/* ===== src/css/09-informe-ejecutivo.css ===== */
/**
 * src/css/09-informe-ejecutivo.css
 * Informe ejecutivo en pantalla y al imprimir o guardar como PDF.
 * Los archivos se unen en orden numérico; un archivo posterior puede sobrescribir reglas de uno anterior.
 */
/* ---------- Informe ejecutivo ---------- */
.paper {
  background: #fff;
  color: #13203a;
  border-radius: 12px;
  max-width: 860px;
  margin: 0 auto;
  padding: 34px 40px;
  font-family: Arial, Helvetica, sans-serif;
  font-size: 12.5px;
  line-height: 1.5;
  box-shadow: 0 12px 40px rgba(19, 32, 58, 0.15);
  border: 1px solid var(--line);
  -webkit-user-select: text;
  user-select: text;
}
.paper h1 {
  font-family: Arial, Helvetica, sans-serif;
  font-size: 20px;
  line-height: 1.2;
  margin: 4px 0 6px;
  color: #0b3d91;
  letter-spacing: 0;
}
.paper h2 {
  font-family: Arial, Helvetica, sans-serif;
  font-size: 14px;
  margin: 0 0 10px;
  color: #0b3d91;
  border-bottom: 2px solid #2f66c9;
  padding-bottom: 5px;
  letter-spacing: 0;
}
.paper h3 {
  font-family: Arial, Helvetica, sans-serif;
  font-size: 12.5px;
  margin: 14px 0 8px;
  color: #0b3d91;
  letter-spacing: 0;
}
.paper p {
  margin: 0 0 9px;
}
.rsec {
  margin: 0 0 20px;
}
.rhead {
  display: flex;
  gap: 16px;
  align-items: center;
  border-bottom: 3px solid #d4a72c;
  padding-bottom: 14px;
}
.rsmall {
  font-size: 10.5px;
  color: #55627a;
}
.rgrid {
  display: grid;
  grid-template-columns: repeat(5, 1fr);
  gap: 8px;
  margin-bottom: 12px;
}
.rk {
  border: 1px solid #dde3ec;
  border-radius: 8px;
  padding: 8px 10px;
  background: #f6f8fc;
}
.rk span {
  display: block;
  font-size: 9.5px;

}
.rk b {

}
.rt {

}
.rt th {

}
.rt td {

}
.rt tr {

.rflow {

.rfoot {

/* ===== src/css/10-celular.css ===== */
/**
 * src/css/10-celular.css
 * Ajustes para celular (pantallas de hasta 960 px).
 * Los archivos se unen en orden numérico; un archivo posterior puede sobrescribir reglas de uno anterior.
 */
/* ---------- Celular ---------- */
@media (max-width: 960px) {
  .sidebar {
    position: fixed;
    left: 0;
    top: 0;
    transform: translateX(-102%);
    transition: transform 0.25s cubic-bezier(0.2, 0.8, 0.2, 1);
    width: min(var(--side), 86vw) !important;
    box-shadow: 20px 0 60px rgba(4, 26, 64, 0.45);
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  .open .sidebar {
    transform: none;
  }
  .collapsed .brand-t,
  .collapsed .nav-group,
  .collapsed .nav-label,
  .collapsed .user-t,
  .collapsed .logout {
    display: revert;
  }
  .collapsed .nav-item {
    justify-content: flex-start;
    padding: 10px 12px;
  }
  .open .mobile-ov {
    display: block;
    position: fixed;
    inset: 0;
    background: rgba(4, 26, 64, 0.5);
    z-index: 55;
  }
  .burger {
    display: inline-flex;
  }
  .tb-shield {
    display: block;
  }
  .topbar {
    padding: 10px 14px;
    padding-top: calc(10px + env(safe-area-inset-top, 0px));
    gap: 10px;
    flex-wrap: wrap;
    background: var(--azul9);
    border-bottom: 0;
    color: #fff;
  }
  .topbar::after {
    content: "";
    position: absolute;
    left: 0;
    right: 0;
    bottom: -4px;
    height: 4px;
    background: linear-gradient(
      90deg,
      #2f66c9 0 30%,
      var(--rojoCali) 30% 37%,
      #fff 37% 63%,
      var(--rojoCali) 63% 70%,
      #1fa557 70%
    );
  }
  .topbar .icon-btn {
    background: rgba(255, 255, 255, 0.1);
    border-color: transparent;
    color: #fff;
  }
  .title {
    flex: 1;
  }
  .title h2 {
    font-size: 1.05rem;
    color: #fff;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .title small {
    display: none;
  }
  .topbar .spacer {
    display: none;
  }
  .topbar select {
    background-color: rgba(255, 255, 255, 0.1);
    border-color: rgba(255, 255, 255, 0.2);
    color: #fff;
    font-size: 0.8rem;
    padding: 7px 28px 7px 10px;
    background-image: linear-gradient(45deg, transparent 50%, #fff 50%),
      linear-gradient(135deg, #fff 50%, transparent 50%);
  }
  .topbar select option {
    color: #13203a;
  }
  .mode.demo {
    background: rgba(242, 178, 48, 0.2);
    color: #ffd27a;
  }
  .mode.live {
    background: rgba(59, 224, 126, 0.18);
    color: #8af0b4;
  }
  .content {
    padding: 18px 14px calc(var(--tab-h) + 30px + env(safe-area-inset-bottom, 0px));
  }
  .banner {
    margin: 16px 14px 0;
  }
  #btnCollapse {
    display: none;
  }
  .row2 {
    grid-template-columns: 1fr;
  }
  .hide-m {
    display: none !important;
  }
  .card {
    padding: 15px;
    border-radius: 16px;
  }
  .g-kpi {
    grid-template-columns: repeat(2, 1fr);
  }
  .kpi b {
    font-size: 1.55rem;
  }
  .g-2 {
    grid-template-columns: 1fr;
  }
  .toolbar .grow {
    flex: 1 1 100%;
    min-width: 0;
  }
  .toolbar select {
    flex: 1;
    min-width: 0;
    width: auto;
  }
  .toolbar .btn {
    flex: 1;
  }
  .dir-list {
    grid-template-columns: 1fr;
  }
  .tabbar {
    display: grid;
    grid-auto-flow: column;
    grid-auto-columns: 1fr;
    position: fixed;
    left: 10px;
    right: 10px;
    bottom: calc(10px + env(safe-area-inset-bottom, 0px));
    z-index: 50;
    background: rgba(6, 36, 86, 0.95);
    backdrop-filter: blur(14px);
    -webkit-backdrop-filter: blur(14px);
    border-radius: 20px;
    padding: 6px;
    box-shadow: 0 14px 34px rgba(6, 36, 86, 0.38);
  }
  .tab {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 3px;
    border: 0;
    background: none;
    color: #a9bde0;
    font-size: 0.66rem;
    font-weight: 600;
    padding: 8px 2px 7px;
    border-radius: 14px;
    min-height: 50px;
  }
  .tab i {
    font-size: 1.05rem;
  }
  .tab.on {
    background: rgba(255, 255, 255, 0.14);
    color: #fff;
  }
  .open .tabbar {
    display: none;
  }
  #toasts {
    top: auto;
    bottom: calc(var(--tab-h) + 24px + env(safe-area-inset-bottom, 0px));
    left: 14px;
    right: 14px;
    width: auto;
  }
  .overlay {
    align-items: flex-end;
    padding: 0;
  }
  .modal {
    width: 100% !important;
    max-height: 92vh;
    border-radius: 22px 22px 0 0;
  }
  .modal footer {
    padding-bottom: calc(14px + env(safe-area-inset-bottom, 0px));
  }
  .modal footer .btn {
    flex: 1;
  }
}
@media (max-width: 420px) {
  .big {
    font-size: 76px;
  }
  .states {
    grid-template-columns: repeat(4, 1fr);
    gap: 6px;
  }
  .st {
    padding: 8px;
  }
  .st b {
    font-size: 19px;
  }
  .tm {
    grid-template-columns: repeat(3, 1fr);
    gap: 6px;
  }
  .tile {
    min-height: 92px;
    padding: 8px;
  }
  .tile b {
    font-size: 0.72rem;
  }
  .tile .num {
    font-size: 0.95rem;
  }
  .tile small {
    font-size: 0.58rem;
  }
  .trio b {
    font-size: 1.35rem;
  }
}
@media (prefers-reduced-motion: reduce) {
  .pulso-vivo,
  .tile.rojo::after,
  .tk-track,
  .pill.rojo i,
  .mode .dot {
    animation: none;
  }
  .tm.reveal .tile {
    animation: none;
  }
  .sidebar {
    transition: none;
  }
}
@media print {
  .sidebar,
  .topbar,
  .banner,
  .toolbar,
  .no-print,
  .tabbar {
    display: none !important;
  }
  body {
    background: #fff;
    color: #000;
  }
  .content {
    padding: 0;
  }
}

@media (prefers-color-scheme: light) {
  :root:not([data-theme="dark"]) {
    --bg: #040a19;
  }
}
:root[data-theme="light"] {
  --bg: #040a19;
}

/* ===== src/css/11-tema-sala-de-control.css ===== */
/**
 * src/css/11-tema-sala-de-control.css
 * Tema oscuro "Sala de control" aplicado a toda la app (reemplaza los colores claros de los archivos anteriores).
 * Los archivos se unen en orden numérico; un archivo posterior puede sobrescribir reglas de uno anterior.
 */
/* =====================================================================
   TEMA "SALA DE CONTROL" · toda la aplicación
   Base azul noche de Cali, vidrio translúcido y acentos luminosos.
   El informe ejecutivo (.paper) se mantiene en papel blanco para imprimir.
   ===================================================================== */
:root {
  color-scheme: dark;
  --bg: #040a19;
  --bg2: #0b1630;
  --panel: rgba(14, 26, 54, 0.72);
  --panel2: rgba(20, 36, 72, 0.55);
  --line: rgba(148, 170, 210, 0.13);
  --line2: rgba(148, 170, 210, 0.24);
  --ink: #e8effc;
  --soft: #97a8c7;
  --faint: #7a8bab;
  --neo: #4c8dff;
  --neo2: #39c2ff;
  --oro: #e8bc45;
  --green: #4c8dff;
  --green2: #2f66c9;
  --glow: #38d99a;
  --gdim: rgba(56, 217, 154, 0.12);
  --red: #ff5c70;
  --redbg: rgba(255, 92, 112, 0.12);
  --redink: #ff8a99;
  --yel: #ffc44d;
  --yelbg: rgba(255, 196, 77, 0.12);
  --yelink: #ffd27a;
  --shadow: 0 10px 30px rgba(0, 0, 0, 0.35);
}
html {
  background: var(--bg);
}
body {
  background: var(--bg);
  color: var(--ink);
  background-image: radial-gradient(1100px 620px at 88% -12%, rgba(76, 141, 255, 0.2), transparent 60%),
    radial-gradient(900px 520px at -12% 112%, rgba(57, 194, 255, 0.1), transparent 60%),
    radial-gradient(700px 400px at 50% 50%, rgba(210, 31, 60, 0.04), transparent 70%);
  background-attachment: fixed;
}
body::before {
  content: "";
  position: fixed;
  inset: 0;
  pointer-events: none;
  z-index: 0;
  opacity: 0.5;
  background-image: linear-gradient(rgba(148, 170, 210, 0.045) 1px, transparent 1px),
    linear-gradient(90deg, rgba(148, 170, 210, 0.045) 1px, transparent 1px);
  background-size: 32px 32px;
  -webkit-mask-image: radial-gradient(ellipse at 60% 30%, #000 30%, transparent 80%);
  mask-image: radial-gradient(ellipse at 60% 30%, #000 30%, transparent 80%);
}
.app,
.login {
  position: relative;
  z-index: 1;
}
h1,
h2,
h3,
h4 {
  color: #f2f6ff;
}
a {
  color: #8fb6ff;
}
::selection {
  background: rgba(76, 141, 255, 0.35);
}
::-webkit-scrollbar-thumb {
  background: rgba(148, 170, 210, 0.25);
}
:focus-visible {
  outline-color: var(--neo2);
}

/* Barra lateral */
.sidebar {
  background: linear-gradient(180deg, rgba(7, 21, 51, 0.92), rgba(3, 10, 28, 0.96));
  border-right: 1px solid var(--line);
  backdrop-filter: blur(14px);
  -webkit-backdrop-filter: blur(14px);
}
.sidebar::after {
  width: 2px;
  opacity: 0.85;
}
.brand {
  border-bottom-color: var(--line);
}
.nav-group {
  color: #6f84ac;
  letter-spacing: 0.12em;
  font-size: 0.66rem;
}
.nav-item {
  color: #b9c7e2;
}
.nav-item i {
  color: #7e95bf;
}
.nav-item:hover {
  background: rgba(76, 141, 255, 0.08);
  color: #fff;
}
.nav-item.active {
  background: linear-gradient(90deg, rgba(76, 141, 255, 0.28), rgba(76, 141, 255, 0.06));
  color: #fff;
  box-shadow:
    inset 0 0 0 1px rgba(76, 141, 255, 0.35),
    0 0 24px rgba(76, 141, 255, 0.15);
}
.nav-item.active i {
  color: #9cc0ff;
  filter: drop-shadow(0 0 6px rgba(76, 141, 255, 0.8));
}
.nav-item.active::before {
  background: var(--neo2);
  box-shadow: 0 0 12px var(--neo2);
}
.badge {
  background: var(--red);
  box-shadow: 0 0 10px rgba(255, 92, 112, 0.6);
}
.user {
  border-top-color: var(--line);
}
.avatar {
  background: linear-gradient(135deg, #2f66c9, #39c2ff);
  box-shadow: 0 0 14px rgba(57, 194, 255, 0.35);
}

/* Barra superior con reloj */
.topbar {
  background: rgba(4, 10, 25, 0.72);
  border-bottom: 1px solid var(--line);
  backdrop-filter: blur(14px) saturate(140%);
  -webkit-backdrop-filter: blur(14px) saturate(140%);
}
.title h2 {
  color: #f2f6ff;
}
.title small {
  color: var(--soft);
}
.hud {
  font-family: "JetBrains Mono", ui-monospace, monospace;
  font-size: 0.74rem;
  color: #8fb6ff;
  letter-spacing: 0.04em;
  padding: 6px 10px;
  border: 1px solid rgba(76, 141, 255, 0.25);
  border-radius: 999px;
  background: rgba(76, 141, 255, 0.06);
  white-space: nowrap;
  text-transform: capitalize;
}
.mode.live {
  color: #7cf2be;
  background: rgba(56, 217, 154, 0.1);
  box-shadow: inset 0 0 0 1px rgba(56, 217, 154, 0.3);
}
.mode.demo {
  color: #ffd27a;
  background: rgba(255, 196, 77, 0.1);
  box-shadow: inset 0 0 0 1px rgba(255, 196, 77, 0.28);
}
.icon-btn {
  background: rgba(255, 255, 255, 0.04);
  border-color: var(--line2);
  color: var(--soft);
}
.icon-btn:hover {
  color: #fff;
  border-color: var(--neo);
  box-shadow: 0 0 14px rgba(76, 141, 255, 0.3);
}

/* Tarjetas de vidrio con borde luminoso */
.card {
  background: linear-gradient(180deg, rgba(20, 36, 72, 0.7), rgba(10, 20, 44, 0.78));
  border: 1px solid var(--line);
  box-shadow:
    var(--shadow),
    inset 0 1px 0 rgba(255, 255, 255, 0.05);
  backdrop-filter: blur(12px);
  -webkit-backdrop-filter: blur(12px);
  position: relative;
}
.card::after {
  content: "";
  position: absolute;
  inset: 0;
  border-radius: inherit;
  pointer-events: none;
  padding: 1px;
  background: linear-gradient(
    135deg,
    rgba(76, 141, 255, 0.45),
    transparent 35%,
    transparent 70%,
    rgba(57, 194, 255, 0.25)
  );
  -webkit-mask:
    linear-gradient(#000 0 0) content-box,
    linear-gradient(#000 0 0);
  -webkit-mask-composite: xor;
  mask-composite: exclude;
  opacity: 0.55;
}
.card .sub {
  color: var(--soft);
}
.kpi::before {
  background: linear-gradient(180deg, var(--neo2), var(--neo));
  box-shadow: 0 0 12px rgba(57, 194, 255, 0.6);
}
.kpi b {
  color: #f2f6ff;
  text-shadow: 0 0 18px rgba(76, 141, 255, 0.35);
}
.kpi small {
  color: var(--soft);
  text-transform: uppercase;
  letter-spacing: 0.06em;
  font-size: 0.66rem;
}
.kpi.r::before {
  background: var(--red);
  box-shadow: 0 0 12px rgba(255, 92, 112, 0.7);
}
.kpi.r b {
  color: #ff8a99;
  text-shadow: 0 0 18px rgba(255, 92, 112, 0.35);
}
.kpi.y::before {
  background: var(--yel);
  box-shadow: 0 0 12px rgba(255, 196, 77, 0.6);
}
.kpi.y b {
  color: #ffd27a;
  text-shadow: 0 0 18px rgba(255, 196, 77, 0.3);
}
.kpi.g::before {
  background: var(--glow);
  box-shadow: 0 0 12px rgba(56, 217, 154, 0.6);
}
.kpi.g b {
  color: #6ef0b8;
  text-shadow: 0 0 18px rgba(56, 217, 154, 0.3);
}

/* Píldoras y semáforo */
.pill.rojo {
  background: rgba(255, 92, 112, 0.14);
  color: #ff8a99;
  box-shadow: inset 0 0 0 1px rgba(255, 92, 112, 0.3);
}
.pill.amarillo {
  background: rgba(255, 196, 77, 0.12);
  color: #ffd27a;
  box-shadow: inset 0 0 0 1px rgba(255, 196, 77, 0.28);
}
.pill.verde {
  background: rgba(56, 217, 154, 0.12);
  color: #6ef0b8;
  box-shadow: inset 0 0 0 1px rgba(56, 217, 154, 0.28);
}
.pill.neutral {
  background: rgba(148, 170, 210, 0.1);
  color: var(--soft);
}
.bar,
.stack {
  background: rgba(148, 170, 210, 0.12);
}
.bar .rojo,
.stack .sin {
  background: #ff5c70;
  box-shadow: 0 0 8px rgba(255, 92, 112, 0.5);
}
.bar .amarillo,
.stack .tar {
  background: #ffc44d;
}
.bar .verde,
.stack .ok {
  background: #38d99a;
}

/* Botones */
.btn {
  background: rgba(255, 255, 255, 0.04);
  border-color: var(--line2);
  color: #dce6f7;
}
.btn:hover {
  border-color: var(--neo);
  color: #fff;
  box-shadow: 0 0 18px rgba(76, 141, 255, 0.25);
}
.btn.primary {
  background: linear-gradient(135deg, #2f66c9, #3a9bff);
  color: #fff;
  box-shadow:
    0 8px 24px rgba(58, 155, 255, 0.35),
    inset 0 1px 0 rgba(255, 255, 255, 0.2);
}
.btn.primary:hover {
  background: linear-gradient(135deg, #3a74db, #52aaff);
  box-shadow: 0 10px 30px rgba(58, 155, 255, 0.5);
}
.btn.danger {
  background: linear-gradient(135deg, #d21f3c, #ff5c70);
  box-shadow:
    0 8px 24px rgba(255, 92, 112, 0.35),
    inset 0 1px 0 rgba(255, 255, 255, 0.2);
}
.btn.danger:hover {
  background: linear-gradient(135deg, #e0354f, #ff7385);
  box-shadow: 0 10px 30px rgba(255, 92, 112, 0.5);
}

/* Campos */
select,
input,
textarea {
  background-color: rgba(6, 14, 32, 0.75);
  border-color: var(--line2);
  color: var(--ink);
}
input:focus,
select:focus,
textarea:focus {
  border-color: var(--neo);
  box-shadow:
    0 0 0 3px rgba(76, 141, 255, 0.22),
    0 0 18px rgba(76, 141, 255, 0.2);
}
input::placeholder,
textarea::placeholder {
  color: #6f82a6;
}
select option {
  background: #0b1630;
  color: var(--ink);
}
.topbar select {
  background-color: rgba(255, 255, 255, 0.05);
}

/* Tablas */
.tbl-wrap {
  background: rgba(10, 20, 44, 0.6);
  border-color: var(--line);
  backdrop-filter: blur(10px);
}
.tbl th {
  background: rgba(76, 141, 255, 0.06);
  color: #8fa6cf;
  text-transform: uppercase;
  letter-spacing: 0.06em;
  font-size: 0.66rem;
  border-bottom-color: var(--line);
}
.tbl td {
  border-bottom-color: var(--line);
  color: var(--ink);
}
.tbl tbody tr.click:hover {
  background: rgba(76, 141, 255, 0.08);
  box-shadow: inset 3px 0 0 var(--neo);
}
.tbl .asunto {
  color: var(--soft);
}

/* Controles segmentados, listas, avisos */
.seg {
  background: rgba(255, 255, 255, 0.04);
  box-shadow: inset 0 0 0 1px var(--line);
}
.seg button {
  color: var(--soft);
}
.seg button.on {
  background: linear-gradient(135deg, rgba(76, 141, 255, 0.35), rgba(57, 194, 255, 0.18));
  color: #fff;
  box-shadow:
    inset 0 0 0 1px rgba(76, 141, 255, 0.45),
    0 0 14px rgba(76, 141, 255, 0.2);
}
.list-row {
  border-bottom-color: var(--line);
}
dl.kv div {
  border-bottom-color: var(--line);
}
.empty {
  color: var(--soft);
}
.empty i {
  color: #3e5582;
}
.banner {
  background: rgba(255, 196, 77, 0.07);
  border-color: rgba(255, 196, 77, 0.25);
  color: #ffd27a;
}
.alert-card {
  background: rgba(255, 92, 112, 0.06);
  border-color: rgba(255, 92, 112, 0.28);
}
.alert-card.venc {
  box-shadow:
    0 0 0 1px rgba(255, 92, 112, 0.4),
    0 0 24px rgba(255, 92, 112, 0.15);
}
.top-card {
  background: linear-gradient(180deg, rgba(255, 92, 112, 0.12), rgba(255, 92, 112, 0.03));
  border-color: rgba(255, 92, 112, 0.3);
}
.top-card .n {
  color: #ff8a99;
  text-shadow: 0 0 18px rgba(255, 92, 112, 0.4);
}
.warn-card {
  background: rgba(255, 196, 77, 0.06);
  border-color: rgba(255, 196, 77, 0.25);
}
.warn-card h3 {
  color: #ffd27a;
}
.dir-org {
  color: #f2f6ff;
}
.legend {
  color: var(--soft);
}

/* Ventanas y avisos */
.overlay {
  background: rgba(2, 6, 16, 0.7);
  backdrop-filter: blur(6px);
}
.modal {
  background: linear-gradient(180deg, #0e1c3c, #081227);
  border: 1px solid var(--line2);
  box-shadow:
    0 30px 80px rgba(0, 0, 0, 0.6),
    0 0 40px rgba(76, 141, 255, 0.12);
}
.modal header {
  background: linear-gradient(90deg, rgba(76, 141, 255, 0.22), rgba(57, 194, 255, 0.05));
  border-bottom: 1px solid rgba(76, 141, 255, 0.3);
}
.modal footer {
  background: rgba(8, 18, 39, 0.95);
  border-top-color: var(--line);
}
.toast {
  background: rgba(11, 22, 48, 0.92);
  border: 1px solid rgba(76, 141, 255, 0.35);
  backdrop-filter: blur(10px);
  box-shadow:
    0 12px 30px rgba(0, 0, 0, 0.5),
    0 0 20px rgba(76, 141, 255, 0.2);
}
.toast.err {
  background: rgba(60, 10, 22, 0.92);
  border-color: rgba(255, 92, 112, 0.45);
}

/* Centro de mando: trío y lectura */
.trio {
  background: linear-gradient(180deg, rgba(20, 36, 72, 0.7), rgba(10, 20, 44, 0.78));
  border-color: var(--line);
  backdrop-filter: blur(12px);
}
.trio button {
  border-left-color: var(--line);
}
.trio button:hover {
  background: rgba(76, 141, 255, 0.07);
}
.trio small {
  color: var(--soft);
}
.t-r {
  color: #ff8a99 !important;
  text-shadow: 0 0 16px rgba(255, 92, 112, 0.35);
}
.t-y {
  color: #ffd27a !important;
  text-shadow: 0 0 16px rgba(255, 196, 77, 0.3);
}
.t-b {
  color: #8fb6ff !important;
  text-shadow: 0 0 16px rgba(76, 141, 255, 0.35);
}
.brief-h {
  color: #8fb6ff;
  text-transform: uppercase;
  letter-spacing: 0.1em;
  font-size: 0.68rem;
  position: relative;
  overflow: hidden;
}
.brief-h::after {
  content: "";
  position: absolute;
  inset: 0;
  background: linear-gradient(90deg, transparent, rgba(57, 194, 255, 0.35), transparent);
  transform: translateX(-100%);
  animation: scan 3.2s ease-in-out infinite;
}
@keyframes scan {
  to {
    transform: translateX(100%);
  }
}
.brief mark {
  color: #8fb6ff;
}
.brief mark.r {
  color: #ff8a99;
}
.cmd {
  border: 1px solid rgba(76, 141, 255, 0.22);
  box-shadow:
    0 20px 60px rgba(0, 0, 0, 0.45),
    0 0 60px rgba(76, 141, 255, 0.1);
}
.big {
  background: linear-gradient(180deg, #ffffff 30%, #9cc0ff);
  -webkit-background-clip: text;
  background-clip: text;
  -webkit-text-fill-color: transparent;
  filter: drop-shadow(0 0 24px rgba(76, 141, 255, 0.35));
}
.big sup {
  -webkit-text-fill-color: #8fb6ff;
}

/* Ingreso */
.login {
  background: radial-gradient(900px 520px at 85% -10%, rgba(76, 141, 255, 0.3), transparent 60%),
    radial-gradient(700px 420px at 0% 110%, rgba(57, 194, 255, 0.16), transparent 60%), #040a19;
}
.login .card {
  background: linear-gradient(180deg, rgba(20, 36, 72, 0.82), rgba(8, 18, 40, 0.9));
  border-top: 3px solid var(--oro);
  box-shadow:
    0 30px 80px rgba(0, 0, 0, 0.6),
    0 0 60px rgba(76, 141, 255, 0.15);
}

/* Informe en papel: siempre claro */
.paper {
  color: #13203a;
  box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5);
}

/* Celular */
@media (max-width: 960px) {
  .topbar {
    background: rgba(4, 10, 25, 0.85);
  }
  .hud {
    display: none;
  }
  .tabbar {
    background: rgba(8, 16, 36, 0.82);
    border: 1px solid var(--line2);
    box-shadow:
      0 16px 40px rgba(0, 0, 0, 0.55),
      0 0 30px rgba(76, 141, 255, 0.12);
  }
  .tab.on {
    background: linear-gradient(135deg, rgba(76, 141, 255, 0.35), rgba(57, 194, 255, 0.15));
    box-shadow:
      inset 0 0 0 1px rgba(76, 141, 255, 0.45),
      0 0 16px rgba(76, 141, 255, 0.25);
    color: #fff;
  }
  .tab.on i {
    filter: drop-shadow(0 0 6px rgba(57, 194, 255, 0.9));
  }
}
@media (prefers-reduced-motion: reduce) {
  .brief-h::after {
    animation: none;
    display: none;
  }
}
@media print {
  body::before {
    display: none;
  }
  body {
    background: #fff !important;
    background-image: none !important;
  }
  .card::after {
    display: none;
  }
}

/* ===== src/css/13-tablero-solido.css ===== */
/**
 * src/css/13-tablero-solido.css
 * Versión 2.1: superficies sólidas (sin vidrio translúcido) y tablero de teclas del centro de mando.
 * Se carga al final y sobrescribe el tema "Sala de control" (archivo 11). El semáforo usa colores
 * sólidos con contraste verificado (WCAG AA) y cada estado va también escrito, no solo en color.
 */
:root {
  --bg: #071631;
  --bg2: #0a1f44;
  --panel: #0f2148;
  --panel2: #13285a;
  --line: #1d3466;
  --line2: #2a4580;
  --ink: #f2f5fb;
  --soft: #a9b8d6;
  --faint: #8797b8;
  /* Semáforo: tecla (fondo), borde de relieve y tinta sobre fondo oscuro */
  --sem-r: #c8283e;
  --sem-r-ed: #7e1424;
  --sem-r-ink: #ff6b7d;
  --sem-a: #f2a900;
  --sem-a-ed: #9a6a00;
  --sem-a-ink: #ffc23d;
  --sem-a-tx: #2b1f00;
  --sem-v: #178a47;
  --sem-v-ed: #0b5229;
  --sem-v-ink: #3dd27a;
  --sem-g: #22355e;
  --sem-g-ed: #121f3c;
  --sem-g-ink: #c9d4ea;
  /* El verde del tema anterior era menta (#38d99a) y se confundía con el azul: ahora es verde */
  --glow: #3dd27a;
  --gdim: rgba(31, 165, 87, 0.18);
  --red: #e8384f;
  --redbg: rgba(232, 56, 79, 0.16);
  --redink: #ff8a99;
  --yel: #f2a900;
  --yelbg: rgba(242, 169, 0, 0.16);
  --yelink: #ffc23d;
  --shadow: 0 6px 18px rgba(0, 0, 0, 0.35);
}

/* ---------- Sin vidrio: fondos opacos en toda la app ---------- */
*,
*::before,
*::after {
  -webkit-backdrop-filter: none !important;
  backdrop-filter: none !important;
}
html,
body {
  background: var(--bg);
}
body {
  background-image: none;
}
body::before {
  display: none;
}
.card,
.modal,
.sidebar,
.login .card {
  background: var(--panel);
}
.topbar {
  background: var(--bg) !important;
}

/* ---------- Centro de mando ---------- */
.cmd {
  background: var(--bg2);
  border: 1px solid var(--line);
  box-shadow: none;
  border-radius: 18px;
}
.cmd::before {
  content: "";
  position: absolute;
  inset: 0 0 auto 0;
  height: 5px;
  opacity: 1;
  -webkit-mask-image: none;
  mask-image: none;
  background: linear-gradient(
    90deg,
    #2f66c9 0 28.57%,
    #d21f3c 28.57% 42.86%,
    #ffffff 42.86% 57.14%,
    #d21f3c 57.14% 71.43%,
    #1fa557 71.43% 100%
  );
}
.cmd-line {
  margin-top: 6px;
}
.cmd-fig {
  display: block;
}
.cmd-head {
  margin: 14px 0 0;
  font:
    650 clamp(1.7rem, 4.2vw, 2.35rem) / 1.05 Archivo,
    Inter,
    sans-serif;
  font-stretch: 82%;
  letter-spacing: -0.01em;
  color: var(--ink);
}
.cmd-head span {
  color: var(--soft);
  font-weight: 500;
}
.cmd-fig p {
  margin: 8px 0 0;
  max-width: 62ch;
  font-size: 0.95rem;
  line-height: 1.5;
  color: #c9d4ea;
}
.cmd-fig p b {
  color: var(--ink);
  font-variant-numeric: tabular-nums;
}

/* Filtros por estado: compactos, el protagonista es el tablero */
.states {
  margin-top: 16px;
  gap: 8px;
}
.st {
  background: var(--panel);
  border: 1px solid var(--line);
  border-radius: 10px;
  box-shadow: none;
}
.st[data-s="rojo"] b {
  color: var(--sem-r-ink);
}
.st[data-s="amarillo"] b {
  color: var(--sem-a-ink);
}
.st[data-s="verde"] b {
  color: var(--sem-v-ink);
}
.st[data-s="gris"] b {
  color: var(--sem-g-ink);
}
.sw-r {
  background: var(--sem-r) !important;
  box-shadow: none !important;
}
.sw-y {
  background: var(--sem-a) !important;
  box-shadow: none !important;
}
.sw-g {
  background: var(--sem-v) !important;
  box-shadow: none !important;
}
.sw-n {
  background: #3a4e7a !important;
  box-shadow: none !important;
}
.st[aria-pressed="true"] {
  border-color: var(--ink);
}

/* ---------- Tablero de teclas ---------- */
.tm {
  grid-template-columns: repeat(auto-fill, minmax(124px, 1fr));
  gap: 9px;
  padding: 12px;
  border-radius: 14px;
  background: #061430;
  border: 1px solid var(--line);
}
.tile {
  --ed: var(--sem-g-ed);
  min-height: 84px;
  padding: 10px 11px 9px;
  border: 0 solid var(--ed);
  border-bottom-width: 5px;
  border-radius: 10px;
  background: var(--sem-g);
  color: var(--sem-g-ink);
  box-shadow: none;
  cursor: pointer;
  transition:
    transform 0.07s ease-out,
    border-bottom-width 0.07s ease-out,
    margin 0.07s ease-out,
    opacity 0.25s,
    filter 0.15s;
}
.tile::before,
.tile::after {
  display: none;
}
.tile b {
  color: inherit;
  font-size: 0.8rem;
  font-weight: 600;
  -webkit-line-clamp: 2;
}
.tile .num {
  font:
    700 1.3rem/1 Archivo,
    Inter,
    sans-serif;
  font-stretch: 80%;
  font-variant-numeric: tabular-nums;
  color: inherit;
  text-shadow: none;
  letter-spacing: 0;
}
.tile small {
  font-family: inherit;
  font-size: 0.68rem;
  font-weight: 500;
  color: inherit;
  opacity: 0.85;
}
.tile.rojo {
  --ed: var(--sem-r-ed);
  background: var(--sem-r);
  color: #ffffff;
  border-color: var(--ed);
  box-shadow: none;
}
.tile.amarillo {
  --ed: var(--sem-a-ed);
  background: var(--sem-a);
  color: var(--sem-a-tx);
  border-color: var(--ed);
}
.tile.verde {
  --ed: var(--sem-v-ed);
  background: var(--sem-v);
  color: #ffffff;
  border-color: var(--ed);
}
.tile.gris {
  --ed: var(--sem-g-ed);
  border-style: solid;
  border-width: 0 0 5px;
  border-color: var(--ed);
  background: var(--sem-g);
}
.tile.gris .num {
  color: var(--sem-g-ink);
}
.tile:hover {
  transform: none;
  box-shadow: none;
  filter: brightness(1.08);
  border-color: var(--ed);
}
/* La tecla se hunde al presionarla y se queda abajo mientras está seleccionada */
.tile:active,
.tile.on {
  transform: translateY(4px);
  border-bottom-width: 1px;
  margin-bottom: 4px;
}
.tile.on {
  outline: 2px solid var(--ink);
  outline-offset: 2px;
}
.tile:focus-visible {
  outline: 2px solid var(--sem-a-ink);
  outline-offset: 2px;
}
.tm.filtering .tile:not(.match) {
  opacity: 0.22;
  filter: saturate(0.3);
}

/* Detalle de la tecla presionada */
.tm-det {
  margin-top: 12px;
  padding: 14px 16px;
  border-radius: 12px;
  background: var(--panel);
  border: 1px solid var(--line2);
  border-left: 6px solid #3a4e7a;
  color: var(--ink);
  min-height: 64px;
}
.tm-det.vacio {
  display: flex;
  align-items: center;
  color: var(--soft);
  font-size: 0.9rem;
  border-left-color: var(--line2);
}
.tm-det.rojo {
  border-left-color: var(--sem-r);
}
.tm-det.amarillo {
  border-left-color: var(--sem-a);
}
.tm-det.verde {
  border-left-color: var(--sem-v);
}
.tmd-h {
  display: flex;
  justify-content: space-between;
  align-items: flex-start;
  gap: 12px;
  flex-wrap: wrap;
}
.tmd-h b {
  display: block;
  font:
    650 1.1rem/1.2 Archivo,
    Inter,
    sans-serif;
}
.tmd-e {
  display: block;
  margin-top: 3px;
  font-size: 0.86rem;
  color: var(--soft);
}
.tm-det.rojo .tmd-e {
  color: var(--sem-r-ink);
}
.tm-det.amarillo .tmd-e {
  color: var(--sem-a-ink);
}
.tm-det.verde .tmd-e {
  color: var(--sem-v-ink);
}
.tmd-n {
  margin: 10px 0 0;
  font-size: 0.86rem;
  color: var(--soft);
}
/* Barra con las tres zonas del semáforo pintadas de fondo */
.tmd-trk {
  position: relative;
  height: 10px;
  margin-top: 12px;
  border-radius: 5px;
  overflow: hidden;
  background: linear-gradient(90deg, #16384f 0 20%, #3a3622 20% 40%, #3b2236 40% 100%);
}
.tmd-trk i {
  position: absolute;
  inset: 0 auto 0 0;
  border-radius: 5px;
  background: #5e6e8c;
}
.tm-det.rojo .tmd-trk i {
  background: var(--sem-r);
}
.tm-det.amarillo .tmd-trk i {
  background: var(--sem-a);
}
.tm-det.verde .tmd-trk i {
  background: var(--sem-v);
}
.tmd-esc {
  display: flex;
  justify-content: space-between;
  gap: 8px;
  margin-top: 5px;
  font-size: 0.72rem;
  color: var(--faint);
}

/* Leyenda */
.cmd-legend {
  display: flex;
  flex-wrap: wrap;
  gap: 6px 16px;
  margin-top: 12px;
  font-size: 0.76rem;
  color: var(--soft);
}
.cmd-legend i {
  display: inline-block;
  width: 10px;
  height: 10px;
  border-radius: 2px;
  margin-right: 6px;
  vertical-align: -1px;
}
.cmd-legend-w {
  color: var(--faint);
}

/* Cifras rápidas y lectura del corte, también sólidas */
.trio button {
  background: var(--panel);
  border: 1px solid var(--line);
  box-shadow: none;
}
.trio .t-r {
  color: var(--sem-r-ink);
}
.trio .t-y {
  color: var(--sem-a-ink);
}
.pill.verde {
  background: var(--gdim);
  color: var(--sem-v-ink);
}
.bar .verde {
  background: var(--sem-v);
}
.kpi.g::before {
  background: var(--sem-v);
}
.kpi.g b {
  color: var(--sem-v-ink);
}

/* ---------- Celular ---------- */
@media (max-width: 520px) {
  .tm {
    grid-template-columns: repeat(3, minmax(0, 1fr));
    gap: 7px;
    padding: 9px;
  }
  .tile {
    min-height: 78px;
    padding: 8px 8px 7px;
  }
  .tile b {
    font-size: 0.72rem;
  }
  .tile .num {
    font-size: 1.1rem;
  }
  .tmd-h .btn {
    width: 100%;
    justify-content: center;
  }
}
@media (prefers-reduced-motion: reduce) {
  .tile {
    transition: none;
  }
}

/* Barra inferior del celular: opaca para que el contenido no se vea por detrás */
@media (max-width: 960px) {
  .topbar {
    background: #071631 !important;
  }
  .tabbar {
    background: #0b1d40 !important;
    border-color: var(--line2) !important;
  }
}
@media (max-width: 520px) {
  .tile .tl-f {
    flex-direction: column;
    align-items: flex-start;
    gap: 2px;
  }
}

/* Barra superior: el reloj y el indicador "En línea" nunca se encogen ni se cortan.
   Si falta espacio, se acorta el subtítulo de la pantalla con puntos suspensivos. */
.topbar .hud,
.topbar .mode,
.topbar select {
  flex: none;
}
.topbar .title {
  flex: 0 1 auto;
  min-width: 0;
  overflow: hidden;
}
.topbar .title h2,
.topbar .title small {
  display: block;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.topbar .mode {
  padding: 5px 12px;
}

/* ===== src/css/14-planes-de-mejoramiento.css ===== */
/**
 * src/css/14-planes-de-mejoramiento.css
 * Planes de mejoramiento: tarjetas de plan, hallazgos, acciones con semáforo sólido, indicadores e importación.
 * Los archivos se unen en orden numérico; un archivo posterior puede sobrescribir reglas de uno anterior.
 */
/* ---------- encabezado e indicadores ---------- */

}
.pm-ind {
  display: grid;

  gap: 14px 22px;
  align-items: end;
}
.pm-meter-h {
  display: flex;
  justify-content: space-between;
  align-items: baseline;

  font-weight: 600;
}
.pm-meter-h b {

  color: var(--ink);

}
.pm-meter .bar {

}

  font-size: 0.72rem;
  color: var(--faint);

}
.pm-fev {
  margin-bottom: 0;
}
.pm-filtros {

/* ---------- tarjetas de plan ---------- */
.pm-plans {

}
.pm-plan {

.pm-plan h3 {

.pm-plan-h {

.pm-ctl {

}
.pm-chips {

}
.pm-chip {

}
.pm-chip.r {

  border-color: var(--sem-r-ed, #7e1424);
  color: #fff;
}
.pm-chip.y {
  background: var(--sem-a, #f2a900);

}
.pm-chip.g {

}

.pm-g2 > * {

.pm-deprow {

  gap: 12px;
  align-items: center;
}
.pm-deprow-r {
  display: flex;
  flex-direction: column;
  align-items: flex-end;
  gap: 6px;
}

/* ---------- detalle del plan ---------- */
.pm-top {
  display: flex;
  gap: 8px;

  align-items: center;
  margin-bottom: 12px;
}
.pm-head {

.pm-head h2 {

/* ---------- hallazgos y acciones ---------- */

};

};

async function sha256Hex(input) {

/* ---------- Días hábiles en Colombia ----------
   Festivos según la Ley 51 de 1983 ("Ley Emiliani") y la Ley 2578 de 2026: fijos; trasladables al lunes siguiente;
   y los que dependen de la Pascua (Jueves y Viernes Santo, Ascensión, Corpus Christi y Sagrado Corazón). */
const FESTIVOS_CO = {};
function pascua(y) {
  const a = y % 19,
    b = Math.floor(y / 100),
    c = y % 100,
    d = Math.floor(b / 4),
    e = b % 4,
    f = Math.floor((b + 8) / 25),
    g = Math.floor((b - f + 1) / 3),
    h = (19 * a + b - d - g + 15) % 30,
    i = Math.floor(c / 4),
    k = c % 4,
    l = (32 + 2 * e + 2 * i - h - k) % 7,
    m = Math.floor((a + 11 * h + 22 * l) / 451),
    mes = Math.floor((h + l - 7 * m + 114) / 31),
    dia = ((h + l - 7 * m + 114) % 31) + 1;
  return new Date(y, mes - 1, dia);
}
function festivosCO(y) {
  if (FESTIVOS_CO[y]) return FESTIVOS_CO[y];
  const s = new Set();
  const lunes = d => {
    const w = d.getDay();
    if (w !== 1) d.setDate(d.getDate() + ((8 - w) % 7));
    return d;
  };
  [
    [1, 1],
    [5, 1],
    [7, 20],
    [8, 7],
    [12, 8],
    [12, 25]
  ].forEach(([m, d]) => s.add(iso(new Date(y, m - 1, d))));
  [
    [1, 6],
    [3, 19],
    [6, 29],
    [8, 15],
    [10, 12],
    [11, 1],
    [11, 11]
  ].forEach(([m, d]) => s.add(iso(lunes(new Date(y, m - 1, d)))));
  /* Ley 2578 de 2026: Día de Nuestra Señora del Rosario de Chiquinquirá (9 de julio), trasladable */
  if (y >= 2026) s.add(iso(lunes(new Date(y, 6, 9))));
  const p = pascua(y),
    mas = n => {
      const d = new Date(p);
      d.setDate(d.getDate() + n);
      return d;
    };
  s.add(iso(mas(-3)));
  s.add(iso(mas(-2)));
  [39, 60, 68].forEach(n => s.add(iso(lunes(mas(n)))));
  return (FESTIVOS_CO[y] = s);
}
function esHabil(d) {
  const w = d.getDay();
  return w !== 0 && w !== 6 && !festivosCO(d.getFullYear()).has(iso(d));
}
/* Fecha que resulta de sumar n días hábiles a una fecha (AAAA-MM-DD), sin contar el día inicial */
function sumarHabiles(desde, n) {
  const d = new Date(desde + 'T00:00:00');
  let k = 0;
  while (k < n) {
    d.setDate(d.getDate() + 1);
    if (esHabil(d)) k++;
  }
  return iso(d);
}

function diff(a, b) {
  const o = {};
  new Set([...Object.keys(a || {}), ...Object.keys(b || {})]).forEach(k => {
    if (JSON.stringify((a || {})[k]) !== JSON.stringify((b || {})[k]))
      o[k] = { de: (a || {})[k] === undefined ? null : a[k], a: (b || {})[k] === undefined ? null : b[k] };
  });
  return o;
}
async function demoAudit(tabla, accion, regId, payload, usuario, cambios) {
  const prev = DEMO.audit.length ? DEMO.audit[DEMO.audit.length - 1].hash : '0'.repeat(64);
  const ts = new Date().toISOString();
  const row = {
    id: DEMO.audit.length + 1,
    tabla,
    accion,
    registro_id: String(regId),
    usuario: usuario || 'demo@cali.gov.co',
    payload: JSON.parse(JSON.stringify(payload)),
    cambios: cambios || {},
    prev_hash: prev,
    created_at: ts
  };
  row.hash = await sha256Hex(
    [
      prev,
      tabla,
      accion,
      row.registro_id,
      row.usuario,
      ts,
      JSON.stringify(row.payload),
      JSON.stringify(row.cambios)
    ].join('|')
  );
  DEMO.audit.push(row);
}

      sb.from('config').select('*').eq('id', 1).maybeSingle()
    ]);

  },
  async reqs(vig) {
    if (S.demo) {
      let list = DEMO.reqs.filter(r => r.vigencia === vig);
      if (['secretario', 'enlace'].includes(rol()) && S.profile.dependencia_id)
        list = list.filter(r => r.dependencia_id === S.profile.dependencia_id);

    }
    let from = 0,
      out = [];
    for (;;) {
      const { data, error } = await sb
        .from('v_requerimientos')
        .select('*')
        .eq('vigencia', vig)
        .order('fecha_limite')
        .order('id')
        .range(from, from + 999);
      if (error) throw error;
      out = out.concat(data);
      if (data.length < 1000) break;
      from += 1000;
    }
    return out;
  },
  async createReq(o) {
    if (S.demo) {
      if (DEMO.reqs.some(r => r.radicado === o.radicado))
        throw new Error('El radicado ' + o.radicado + ' ya existe');
      const r = {
        ...o,
        id: 'd' + Date.now(),
        estado: 'abierto',
        orfeo_salida: null,
        fecha_cierre: null,
        soporte_path: null,
        soporte_hash: null,
        escalado_at: null
      };
      DEMO.reqs.push(r);
      await demoAudit('requerimientos', 'INSERT', r.id, r, S.user.email);
      return r;
    }
    const { data, error } = await sb.from('requerimientos').insert(o).select().single();
    if (error) throw dbErr(error);
    return data;
  },
  async closeReq(r, orfeo, fecha, file) {
    let path = null,
      hash = null;
    if (file) {
      hash = await sha256Hex(await file.arrayBuffer());
    }
    if (S.demo) {
      if (DEMO.reqs.some(x => x.orfeo_salida === orfeo))
        throw new Error('El radicado ORFEO ' + orfeo + ' ya fue registrado en otro requerimiento');
      const t = DEMO.reqs.find(x => x.id === r.id);
      const antes = { ...t };
      Object.assign(t, {
        estado: 'cerrado',
        orfeo_salida: orfeo,
        fecha_cierre: fecha,
        soporte_hash: hash,
        soporte_path: file ? file.name : null
      });
      await demoAudit('requerimientos', 'UPDATE', t.id, t, S.user.email, diff(antes, t));
      return { hash };
    }
    if (file) {
      // Los radicados del histórico traen espacios, barras y tildes: el nombre del archivo se limpia
      const seguro = String(r.radicado)
        .normalize('NFD')
        .replace(/[\u0300-\u036f]/g, '')
        .replace(/[^A-Za-z0-9._-]+/g, '_')
        .slice(0, 60);
      path = `${r.vigencia}/${seguro}_${Date.now()}.pdf`;
      const up = await sb.storage
        .from('soportes')
        .upload(path, file, { contentType: 'application/pdf', upsert: false });
      if (up.error) throw new Error('No se pudo subir el PDF: ' + up.error.message);
    }
    const { error } = await sb.rpc('cerrar_requerimiento', {
      p_id: r.id,
      p_orfeo: orfeo,
      p_fecha: fecha,
      p_path: path,
      p_hash: hash
    });
    if (error) {
      if (path) await sb.storage.from('soportes').remove([path]);
      throw dbErr(error);
    }
    return { hash };
  },
  async escalate(r, canal) {
    if (S.demo) {
      const t = DEMO.reqs.find(x => x.id === r.id);
      t.escalado_at = new Date().toISOString();
      DEMO.alertas.push({ requerimiento_id: r.id, canal });
      await demoAudit(
        'alertas_log',
        'INSERT',
        DEMO.alertas.length,
        { requerimiento_id: r.id, canal },
        S.user.email
      );
      return;
    }
    const { error } = await sb.rpc('escalar_requerimiento', { p_id: r.id, p_canal: canal });
    if (error) throw dbErr(error);

  async audit() {
    if (S.demo) return DEMO.audit.slice().reverse().slice(0, 300);
    const { data, error } = await sb
      .from('audit_log')
      .select('*')
      .order('id', { ascending: false })
      .limit(300);
    if (error) throw error;
    return data;
  },
  async verify() {
    if (S.demo) {
      let prev = '0'.repeat(64);
      for (let i = 0; i < DEMO.audit.length; i++) {
        const r = DEMO.audit[i];
        const calc = await sha256Hex(
          [
            prev,
            r.tabla,
            r.accion,
            r.registro_id,
            r.usuario,
            r.created_at,
            JSON.stringify(r.payload),
            JSON.stringify(r.cambios || {})
          ].join('|')
        );
        if (r.prev_hash !== prev || r.hash !== calc) return { ok: false, total: i + 1, primer_id_roto: r.id };
        prev = r.hash;
      }
      return { ok: true, total: DEMO.audit.length, primer_id_roto: null };
    }
    const { data, error } = await sb.rpc('verificar_cadena_auditoria');
    if (error) throw dbErr(error);
    return data[0];
  },
  /* Gestión de cuentas: en línea llama a la Edge Function gestion-cuentas (supabase/functions/);
     en demostración simula el mismo resultado sobre DEMO.profiles. Devuelve {ok, mensaje, id}. */
  async cuenta(accion, datos) {
    if (S.demo) {
      const P = DEMO.profiles,
        correo = String(datos.correo || '')
          .trim()
          .toLowerCase();
      let dep = null;
      if (datos.dependencia) {
        let d = DEMO.deps.find(x => orgKey(x.nombre) === orgKey(datos.dependencia));
        if (!d) {
          d = {
            id: Math.max(0, ...DEMO.deps.map(x => +x.id || 0)) + 1,
            nombre: datos.dependencia,
            secretario_nombre: '',
            correo: '',
            telefono: '',
            activo: true
          };
          DEMO.deps.push(d);
        }
        dep = d.id;
      }
      let r;
      if (accion === 'invitar') {
        let p = P.find(x => x.email === correo);
        if (!p) {
          p = { id: 'u' + (P.length + 1) + '_' + Date.now(), email: correo };
          P.push(p);
        }
        Object.assign(p, {
          nombre: datos.nombre,
          rol: datos.rol || 'secretario',
          dependencia_id: dep,
          activo: true
        });
        r = {
          ok: true,
          id: p.id,
          mensaje: `Invitación enviada a ${correo} (simulada en modo demostración).`
        };
      } else if (accion === 'cambiar_correo') {
        if (P.some(x => x.email === correo && x.id !== datos.id))
          throw new Error('Ese correo ya pertenece a otra cuenta.');
        const p = P.find(x => x.id === datos.id);
        if (!p) throw new Error('La cuenta no existe.');
        Object.assign(p, { email: correo, nombre: datos.nombre, activo: true });
        r = {
          ok: true,
          mensaje: `La cuenta ahora es de ${correo}. El titular anterior ya no puede ingresar (simulado).`
        };
      } else if (accion === 'enlace_clave')
        r = { ok: true, mensaje: `Enlace enviado a ${correo} (simulado).` };
      else if (accion === 'activar' || accion === 'desactivar') {
        const p = P.find(x => x.id === datos.id);
        if (p) p.activo = accion === 'activar';
        r = { ok: true, mensaje: accion === 'activar' ? 'Cuenta activada.' : 'Cuenta desactivada.' };
      } else throw new Error('Acción desconocida.');
      await demoAudit('cuentas_eventos', 'INSERT', accion, { accion, ...datos }, S.user.email);
      return r;
    }
    const { data, error } = await sb.functions.invoke('gestion-cuentas', { body: { accion, ...datos } });
    if (error) {
      let msg = error.message;
      try {
        const j = await error.context.json();
        if (j && j.error) msg = j.error;
      } catch (e) {}
      if (/Failed to send|not found|404/i.test(msg))
        msg =
          'La función gestion-cuentas no está desplegada en Supabase (ver docs/DESPLIEGUE.md, sección Cuentas).';
      throw new Error(msg);
    }
    if (data && data.error) throw new Error(data.error);
    return data;
  },
  async profiles() {
    if (S.demo) return DEMO.profiles.map(p => ({ ...p }));
    const { data, error } = await sb.from('profiles').select('*').order('email');
    if (error) throw error;
    return data;
  },
  async saveProfile(p) {
    if (S.demo) {
      const t = DEMO.profiles.find(x => x.id === p.id);
      const antes = { ...t };
      Object.assign(t, p);
      await demoAudit('profiles', 'UPDATE', p.id, t, S.user.email, diff(antes, t));
      return;
    }
    const { id, ...rest } = p;
    const { error } = await sb.from('profiles').update(rest).eq('id', id);
    if (error) throw dbErr(error);
  },
  async saveCatalog(table, o) {
    const list = table === 'entes' ? DEMO.entes : DEMO.deps;
    if (S.demo) {
      const isUpd = !!o.id;
      let antes = {};
      if (isUpd) {
        const t = list.find(x => x.id === o.id);
        antes = { ...t };
        Object.assign(t, o);
      } else {
        o.id = Math.max(0, ...list.map(x => x.id)) + 1;
        list.push({ activo: true, ...o });
      }
      await demoAudit(
        table,
        isUpd ? 'UPDATE' : 'INSERT',
        o.id,
        o,
        S.user.email,
        isUpd
          ? diff(
              antes,
              list.find(x => x.id === o.id)
            )
          : {}
      );
      return;
    }
    const q = o.id ? sb.from(table).update(o).eq('id', o.id) : sb.from(table).insert(o);
    const { error } = await q;
    if (error) throw dbErr(error);
  },
  async saveConfig(c) {
    if (S.demo) {
      Object.assign(DEMO.cfg, c);
      return;
    }
    const { error } = await sb.from('config').update(c).eq('id', 1);
    if (error) throw dbErr(error);
  },
  async signedUrl(path) {
    const { data, error } = await sb.storage.from('soportes').createSignedUrl(path, 300);
    if (error) throw error;
    return data.signedUrl;
  }
};
function dbErr(e) {
  const m = e && e.message ? e.message : String(e);
  if (/duplicate key.*radicado/i.test(m)) return new Error('Ese radicado ya existe en el sistema');
  if (/duplicate key.*orfeo/i.test(m))
    return new Error('Ese radicado ORFEO ya fue registrado en otro requerimiento');
  if (/row-level security/i.test(m)) return new Error('Tu rol no tiene permiso para esta operación');
  if (/duplicate key/i.test(m)) return new Error('Ya existe un registro con esos datos');
  return new Error(m);
}

/**
 * src/js/05-reglas-de-negocio.js
 * Reglas del módulo operativo: semáforo de cada requerimiento vivo (decorate) y recarga de datos (reload).
 * Depende de: 04 (db), 03 (S).
 *
 * Este archivo es una sección de la aplicación: scripts/build.mjs une src/js/01 a 21, en orden,
 * dentro de un único ámbito compartido. Las funciones declaradas aquí se pueden usar desde cualquier
 * archivo; las constantes, una vez se haya ejecutado el archivo que las declara. Ver docs/GUIA_DESARROLLO.md.
 */
/* =====================================================================
   Lógica de negocio
   ===================================================================== */
function decorate(r) {
  r.dias = daysUntil(r.fecha_limite);
  r.sem = r.estado === 'cerrado' ? 'verde' : r.dias <= (S.cfg.dias_rojo || 5) ? 'rojo' : 'amarillo';
  r.venc = r.estado === 'abierto' && r.dias < 0;
  r.ente_n = (S.entes.find(e => e.id === r.ente_id) || {}).nombre || r.ente || '—';
  r.ente_s = (S.entes.find(e => e.id === r.ente_id) || {}).sigla || r.ente_sigla || '';
  r.dep_n = (S.deps.find(d => d.id === r.dependencia_id) || {}).nombre || r.dependencia || '—';
  return r;
}
const counts = list =>
  list.reduce(
    (a, r) => {
      a.total++;
      a[r.sem]++;
      return a;
    },
    { total: 0, rojo: 0, amarillo: 0, verde: 0 }
  );
const pill = sem => `<span class="pill ${sem}"><i></i>${SEM[sem].toUpperCase()}</span>`;
const opts = (arr, sel, all) =>
  (all ? `<option value="">${all}</option>` : '') +
  arr
    .map(
      x =>
        `<option value="${esc(x.id)}"${String(x.id) === String(sel) ? ' selected' : ''}>${esc(x.nombre)}</option>`
    )
    .join('');

async function reload() {
  try {
    S.reqs = (await db.reqs(S.vigencia)).map(decorate);
  } catch (e) {
    toast(e.message || 'No se pudieron cargar los datos', 'err');
    S.reqs = [];
  }
  renderNav();
}

function toast(msg, type) {
  const t = document.createElement('div');
  t.className = 'toast' + (type === 'err' ? ' err' : '');
  t.innerHTML = `<i class="fa-solid ${type === 'err' ? 'fa-circle-exclamation' : 'fa-circle-check'}"></i><span>${esc(msg)}</span>`;
  $('#toasts').appendChild(t);
  setTimeout(() => t.remove(), type === 'err' ? 6000 : 3800);
}
function openModal({ title, body, footer, wide, fija }) {
  closeModal();
  const el = document.createElement('div');
  el.className = 'overlay';
  el.id = 'modalOv';
  el.innerHTML = `<div class="modal" role="dialog" aria-modal="true" ${wide ? 'style="width:min(720px,100%)"' : ''}><header><h3>${esc(title)}</h3>${fija ? '' : '<button class="icon-btn" data-act="closeModal" aria-label="Cerrar"><i class="fa-solid fa-xmark"></i></button>'}</header><div class="body">${body}</div>${footer ? `<footer>${footer}</footer>` : ''}</div>`;
  /* Una ventana fija (verificación obligatoria) no se cierra con clic afuera ni con Escape */

  el.addEventListener('mousedown', e => {
    if (e.target === el && !fija) closeModal();

function hudTick() {
  const el = document.getElementById('hudClock');
  if (!el) return;
  const d = new Date();
  el.textContent =
    d.toLocaleDateString('es-CO', { weekday: 'short', day: '2-digit', month: 'short' }).replace('.', '') +
    ' · ' +
    d.toLocaleTimeString('es-CO', { hour: '2-digit', minute: '2-digit', second: '2-digit', hour12: false });
}
if (!window.__hud) {
  window.__hud = setInterval(hudTick, 1000);
}
function countUp(root) {
  if (matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  (root || document).querySelectorAll('.kpi b, .trio b, .st b, .top-card .n').forEach(el => {
    const t = el.firstChild && el.firstChild.nodeType === 3 ? el.firstChild : null;
    if (!t) return;
    const raw = t.textContent.trim();
    if (!/^\d{1,3}(\.\d{3})*$/.test(raw)) return;
    const end = +raw.replace(/\./g, '');
    if (end < 2) return;
    const t0 = performance.now(),
      dur = 900;
    const f = x => Math.round(x).toLocaleString('es-CO');
    const step = n => {
      const k = Math.min(1, (n - t0) / dur),
        e = 1 - Math.pow(1 - k, 3);
      t.textContent = f(end * e);
      if (k < 1) requestAnimationFrame(step);
      else t.textContent = raw;
    };
    requestAnimationFrame(step);
  });
}

/**
