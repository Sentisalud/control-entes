/* =====================================================================
   VISTAS
   ===================================================================== */
function vTablero(c) {
  const k = counts(S.reqs),
    pct = k.total ? Math.round((k.verde * 100) / k.total) : 0;
  const byEnte = {};
  S.reqs.forEach(r => {
    (byEnte[r.ente_n] = byEnte[r.ente_n] || []).push(r);
  });
  const enteRows =
    Object.entries(byEnte)
      .sort((a, b) => b[1].length - a[1].length)
      .map(([n, l]) => {
        const q = counts(l);
        return `<div class="list-row" style="display:block"><div style="display:flex;justify-content:space-between;gap:10px;margin-bottom:7px"><b class="ellipsis" style="font-size:.84rem">${esc(n)}</b><span class="mono muted" style="font-size:.74rem;white-space:nowrap">${q.total} · <span style="color:var(--redink)">${q.rojo}</span> / <span style="color:var(--yelink)">${q.amarillo}</span> / <span style="color:var(--glow)">${q.verde}</span></span></div>
      <div class="bar"><span class="rojo" style="width:${(q.rojo * 100) / q.total}%"></span><span class="amarillo" style="width:${(q.amarillo * 100) / q.total}%"></span><span class="verde" style="width:${(q.verde * 100) / q.total}%"></span></div></div>`;
      })
      .join('') ||
    '<div class="empty"><i class="fa-solid fa-inbox"></i>Sin requerimientos en esta vigencia</div>';
  const prox =
    S.reqs
      .filter(r => r.estado === 'abierto')
      .sort((a, b) => a.dias - b.dias)
      .slice(0, 6)
      .map(
        r => `
    <div class="list-row"><div class="grow"><b class="ellipsis">${esc(r.dep_n)}</b><small class="mono">${esc(r.radicado)} · ${esc(r.ente_s || r.ente_n)}</small></div>
    <div style="text-align:right">${pill(r.sem)}<div class="muted" style="font-size:.72rem;margin-top:4px">${diasTxt(r.dias)}</div></div></div>`
      )
      .join('') ||
    '<div class="empty"><i class="fa-solid fa-champagne-glasses"></i>No hay requerimientos abiertos</div>';
  const byDep = {};
  S.reqs
    .filter(r => r.estado === 'abierto')
    .forEach(r => {
      const o = (byDep[r.dep_n] = byDep[r.dep_n] || { n: 0, rojo: 0 });
      o.n++;
      if (r.sem === 'rojo') o.rojo++;
    });
  const depRows =
    Object.entries(byDep)
      .sort((a, b) => b[1].rojo - a[1].rojo || b[1].n - a[1].n)
      .slice(0, 6)
      .map(
        ([n, o]) => `
    <div class="list-row"><div class="grow"><b class="ellipsis">${esc(n)}</b><small>${o.n} abierto(s)</small></div>${o.rojo ? `<span class="pill rojo"><i></i>${o.rojo} CRÍTICO${o.rojo > 1 ? 'S' : ''}</span>` : '<span class="pill amarillo"><i></i>EN TÉRMINO</span>'}</div>`
      )
      .join('') || '<div class="empty"><i class="fa-solid fa-circle-check"></i>Sin pendientes</div>';
  c.innerHTML = `
    <div class="grid g-kpi" style="margin-bottom:14px">
      <div class="card kpi"><small>Total solicitudes</small><b>${nf(k.total)}</b></div>
      <div class="card kpi r"><small>Críticas</small><b>${nf(k.rojo)}</b></div>
      <div class="card kpi y"><small>En término</small><b>${nf(k.amarillo)}</b></div>
      <div class="card kpi g"><small>Cerradas</small><b>${nf(k.verde)}</b></div>
      <div class="card kpi g"><small>Cumplimiento</small><b>${pct}%</b></div>
    </div>
    <div class="grid g-2">
      <div class="card"><h3>Semáforo por ente de control</h3><div class="sub">Crítico / En término / Cerrado</div>${enteRows}</div>
      <div class="card"><h3>Próximos vencimientos</h3><div class="sub">Umbral crítico: ${S.cfg.dias_rojo} días o menos</div>${prox}</div>
      <div class="card"><h3>Dependencias con pendientes</h3><div class="sub">Ordenadas por criticidad</div>${depRows}</div>
    </div>`;
}

function renderReqRows() {
  const q = S.f.q.toLowerCase().trim();
  const list = S.reqs
    .filter(
      r =>
        (!S.f.sem || r.sem === S.f.sem) &&
        (!S.f.ente || String(r.ente_id) === S.f.ente) &&
        (!S.f.dep || String(r.dependencia_id) === S.f.dep) &&
        (!q ||
          [r.radicado, r.asunto, r.ente_n, r.dep_n, r.orfeo_salida].some(x =>
            String(x || '')
              .toLowerCase()
              .includes(q)
          ))
    )
    .sort(
      (a, b) =>
        ({ rojo: 0, amarillo: 1, verde: 2 })[a.sem] - { rojo: 0, amarillo: 1, verde: 2 }[b.sem] ||
        a.dias - b.dias
    );
  $('#reqBody').innerHTML = list.length
    ? list
        .map(
          r => `
    <tr class="click" data-act="detail" data-id="${esc(r.id)}">
      <td>${pill(r.sem)}</td><td class="mono">${esc(r.radicado)}</td>
      <td>${esc(r.ente_s || r.ente_n)}</td><td>${esc(r.dep_n)}</td><td class="asunto">${esc(r.asunto)}</td>
      <td style="white-space:nowrap">${fmtD(r.fecha_limite)}<div class="muted" style="font-size:.72rem">${r.estado === 'abierto' ? diasTxt(r.dias) : 'Cerrado ' + fmtD(r.fecha_cierre)}</div></td>
      <td class="right req-acc">${r.estado === 'abierto' && canClose() ? `<button class="btn sm" data-act="closeFor" data-id="${esc(r.id)}"><i class="fa-solid fa-check"></i> Cerrar</button>` : ''}</td>
    </tr>`
        )
        .join('')
    : `<tr><td colspan="7"><div class="empty"><i class="fa-solid fa-inbox"></i>Sin resultados</div></td></tr>`;
  $('#reqCount').textContent = `${list.length} de ${S.reqs.length} requerimientos · vigencia ${S.vigencia}`;
}

             ${r.estado === 'abierto' && canClose() ? `<button class="btn primary" data-act="closeFor" data-id="${esc(r.id)}"><i class="fa-solid fa-check"></i> Registrar respuesta</button>` : ''}

function newReqModal() {
  const y = S.vigencia,
    hoy = iso(new Date());
  openModal({
    title: 'Nuevo requerimiento',
    body: `
    <div class="field"><label>Radicado de entrada</label><input id="nrRad" class="mono" placeholder="${y}EE004812" maxlength="16" style="text-transform:uppercase"><div class="hint">Formato: año + 2 letras + consecutivo (ej. ${y}EE004812)</div></div>
    <div class="row2">
      <div class="field"><label>Ente de control</label><select id="nrEnte">${opts(S.entes.filter(e => e.activo !== false))}</select></div>
      <div class="field"><label>Dependencia responsable</label><select id="nrDep">${opts(
        S.deps.filter(d => d.activo !== false),
        S.profile.dependencia_id
      )}</select></div>
    </div>
    <div class="field"><label>Asunto</label><textarea id="nrAsu" placeholder="Describe el requerimiento…"></textarea></div>
    <div class="row2">
      <div class="field"><label>Fecha de radicación</label><input id="nrFr" type="date" value="${hoy}" max="${hoy}"></div>
      <div class="field"><label>Término para responder (días hábiles)</label><input id="nrTe" type="number" min="1" max="90" value="10" inputmode="numeric"></div>
    </div>
    <div class="field"><label>Fecha límite de respuesta</label><input id="nrFl" type="date" value="${sumarHabiles(hoy, 10)}"><div class="hint" id="nrFlH">Calculada sin sábados, domingos ni festivos de Colombia. Puede ajustarla si el oficio indica otra fecha.</div></div>
    <div id="nrErr" class="err hidden"></div>`,
    footer: `<button class="btn" data-act="closeModal">Cancelar</button><button class="btn primary" data-act="saveReq"><i class="fa-solid fa-floppy-disk"></i> Guardar</button>`
  }); /* La fecha límite se recalcula con el término en días hábiles, salvo que se haya escrito a mano */
  const calc = () => {
    const fr = $('#nrFr').value,
      n = parseInt($('#nrTe').value, 10);
    if (fr && n > 0) $('#nrFl').value = sumarHabiles(fr, n);
  };
  $('#nrFr').addEventListener('change', calc);
  $('#nrTe').addEventListener('input', calc);
}
async function saveReq() {
  const err = m => {
    const e = $('#nrErr');
    e.textContent = m;
    e.classList.remove('hidden');
  };
  const rad = $('#nrRad').value.trim().toUpperCase(),
    asu = $('#nrAsu').value.trim(),
    fr = $('#nrFr').value,
    fl = $('#nrFl').value;
  if (!/^[0-9]{4}[A-Z]{2}[0-9]{4,10}$/.test(rad))
    return err('Radicado inválido. Ejemplo: ' + S.vigencia + 'EE004812');
  if (asu.length < 4) return err('Escribe el asunto del requerimiento');
  if (!fr || !fl) return err('Completa las fechas');
  if (fl < fr) return err('La fecha límite no puede ser anterior a la radicación');
  if (S.reqs.some(r => r.radicado === rad)) return err('Ese radicado ya existe en esta vigencia');
  try {
    await db.createReq({
      radicado: rad,
      vigencia: parseD(fr).getFullYear(),
      ente_id: +$('#nrEnte').value,
      dependencia_id: +$('#nrDep').value,
      asunto: asu,
      fecha_radicacion: fr,
      fecha_limite: fl
    });
    closeModal();
    toast('Requerimiento ' + rad + ' registrado');
    await reload();
    render();
  } catch (e) {
    err(e.message);
  }
}

function vCarga(c) {
  const abiertos = S.reqs.filter(r => r.estado === 'abierto').sort((a, b) => a.dias - b.dias);
  if (!abiertos.length) {
    c.innerHTML =
      '<div class="card"><div class="empty"><i class="fa-solid fa-champagne-glasses"></i>No hay requerimientos abiertos en la vigencia ' +
      S.vigencia +
      '</div></div>';
    return;
  }
  const hoy = iso(new Date());
  c.innerHTML = `<div class="card" style="max-width:640px">
    <h3>Registrar respuesta ORFEO</h3><div class="sub">Vigencia <b class="mono" style="color:var(--glow)">${S.vigencia}</b> · el cierre queda firmado en la pista de auditoría</div>
    <form id="cargaForm" novalidate>
      <div class="field"><label>Buscar caso</label><input id="cBus" placeholder="Radicado, ente, dependencia o asunto" autocomplete="off"><div class="hint" id="cBusN">${abiertos.length} caso(s) abiertos en la vigencia ${S.vigencia}</div></div>
      <div class="field"><label>Requerimiento pendiente</label><select id="cSel">${abiertos.map(r => `<option value="${esc(r.id)}"${String(r.id) === String(S.preselect) ? ' selected' : ''}>${esc(r.radicado)} · ${esc(r.ente_s || r.ente_n)} · ${esc(r.dep_n)} (${r.sem === 'rojo' ? 'crítico' : 'en término'})</option>`).join('')}</select></div>
      <div class="field"><label>Radicado ORFEO de salida</label><input id="cOrfeo" class="mono" inputmode="numeric" placeholder="202641430100000171" maxlength="20"><div class="hint">Solo dígitos (10 a 20). Se valida contra duplicados.</div><div class="err hidden" id="cOrfeoErr"></div></div>
      <div class="row2">
        <div class="field"><label>Fecha de envío oficial</label><input id="cFecha" type="date" value="${hoy}" max="${hoy}"></div>
        <div class="field"><label>Soporte PDF</label><input id="cFile" type="file" accept="application/pdf,.pdf"><div class="hint">Máx. 10 MB · se calcula su huella SHA-256</div></div>
      </div>
      <div class="err hidden" id="cErr" style="margin-bottom:12px"></div>
      <button class="btn primary" id="cBtn" type="submit"><i class="fa-solid fa-check-circle"></i> Guardar y marcar en verde</button>
    </form></div>`;
  S.preselect = null;
  $('#cBus').addEventListener('input', e => {
    const q = nrmTxt(e.target.value).trim(),
      sel = $('#cSel');
    let n = 0,
      primero = null;
    [...sel.options].forEach(o => {
      const r = abiertos.find(x => String(x.id) === o.value),
        ok = !q || [r.radicado, r.ente_n, r.ente_s, r.dep_n, r.asunto].some(v => nrmTxt(v).includes(q));
      o.hidden = !ok;
      o.disabled = !ok;
      if (ok) {
        n++;
        if (!primero) primero = o;
      }
    });
    if (sel.selectedOptions[0] && sel.selectedOptions[0].disabled && primero) sel.value = primero.value;
    $('#cBusN').textContent = n + ' de ' + abiertos.length + ' caso(s)';
  });
  $('#cOrfeo').addEventListener('input', e => {
    e.target.value = e.target.value.replace(/\D/g, '');
    const v = e.target.value,
      er = $('#cOrfeoErr');
    let m = '';
    if (v && DEMO_or_loaded(v)) m = 'Este ORFEO ya está asociado a otro requerimiento';
    er.textContent = m;
    er.classList.toggle('hidden', !m);
  });
  $('#cargaForm').addEventListener('submit', async ev => {
    ev.preventDefault();
    const err = m => {
      const e = $('#cErr');
      e.textContent = m;
      e.classList.remove('hidden');
    };
    $('#cErr').classList.add('hidden');
    const r = S.reqs.find(x => String(x.id) === $('#cSel').value);
    const orfeo = $('#cOrfeo').value,
      fecha = $('#cFecha').value,
      file = $('#cFile').files[0];
    if (!/^[0-9]{10,20}$/.test(orfeo)) return err('El radicado ORFEO debe tener entre 10 y 20 dígitos');
    if (DEMO_or_loaded(orfeo)) return err('Este radicado ORFEO ya está asociado a otro requerimiento');
    if (!fecha) return err('Indica la fecha de envío');
    if (fecha > iso(new Date())) return err('La fecha de envío no puede ser futura');
    if (fecha < r.fecha_radicacion)
      return err(
        'La fecha de envío no puede ser anterior a la radicación (' + fmtD(r.fecha_radicacion) + ')'
      );
    if (!file) return err('Adjunta el soporte en PDF');
    if (file.type !== 'application/pdf' && !/\.pdf$/i.test(file.name))
      return err('El soporte debe ser un archivo PDF');
    if (file.size > 10 * 1024 * 1024) return err('El PDF supera los 10 MB');
    const head = new Uint8Array(await file.slice(0, 5).arrayBuffer());
    if (String.fromCharCode(...head) !== '%PDF-') return err('El archivo no parece ser un PDF válido');
    const btn = $('#cBtn');
    btn.disabled = true;
    btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> Guardando…';
    try {
      const res = await db.closeReq(r, orfeo, fecha, file);
      toast(`${r.radicado} cerrado · huella ${res.hash.slice(0, 10)}…`);
      // Si el caso viene del histórico, el cumplimiento se actualiza sin recargar la página
      if (r.hist_key) {
        const h = HIST.rows.find(x => rowKey(x) === r.hist_key);
        if (h) aplicarCierre(h, fecha, orfeo);
      }
      await reload();
      go('requerimientos');
    } catch (e) {
      err(e.message);
      btn.disabled = false;
      btn.innerHTML = '<i class="fa-solid fa-check-circle"></i> Guardar y marcar en verde';
    }
  });
}
const DEMO_or_loaded = v => S.reqs.some(r => r.orfeo_salida === v);

function waLink(r) {
  const msg =
    `Cordial saludo. Se informa que el requerimiento ${r.radicado} del ente ${r.ente_n}, a cargo de ${r.dep_n}, ` +
    (r.dias < 0
      ? `se encuentra vencido desde el ${fmtD(r.fecha_limite)}. `
      : `vence el ${fmtD(r.fecha_limite)} (${diasTxt(r.dias).toLowerCase()}). `) +
    `Asunto: ${r.asunto} Se solicita dar respuesta de manera prioritaria y registrar el radicado ORFEO de salida en el sistema Control de Entes.`;
  const _ct = contactsOf(r.dep_n)[0] || {},
    _tel = normPhone(_ct.telefono);
  return {
    msg,
    wa: 'https://wa.me/' + _tel + '?text=' + encodeURIComponent(msg),
    mail:
      'mailto:' +
      encodeURIComponent((S.deps.find(d => d.id === r.dependencia_id) || {}).correo || '') +
      '?subject=' +
      encodeURIComponent('Alerta de cumplimiento ' + r.radicado) +
      '&body=' +
      encodeURIComponent(msg)
  };
}
function vAlertas(c) {
  const rojos = S.reqs.filter(r => r.sem === 'rojo').sort((a, b) => a.dias - b.dias);

  if (!rojos.length) {
    c.innerHTML =
      '<div class="card"><div class="empty"><i class="fa-solid fa-champagne-glasses"></i>Sin alertas críticas en la vigencia ' +
      S.vigencia +
      '</div></div>';

  }
  const pend = rojos.filter(r => !r.escalado_at);
  c.innerHTML = `
    <div class="card" style="display:flex;gap:16px;align-items:center;flex-wrap:wrap;margin-bottom:14px">
      <div style="flex:1;min-width:240px"><h3>${rojos.length} requerimiento(s) crítico(s)${venc.length ? ` · <span style="color:var(--redink)">${venc.length} vencido(s)</span>` : ''}</h3>
      <div class="sub" style="margin:4px 0 0">Cada envío por WhatsApp o correo abre tu aplicación con el mensaje redactado; luego registra el escalamiento para dejar trazabilidad.</div></div>
      ${canEscalate() && pend.length ? `<button class="btn danger" data-act="escalateAll"><i class="fa-solid fa-paper-plane"></i> Registrar escalamiento de ${pend.length}</button>` : ''}
    </div>
    ${rojos
      .map(r => {
        const l = waLink(r);
        return `
      <div class="alert-card${r.venc ? ' venc' : ''}">
        <div style="display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:6px"><b>${esc(r.dep_n)}</b><span class="mono muted" style="font-size:.76rem">${esc(r.radicado)} · ${esc(r.ente_s || r.ente_n)}</span></div>
        <div class="muted" style="font-size:.84rem;margin-bottom:10px">${esc(r.asunto)}</div>
        <div style="display:flex;gap:8px;flex-wrap:wrap;align-items:center">
          <span class="pill rojo"><i></i>${r.venc ? 'VENCIDO' : 'CRÍTICO'}</span><span style="color:var(--redink);font-weight:600;font-size:.82rem">${diasTxt(r.dias)}</span>
          ${r.escalado_at ? `<span class="pill neutral">Escalado ${fmtTs(r.escalado_at)}</span>` : ''}
          <span class="spacer"></span>
          <a class="btn sm" href="${l.wa}" target="_blank" rel="noopener" data-act="log" data-id="${esc(r.id)}" data-canal="whatsapp"><i class="fa-brands fa-whatsapp"></i> WhatsApp</a>
          <a class="btn sm" href="${l.mail}" data-act="log" data-id="${esc(r.id)}" data-canal="correo"><i class="fa-regular fa-envelope"></i> Correo</a>
          ${r.venc && S.cfg.correo_disciplinario ? `<a class="btn sm" href="mailto:${esc(S.cfg.correo_disciplinario)}?subject=${encodeURIComponent('Requerimiento vencido ' + r.radicado)}&body=${encodeURIComponent(l.msg)}" data-act="log" data-id="${esc(r.id)}" data-canal="disciplinario"><i class="fa-solid fa-scale-balanced"></i> Control Disciplinario</a>` : ''}
          ${canEscalate() && !r.escalado_at ? `<button class="btn sm danger" data-act="escalate" data-id="${esc(r.id)}">Registrar</button>` : ''}
        </div>
      </div>`;
      })
      .join('')}`;
}

async function saveCat(table, id) {
  const o = id ? { id: isNaN(id) ? id : +id } : {};
  document.querySelectorAll('#modalRoot [data-f]').forEach(e => {
    o[e.dataset.f] = e.dataset.f === 'activo' ? e.value === 'true' : e.value.trim();
  });
  if (!o.nombre) {
    const e = $('#catErr');
    e.textContent = 'El nombre es obligatorio';
    e.classList.remove('hidden');
    return;
  }
  try {
    await db.saveCatalog(table, o);
    closeModal();
    toast('Guardado');
    await db.catalogs();
    await reload();
    render();
  } catch (e) {
    const x = $('#catErr');
    x.textContent = e.message;
    x.classList.remove('hidden');
  }
}

function exportCsv() {
  const head = [
    'Radicado',
    'Vigencia',
    'Ente',
    'Dependencia',
    'Asunto',
    'Radicación',
    'Límite',
    'Estado',
    'Semáforo',
    'ORFEO salida',
    'Fecha cierre',
    'SHA-256 soporte'
  ];
  const q = v => '"' + String(v == null ? '' : v).replace(/"/g, '""') + '"';
  const rows = S.reqs.map(r => [
    r.radicado,
    r.vigencia,
    r.ente_n,
    r.dep_n,
    r.asunto,
    r.fecha_radicacion,
    r.fecha_limite,
    r.estado,
    SEM[r.sem],
    r.orfeo_salida,
    r.fecha_cierre,
    r.soporte_hash
  ]);
  const csv = '\ufeff' + [head, ...rows].map(r => r.map(q).join(';')).join('\r\n');
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([csv], { type: 'text/csv;charset=utf-8' }));
  a.download = `control_entes_${S.vigencia}.csv`;
  document.body.appendChild(a);
  a.click();
  a.remove();
}

    msg = $('#chainMsg');

    card.classList.remove('chain-ok', 'chain-bad');

async function guardarTitular() {
  const org = $('#tiOrg').value,
    nombre = $('#tiNombre').value.trim().replace(/\s+/g, ' '),
    cargo = $('#tiCargo').value.trim();
  const correo = normMail($('#tiCorreo').value),
    telTxt = $('#tiTel').value.trim(),
    tel = normPhone(telTxt);
  const err = m => {
    const e = $('#tiErr');
    e.textContent = m;
    e.classList.remove('hidden');
  };
  if (!fullName(nombre)) return err('Escribe el nombre completo: nombres y apellidos.');
  if (!correo) return err('El correo debe ser institucional @cali.gov.co.');
  if (telTxt && !tel) return err('El celular debe tener 10 dígitos e iniciar en 3.');
  const otro = PERFILES.find(
    x => String(x.email).toLowerCase() === correo && x.id !== (cuentaDe(org) || {}).id
  );
  if (otro) return err('Ese correo ya pertenece a otra cuenta (' + otro.email + ').');
  const b = $('#modalRoot [data-act=ctaTitularGuardar]');
  if (b) {
    b.disabled = true;
    b.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> Guardando…';
  }
  try {
    let x = DIRLIST.find(d => orgKey(d.organismo) === orgKey(org));
    if (!x) {
      x = { organismo: org, cargo, nombre: '', telefono: '', correo: '' };
      DIRLIST.push(x);
    }
    Object.assign(x, { cargo: cargo || x.cargo, nombre, correo, telefono: tel || x.telefono || '' });
    await saveDirRow(x);
    const p = cuentaDe(org);
    const r = p
      ? await db.cuenta('cambiar_correo', { id: p.id, correo, nombre })
      : await db.cuenta('invitar', { correo, nombre, rol: 'secretario', dependencia: org });
    closeModal();
    toast(r.mensaje || 'Listo');
    await refrescarDeps();
    render();
  } catch (e) {
    if (b) {
      b.disabled = false;
      b.textContent = 'Reintentar';
    }
    err(e.message);
  }
}

  try {
    await db.catalogs();

/* ===== src/js/09-cumplimiento-e-historico.js ===== */
/**
 * src/js/09-cumplimiento-e-historico.js
 * Semáforo histórico (SEMP, semOf), ranking de cumplimiento por secretaría, histórico de radicados y detalle de un radicado.
 * Depende de: 10 (HIST, statsOf), 11 (temas y cruces en el detalle).
 *
 * Este archivo es una sección de la aplicación: scripts/build.mjs une src/js/01 a 21, en orden,
 * dentro de un único ámbito compartido. Las funciones declaradas aquí se pueden usar desde cualquier
 * archivo; las constantes, una vez se haya ejecutado el archivo que las declara. Ver docs/GUIA_DESARROLLO.md.
 */
/* =====================================================================
   HISTÓRICO Y CUMPLIMIENTO POR SECRETARÍA (datos de los Excel 2024-2026)
   ===================================================================== */
const SEMP = { verde_lt: 0.2, rojo_ge: 0.4, min: 10 }; // umbrales del semáforo (mismos del Excel)
const OPO_PILL = [
  ['verde', 'A TIEMPO'],
  ['amarillo', 'TARDÍA'],
  ['rojo', 'SIN RESPUESTA'],
  ['neutral', 'PENDIENTE'],
  ['neutral', 'SIN FECHA'],
  ['neutral', 'NO REQUIERE']
];
const C = { vig: 'todas', niv: 'principal', sort: 'inc' };
const Hs = { q: '', vig: 'todas', ente: '', org: '', opo: '', page: 0 };
const semOf = (ev, t) =>
  ev < SEMP.min ? 'muestra' : t >= SEMP.rojo_ge ? 'rojo' : t < SEMP.verde_lt ? 'verde' : 'amarillo';
const semPill = s =>
  s === 'muestra'
    ? '<span class="pill neutral">MUESTRA INSUFICIENTE</span>'
    : `<span class="pill ${s}"><i></i>${s.toUpperCase()}</span>`;
const pct1 = x => (x * 100).toFixed(1).replace('.', ',') + '%';

function aggOrgs(vig, niv) {
  const m = new Map();
  hrows().forEach(r => {
    if (vig !== 'todas' && r.v !== +vig) return;
    if (r.org === 'Sin dato' || r.org === 'Todos los organismos' || r.niv === 'Otro') return;
    if (niv === 'principal' && r.niv === 'Subunidad') return;
    if (niv === 'sub' && r.niv !== 'Subunidad') return;
    let o = m.get(r.org);
    if (!o) {
      o = {
        org: r.org,
        niv: r.niv,
        ok: 0,
        tar: 0,
        sin: 0,
        pend: 0,
        retSum: 0,
        y: { 2024: 0, 2025: 0, 2026: 0 }
      };
      m.set(r.org, o);
    }
    if (r.opo === 0) o.ok++;
    else if (r.opo === 1) {
      o.tar++;
      o.retSum += r.ret || 0;
      o.y[r.v]++;
    } else if (r.opo === 2) {
      o.sin++;
      o.y[r.v]++;
    } else if (r.opo === 3) o.pend++;
  });
  return [...m.values()]
    .map(o => {
      o.ev = o.ok + o.tar + o.sin;
      o.inc = o.tar + o.sin;
      o.tasa = o.ev ? o.inc / o.ev : 0;
      o.ret = o.tar ? o.retSum / o.tar : 0;
      o.sem = semOf(o.ev, o.tasa);
      return o;
    })
    .filter(o => o.ev > 0);
}
function sortOrgs(list) {
  if (C.sort === 'tasa')
    return list.sort(
      (a, b) => (a.sem === 'muestra') - (b.sem === 'muestra') || b.tasa - a.tasa || b.inc - a.inc
    );
  return list.sort((a, b) => b.inc - a.inc || b.tasa - a.tasa);
}

function vCumplimiento(c) {
  const list = sortOrgs(aggOrgs(C.vig, C.niv));
  const T = list.reduce(
    (a, o) => {
      a.ok += o.ok;
      a.tar += o.tar;
      a.sin += o.sin;
      a.pend += o.pend;
      return a;
    },
    { ok: 0, tar: 0, sin: 0, pend: 0 }
  );
  const ev = T.ok + T.tar + T.sin,
    inc = T.tar + T.sin,
    tasa = ev ? inc / ev : 0,
    gs = semOf(ev, tasa);
  const top = list.filter(o => o.sem === 'rojo').slice(0, 3);
  const yrs = ['todas', 2026, 2025, 2024];
  c.innerHTML = `
    <div class="toolbar">
      <select id="cVig">${yrs.map(y => `<option value="${y}"${String(y) === String(C.vig) ? ' selected' : ''}>${y === 'todas' ? 'Todas las vigencias' : 'Vigencia ' + y}</option>`).join('')}</select>
      <select id="cNiv"><option value="principal"${C.niv === 'principal' ? ' selected' : ''}>Secretarías, departamentos y UAE</option><option value="todos"${C.niv === 'todos' ? ' selected' : ''}>Todos los organismos</option></select>

 * Datos del histórico 2024-2026 (HIST), directorio del gabinete (DIRLIST), bitácora de notificaciones, alcance por dependencia (scopeOrg/hrows), estadísticas y enmascaramiento de datos personales (maskPII).

 * dentro de un único ámbito compartido. Las funciones declaradas aquí se pueden usar desde cualquier
 * archivo; las constantes, una vez se haya ejecutado el archivo que las declara. Ver docs/GUIA_DESARROLLO.md.
 */
/* =====================================================================
   DATOS HISTÓRICOS, DIRECTORIO Y ALCANCE POR DEPENDENCIA
   ===================================================================== */
const OPO_NAMES = [
  'A tiempo',
  'Tardía',
  'Sin respuesta (vencida)',
  'Pendiente en término',
  'Respondida (sin fecha para medir)',
  'No requiere respuesta'
];
const MAIN_NIV = ['Secretaría', 'Departamento', 'UAE', 'Despacho'];
const MESES = [
  'enero',
  'febrero',
  'marzo',
  'abril',
  'mayo',
  'junio',
  'julio',
  'agosto',
  'septiembre',
  'octubre',
  'noviembre',
  'diciembre'
];
let HIST = { corte: '', rows: [], entes: [], orgs: [], source: 'vacío', loaded: false };
let DIRLIST = []; // [{organismo,cargo,nombre,telefono}]
let NOTIF = []; // bitácora de notificaciones

function histFromPayload(j) {
  const rows = j.rows.map((a, i) => ({
    i,
    v: a[0],
    rad: a[1],
    ente: j.entes[a[2]] || '—',
    orfE: a[3],
    rec: a[4],
    org: j.orgs[a[5]][0],
    niv: j.orgs[a[5]][1],
    asu: a[6],
    term: a[7],
    fmax: a[8],
    orfR: a[9],
    fresp: a[10],
    resp: a[11],
    opo: a[12],
    ret: a[13],
    tiem: a[14]
  }));
  return {
    corte: j.corte,
    rows,
    entes: j.entes,
    orgs: j.orgs.map(o => o[0]),
    source: 'embebido',
    loaded: true
  };
}
function histFromDb(list) {
  const rows = list.map((r, i) => ({
    i,
    v: r.vigencia,
    rad: r.radicacion_ente,
    ente: r.ente || '—',
    orfE: r.orfeo_entrada,
    rec: r.fecha_recibo,
    org: r.organismo,
    niv: r.tipo_organismo || '',
    asu: r.asunto,
    term: r.termino_dias_habiles,
    fmax: r.fecha_maxima,
    orfR: r.orfeo_respuesta,
    fresp: r.fecha_respuesta,
    resp: r.respondio === 'Sí' ? 1 : r.respondio === 'No' ? 0 : 2,
    opo: Math.max(0, OPO_NAMES.indexOf(r.oportunidad)),
    ret: r.retraso_dias_habiles,
    tiem: r.dias_habiles_responder
  }));
  let corte = '';
  rows.forEach(r => {
    [r.fresp, r.rec].forEach(d => {
      if (d && d > corte) corte = d;
    });
  });
  return {
    corte: String(corte).slice(0, 10),
    rows,
    entes: [...new Set(rows.map(r => r.ente))].sort(),
    orgs: [...new Set(rows.map(r => r.org))],
    source: 'supabase',
    loaded: true
  };
}
async function loadHist() {
  if (HIST.loaded) return;
  const el = document.getElementById('histData');
  if (el && el.textContent.trim()) {
    try {
      HIST = histFromPayload(JSON.parse(el.textContent));
      return;
    } catch (e) {
      console.error('histData', e);
    }
  }
  if (!S.demo && sb) {
    try {
      let from = 0,
        out = [];
      for (;;) {
        const { data, error } = await sb
          .from('historico_requerimientos')
          .select('*')
          .order('id')
          .range(from, from + 999);
        if (error) throw error;
        out = out.concat(data);
        if (data.length < 1000) break;
        from += 1000;
      }
      HIST = histFromDb(out);
      await aplicarCierresApp();
      return;
    } catch (e) {
      console.error(e);
      toast('No se pudo cargar el histórico: ' + e.message, 'err');
    }
  }
  HIST.loaded = true;
}
/* Cierres hechos en la app sobre casos del histórico (supabase/12): el registro original no se
   modifica; al cargar, cada caso cerrado en "Cargar respuesta ORFEO" se muestra como respondido
   (a tiempo o tarde) y el cumplimiento se recalcula. Sobrevive a una recarga del histórico. */
function habilesEntre(a, b) {
  const d = new Date(a + 'T00:00:00'),
    f = new Date(b + 'T00:00:00');
  let n = 0;
  while (d < f) {
    d.setDate(d.getDate() + 1);
    if (esHabil(d)) n++; /* sin sábados, domingos ni festivos de Colombia */
  }
  return n;
}
function aplicarCierre(r, fecha, orfeo) {
  r.fresp = fecha;
  r.orfR = orfeo;
  r.resp = 1;
  r.cerradaApp = true;
  if (r.fmax) {
    r.opo = fecha <= r.fmax ? 0 : 1;
    r.ret = r.opo === 1 ? habilesEntre(r.fmax, fecha) : null;
  } else r.opo = 4;
  if (r.rec) r.tiem = habilesEntre(r.rec, fecha);
}
async function aplicarCierresApp() {
  if (S.demo || !sb || !HIST.rows.length) return;
  const { data, error } = await sb
    .from('requerimientos')
    .select('hist_key, orfeo_salida, fecha_cierre')
    .not('hist_key', 'is', null)
    .eq('estado', 'cerrado');
  if (error || !data || !data.length) return;
  const m = new Map(data.map(x => [x.hist_key, x]));
  HIST.rows.forEach(r => {
    const c = m.get(rowKey(r));
    if (c && (r.opo === 2 || r.opo === 3))
      aplicarCierre(r, String(c.fecha_cierre).slice(0, 10), c.orfeo_salida);
  });
}

function queueData() {
  const m = new Map();
  HIST.rows.forEach(r => {
    if (!MAIN_NIV.includes(r.niv) || !Q.vigs[r.v] || (r.opo !== 2 && r.opo !== 3)) return;
    let o = m.get(r.org);
    if (!o) {
      o = { org: r.org, venc: 0, pend: 0, maxRet: 0 };
      m.set(r.org, o);

    if (r.opo === 2) {
      o.venc++;
      o.maxRet = Math.max(o.maxRet, r.ret || 0);

 * src/js/14-notificaciones.js
 * Notificaciones por WhatsApp y correo institucional: plantillas de mensaje (buildMsg), envío individual, modo despacho y bitácora.
 * Depende de: 10 (DIRLIST, contactsOf, NOTIF), 01 (REMITENTE).
 *
 * Este archivo es una sección de la aplicación: scripts/build.mjs une src/js/01 a 21, en orden,
 * dentro de un único ámbito compartido. Las funciones declaradas aquí se pueden usar desde cualquier
 * archivo; las constantes, una vez se haya ejecutado el archivo que las declara. Ver docs/GUIA_DESARROLLO.md.
 */
/* =====================================================================
   NOTIFICACIONES POR WHATSAPP
   ===================================================================== */
const TPL = {
  vencidos: ['Requerimientos sin respuesta (vencidos)'],
  preventivo: ['Recordatorio preventivo (por vencer)'],
  desempeno: ['Resumen de desempeño'],
  reconocimiento: ['Reconocimiento por buen cumplimiento']
};
function buildMsg(org, tpl, vigs, ct) {
  const rows = HIST.rows.filter(r => r.org === org && vigs.includes(r.v)),
    st = statsOf(rows),
    per = vigs.slice().sort().join(', ');
  const hi = 'Cordial saludo' + (ct && ct.nombre ? ', ' + ct.nombre : '') + '.';
  const foot = '\n\nDespacho del Alcalde\nAlcaldía de Santiago de Cali';
  const corte = fmtD(HIST.corte);
  const limit = 1500;
  const pack = (head, items, fmt, tail) => {
    let lines = [],
      extra = 0;
    for (let i = 0; i < items.length; i++) {
      const l = fmt(items[i], lines.length + 1);
      const trial =
        head +
        lines.concat(l).join('\n') +
        (items.length > lines.length + 1 ? '\n(y ' + (items.length - lines.length - 1) + ' más)' : '') +
        tail +
        foot;
      if (trial.length > limit || lines.length >= 10) {
        extra = items.length - lines.length;
        break;
      }
      lines.push(l);
    }
    return (
      head +
      lines.join('\n') +
      (extra > 0 ? `\n... y ${extra} más (el detalle está disponible en el Centro de Mando).` : '') +
      tail +
      foot
    );
  };
  if (tpl === 'vencidos') {
    const it = rows.filter(r => r.opo === 2).sort((a, b) => (b.ret || 0) - (a.ret || 0));
    const head = `${hi}\n\nDesde el Despacho del Alcalde se informa que, según el Control de Requerimientos de Entes de Control (corte ${corte}; vigencia ${per}), ${org} registra ${it.length} requerimiento(s) sin respuesta registrada y con el término vencido:\n\n`;
    return pack(
      head,
      it,
      (r, n) =>
        `${n}. ${r.ente}, radicado ${r.rad || 'sin número'}. Venció el ${fmtD(r.fmax)}${r.ret != null ? ' (' + r.ret + ' días hábiles de retraso)' : ''}.`,
      '\n\nEl detalle de cada radicado puede consultarse en el Control de Requerimientos. Se solicita dar respuesta de manera prioritaria, radicarla en ORFEO y reportar el número de radicado de salida al Despacho. Si el requerimiento ya fue respondido, favor informar el número de ORFEO para actualizar el registro.'
    );
  }
  if (tpl === 'preventivo') {
    const it = rows.filter(r => r.opo === 3).sort((a, b) => String(a.fmax).localeCompare(String(b.fmax)));
    const head = `${hi}\n\nDesde el Despacho del Alcalde se recuerda que ${org} tiene ${it.length} requerimiento(s) de entes de control próximos a vencer:\n\n`;
    return pack(
      head,
      it,
      (r, n) => `${n}. ${r.ente}, radicado ${r.rad || 'sin número'}. Vence el ${fmtD(r.fmax)}.`,
      '\n\nSe agradece dar respuesta dentro del término y registrar el radicado ORFEO de salida.'
    );
  }
  if (tpl === 'reconocimiento') {
    return `${hi}\n\nDesde el Despacho del Alcalde se reconoce el compromiso de ${org} con la atención oportuna de los entes de control. En el periodo evaluado (vigencia ${per}; corte ${corte}) la dependencia respondió dentro del término ${st.ok} de ${st.ev} requerimientos (${st.ev ? Math.round((st.ok * 100) / st.ev) : 0}%).\n\nAgradecemos mantener este nivel de cumplimiento.${foot}`;
  }
  return `${hi}\n\nDesde el Despacho del Alcalde se comparte el resumen de cumplimiento de ${org} frente a los entes de control (vigencia ${per}; corte ${corte}):\n\n- Requerimientos evaluados: ${st.ev}\n- Respondidos dentro del término: ${st.ok}\n- Respondidos fuera del término: ${st.tar}${st.tar ? ' (retraso promedio de ' + st.ret.toFixed(1).replace('.', ',') + ' días hábiles)' : ''}\n- Sin respuesta registrada: ${st.sin}\n- Porcentaje de incumplimiento: ${pct1(st.tasa)}\n\nSe solicita revisar los pendientes y priorizar su respuesta.${foot}`;
}

/* ===== src/js/16-informe-ejecutivo.js ===== */
/**
 * src/js/16-informe-ejecutivo.js
 * Informe ejecutivo descargable en PDF: modelo de datos del informe, narrativa, gráficos SVG y registro con huella SHA-256.
 * Depende de: 09, 10, 02 (sha256Hex).
 *
 * Este archivo es una sección de la aplicación: scripts/build.mjs une src/js/01 a 21, en orden,
 * dentro de un único ámbito compartido. Las funciones declaradas aquí se pueden usar desde cualquier
 * archivo; las constantes, una vez se haya ejecutado el archivo que las declara. Ver docs/GUIA_DESARROLLO.md.
 */
/* =====================================================================
   INFORME EJECUTIVO (PDF descargable desde la aplicación)
   ===================================================================== */
const RP = { vig: 'todas', org: '', casos: true };
const PAL = {
  ok: '#4FB57C',
  tar: '#F2B230',
  sin: '#E0566B',
  ink: '#13203A',
  soft: '#55627A',
  line: '#DDE3EC',
  brand: '#0B3D91',
  blue: '#2F66C9'
};
const semBg = s => ({ rojo: '#f9d3d9', amarillo: '#fdecbd', verde: '#d3eedd', muestra: '#e6e9ec' })[s];
const semTxt = s => (s === 'muestra' ? 'MUESTRA INSUFICIENTE' : s.toUpperCase());
const cap = s => s.charAt(0).toUpperCase() + s.slice(1);

function reportModel() {
  const sc = scopeOrg(),
    org = sc || RP.org || '';
  const rows = hrows().filter(
    r => (RP.vig === 'todas' || r.v === +RP.vig) && MAIN_NIV.includes(r.niv) && (!org || r.org === org)
  );
  const st = statsOf(rows);
  const by = new Map();
  rows.forEach(r => {
    let a = by.get(r.org);
    if (!a) {
      a = [];
      by.set(r.org, a);
    }
    a.push(r);
  });
  const orgs = [...by.entries()]
    .map(([name, l]) => ({ name, ...statsOf(l) }))
    .filter(o => o.ev > 0)
    .sort((a, b) => b.inc - a.inc || b.tasa - a.tasa);
  const ente = {};
  rows
    .filter(r => r.opo === 1 || r.opo === 2)
    .forEach(r => {
      ente[r.ente] = (ente[r.ente] || 0) + 1;
    });
  const entes = Object.entries(ente)
    .sort((a, b) => b[1] - a[1])
    .slice(0, 8);
  const byM = {};
  rows.forEach(r => {
    if (!r.fmax || r.opo > 2) return;
    const k = r.fmax.slice(0, 7);
    const o = (byM[k] = byM[k] || { ev: 0, inc: 0 });
    o.ev++;
    if (r.opo > 0) o.inc++;
  });
  const pts = Object.keys(byM)
    .sort()
    .slice(-24)
    .map(k => {
      const o = byM[k],
        [y, m] = k.split('-');
      return {
        label: cap(MESES[+m - 1]) + ' ' + y,
        short: MESES[+m - 1].slice(0, 3) + ' ' + y.slice(2),
        ev: o.ev,
        inc: o.inc,
        v: o.ev >= 3 ? o.inc / o.ev : null
      };
    });
  const corte = HIST.corte,
    cd = new Date(corte + 'T00:00:00'),
    d1 = iso(new Date(cd.getTime() - 90 * 864e5)),
    d2 = iso(new Date(cd.getTime() - 180 * 864e5));
  const win = (a, b) => {
    let ok = 0,
      inc = 0;
    rows.forEach(r => {
      if (!r.fmax || r.opo > 2 || r.fmax <= a || r.fmax > b) return;
      if (r.opo === 0) ok++;
      else inc++;
    });
    return { ev: ok + inc, inc, t: ok + inc ? inc / (ok + inc) : null };
  };
  const q1 = win(d1, corte),
    q0 = win(d2, d1);
  const critical = rows
    .filter(r => r.opo === 2)
    .sort((a, b) => (b.ret || 0) - (a.ret || 0))
    .slice(0, 15);
  const semCount = { rojo: 0, amarillo: 0, verde: 0, muestra: 0 };
  orgs.forEach(o => semCount[o.sem]++);
  const nots = NOTIF.filter(n => !org || n.org === org).slice(0, 8);
  return {
    org,
    rows,
    st,
    orgs,
    entes,
    pts,
    q1,
    q0,
    critical,
    semCount,
    nots,
    pend: rows.filter(r => r.opo === 3).length,
    corte
  };
}
function narrative(m) {
  const s = m.st,
    out = [],
    per = RP.vig === 'todas' ? 'las vigencias 2024, 2025 y 2026' : 'la vigencia ' + RP.vig,
    who = m.org || 'las dependencias del Distrito';
  out.push(
    `En ${per} se evaluaron ${nf(s.ev)} requerimientos de entes de control atendidos por ${who}. De ellos, ${nf(s.ok)} (${pct1(s.ev ? s.ok / s.ev : 0)}) se respondieron dentro del término, ${nf(s.tar)} (${pct1(s.ev ? s.tar / s.ev : 0)}) fuera del término y ${nf(s.sin)} (${pct1(s.ev ? s.sin / s.ev : 0)}) permanecen sin respuesta registrada y con el término vencido. La tasa de incumplimiento es ${pct1(s.tasa)}, que corresponde a semáforo ${semTxt(s.sem).toLowerCase()}.`
  );
  if (!m.org && m.orgs.length) {
    const t3 = m.orgs
      .slice(0, 3)
      .map(o => `${o.name} (${o.inc} incumplimientos, ${pct1(o.tasa)})`)
      .join('; ');
    out.push(
      `Las dependencias con mayor número de incumplimientos son: ${t3}. Hay ${m.semCount.rojo} dependencia(s) en semáforo rojo, ${m.semCount.amarillo} en amarillo y ${m.semCount.verde} en verde.`
    );
  }
  if (m.q1.t != null && m.q0.t != null) {
    const d = (m.q1.t - m.q0.t) * 100,
      w = Math.abs(d).toFixed(1).replace('.', ',');
    out.push(
      `En los últimos tres meses la tasa de incumplimiento fue ${pct1(m.q1.t)} frente a ${pct1(m.q0.t)} del trimestre anterior: ${Math.abs(d) < 0.5 ? 'se mantiene estable' : d < 0 ? 'mejora en ' + w + ' puntos porcentuales' : 'empeora en ' + w + ' puntos porcentuales'}.`
    );
  }
  if (m.entes.length)
    out.push(
      `El ente de control con más requerimientos incumplidos es ${m.entes[0][0]} (${m.entes[0][1]} casos).`
    );
  if (s.sin || m.pend)
    out.push(
      `Hay ${nf(s.sin)} requerimiento(s) sin respuesta registrada y ${nf(m.pend)} por vencer. Se recomienda priorizar su atención y notificar a los responsables.`
    );
  return out;
}
/* ---- gráficos SVG (fondo claro, paleta pastel, Arial) ---- */
function chBarsStack(list) {
  if (!list.length) return '';
  const W = 700,
    LBL = 235,
    BAR = 330,
    RH = 26,
    H = list.length * RH + 8,
    mx = Math.max(...list.map(o => o.ev), 1);
  const rows = list
    .map((o, i) => {
      const y = 4 + i * RH,
        k = BAR / mx,
        a = o.ok * k,
        b = o.tar * k,
        c = o.sin * k;
      return `<g><text x="${LBL - 8}" y="${y + 16}" text-anchor="end" font-size="10.5" fill="${PAL.ink}">${esc(shortOrg(o.name).slice(0, 38))}</text>
    <rect x="${LBL}" y="${y + 4}" width="${a.toFixed(1)}" height="15" fill="${PAL.ok}"/><rect x="${(LBL + a).toFixed(1)}" y="${y + 4}" width="${b.toFixed(1)}" height="15" fill="${PAL.tar}"/><rect x="${(LBL + a + b).toFixed(1)}" y="${y + 4}" width="${c.toFixed(1)}" height="15" fill="${PAL.sin}"/>
    <circle cx="${LBL + BAR + 24}" cy="${y + 11.5}" r="5" fill="${semColor(o.sem)}" stroke="#9aa5ab" stroke-width=".6"/>
    <text x="${LBL + BAR + 36}" y="${y + 15}" font-size="10.5" fill="${PAL.ink}">${o.inc} · ${pct1(o.tasa)}</text></g>`;
    })
    .join('');
  return `<svg viewBox="0 0 ${W} ${H}" width="100%" style="font-family:Arial,Helvetica,sans-serif">${rows}</svg>`;
}
function chDonut(parts, center, sub) {
  const r = 54,
    C = 2 * Math.PI * r,
    tot = parts.reduce((s, p) => s + p.v, 0) || 1;
  let acc = 0;
  const arcs = parts
    .filter(p => p.v > 0)
    .map(p => {
      const len = (C * p.v) / tot,
        el = `<circle cx="70" cy="70" r="${r}" fill="none" stroke="${p.color}" stroke-width="20" stroke-dasharray="${len.toFixed(2)} ${(C - len).toFixed(2)}" stroke-dashoffset="${(-acc).toFixed(2)}" transform="rotate(-90 70 70)"/>`;
      acc += len;
      return el;
    })
    .join('');
  return `<svg viewBox="0 0 140 140" width="150" height="150" style="font-family:Arial,Helvetica,sans-serif"><circle cx="70" cy="70" r="${r}" fill="none" stroke="#eef2f4" stroke-width="20"/>${arcs}
    <text x="70" y="69" text-anchor="middle" font-size="22" font-weight="700" fill="${PAL.ink}">${center}</text><text x="70" y="85" text-anchor="middle" font-size="9" fill="${PAL.soft}">${sub}</text></svg>`;
}
function chTrend(pts) {
  const W = 700,
    H = 200,
    L = 36,
    R = 12,
    T = 14,
    B = 28,
    n = pts.length;
  if (n < 2) return '<div style="color:#5c6b73;padding:14px">Sin datos suficientes para la tendencia.</div>';
  const xs = i => L + ((W - L - R) * i) / (n - 1),
    ys = v => T + (H - T - B) * (1 - Math.min(1, v)),
    y20 = ys(SEMP.verde_lt),
    y40 = ys(SEMP.rojo_ge);
  const line = pts
    .map((p, i) => (p.v == null ? null : `${xs(i).toFixed(1)},${ys(p.v).toFixed(1)}`))
    .filter(Boolean)
    .join(' ');
  const dots = pts
    .map((p, i) =>
      p.v == null
        ? ''
        : `<circle cx="${xs(i).toFixed(1)}" cy="${ys(p.v).toFixed(1)}" r="4.2" fill="${semColor(semOf(Math.max(p.ev, SEMP.min), p.v))}" stroke="#fff" stroke-width="1.4"/>`
    )
    .join('');
  const step = Math.ceil(n / 9),
    xl = pts
      .map((p, i) =>
        i % step === 0
          ? `<text x="${xs(i).toFixed(1)}" y="${H - 9}" text-anchor="middle" font-size="9" fill="${PAL.soft}">${p.short}</text>`
          : ''
      )
      .join('');
  return `<svg viewBox="0 0 ${W} ${H}" width="100%" style="font-family:Arial,Helvetica,sans-serif"><rect x="${L}" y="${T}" width="${W - L - R}" height="${y40 - T}" fill="#fdeef0"/><rect x="${L}" y="${y20}" width="${W - L - R}" height="${H - B - y20}" fill="#eef8f1"/>
  <line x1="${L}" x2="${W - R}" y1="${y40}" y2="${y40}" stroke="#D21F3C" stroke-dasharray="4 4"/><line x1="${L}" x2="${W - R}" y1="${y20}" y2="${y20}" stroke="#138A44" stroke-dasharray="4 4"/>
  <text x="3" y="${y40 + 3}" font-size="9" fill="${PAL.soft}">40%</text><text x="3" y="${y20 + 3}" font-size="9" fill="${PAL.soft}">20%</text><text x="3" y="${ys(1) + 3}" font-size="9" fill="${PAL.soft}">100%</text><text x="3" y="${ys(0) + 3}" font-size="9" fill="${PAL.soft}">0%</text>
  <polyline points="${line}" fill="none" stroke="#0B3D91" stroke-width="2.2" stroke-linejoin="round"/>${dots}${xl}</svg>`;
}
function chBarsH(list) {
  if (!list.length) return '<div style="color:#5c6b73">Sin incumplimientos.</div>';

    )
    .join('');
}

let INFS = [];
async function logInforme() {
  const { m, huella } = RP._last || {};
  if (!m) return;
  const e = {
    ts: new Date().toISOString(),
    usuario: S.user.email,
    alcance: m.org || 'Todas las dependencias',
    vigencias: RP.vig === 'todas' ? '2024, 2025, 2026' : String(RP.vig),
    corte: HIST.corte,
    n: m.rows.length,
    huella
  };
  if (S.demo || !sb) {
    try {
      INFS = JSON.parse(lsGet('ce_inf') || '[]');
    } catch (x) {
      INFS = [];
    }
  }
  INFS.unshift(e);
  if (S.demo || !sb) {
    lsSet('ce_inf', JSON.stringify(INFS.slice(0, 100)));
    await demoAudit(
      'informes',
      'INSERT',
      INFS.length,
      { alcance: e.alcance, vigencias: e.vigencias, huella: e.huella },
      e.usuario
    );
    return;
  }
  const { error } = await sb.from('informes').insert({
    alcance: e.alcance,
    vigencias: e.vigencias,
    corte: e.corte || null,
    n_registros: e.n,
    huella: e.huella
  });
  if (error) toast('El informe se generó pero no se pudo registrar: ' + error.message, 'err');
}
async function rpPdf() {
  await logInforme();
  const t = document.title;
  document.title =
    'Informe_Ejecutivo_Cumplimiento_' +
    (HIST.corte || '') +
    (RP._last && RP._last.m.org ? '_' + shortOrg(RP._last.m.org).replace(/\W+/g, '_') : '');
  const back = () => {
    document.title = t;
    window.removeEventListener('afterprint', back);
  };
  window.addEventListener('afterprint', back);
  setTimeout(() => window.print(), 80);
  setTimeout(back, 60000);
}

  const p = ACT.profs.find(x => x.id === u || x.email === u);

function auditWhat(a) {
  const p = a.payload || {};
  const id =
    p.radicado ||
    p.email ||
    p.nombre ||
    (p.organismo ? p.organismo + (p.cargo ? ' - ' + p.cargo : '') : '') ||
    p.alcance ||
    p.canal ||
    a.registro_id;
  return `${TABLA_LBL[a.tabla] || a.tabla}: ${shortTxt(String(id), 70)}`;
}
function auditDetail(a) {
  const ch = a.cambios || {},
    keys = Object.keys(ch).filter(k => !['updated_at', 'updated_by', 'created_at'].includes(k));
  if (a.accion === 'UPDATE' && keys.length)
    return (
      keys
        .slice(0, 4)
        .map(k => {
          const v = x =>
            x == null || x === ''
              ? 'vacío'
              : k === 'telefono'
                ? fmtPhone(String(x))
                : shortTxt(String(x), 38);
          return `${FIELD_LBL[k] || k}: ${v(ch[k].de)} → ${v(ch[k].a)}`;
        })
        .join('; ') + (keys.length > 4 ? ' …' : '')
    );
  if (a.accion === 'INSERT')
    return a.tabla === 'notificaciones'
      ? `Mensaje a ${(a.payload || {}).destinatario || '—'}`
      : a.tabla === 'informes'
        ? `Huella ${String((a.payload || {}).huella || '').slice(0, 12)}…`
        : 'Registro nuevo';

async function loadActividad() {
  let audit = [],
    profs = [],
    acc = {};
  try {
    audit = await db.audit();
  } catch (e) {}
  try {
    profs = await db.profiles();
  } catch (e) {}
  if (S.demo || !sb) {
    try {
      acc = JSON.parse(lsGet('ce_acc') || '{}');
    } catch (e) {}
    try {
      INFS = JSON.parse(lsGet('ce_inf') || '[]');
    } catch (e) {}
  } else {
    const a = await sb
      .from('accesos')
      .select('user_id,created_at')
      .order('created_at', { ascending: false })
      .limit(1000);
    if (!a.error)
      (a.data || []).forEach(x => {
        if (!acc[x.user_id]) acc[x.user_id] = x.created_at;
      });
    const i = await sb.from('informes').select('*').order('created_at', { ascending: false }).limit(100);
    if (!i.error)
      INFS = (i.data || []).map(x => ({
        ts: x.created_at,
        usuario: x.generado_por,
        alcance: x.alcance,
        vigencias: x.vigencias,
        corte: x.corte,
        n: x.n_registros,
        huella: x.huella
      }));
  }
  ACT = { audit, profs, acc, loaded: true };

    </tbody></table></div>`;
  }
}

/**
 * src/js/18-acciones.js
 * Delegación de eventos: un único manejador de clics que despacha cada botón según su atributo data-act. Para agregar un botón nuevo, agrega su case aquí.
 * Depende de: Todas las vistas.
 *
 * Este archivo es una sección de la aplicación: scripts/build.mjs une src/js/01 a 21, en orden,
 * dentro de un único ámbito compartido. Las funciones declaradas aquí se pueden usar desde cualquier
 * archivo; las constantes, una vez se haya ejecutado el archivo que las declara. Ver docs/GUIA_DESARROLLO.md.
 */
/* =====================================================================
   Acciones (delegación de eventos)
   ===================================================================== */
document.addEventListener('click', async e => {
  const t = e.target.closest('[data-act]');
  if (!t) return;
  const a = t.dataset.act,
    id = t.dataset.id;
  /* Planes de mejoramiento: sus botones los atiende 19-planes-de-mejoramiento.js */
  if (a.startsWith('pm')) return pmAct(a, t);
  /* Carga del Excel de control: 20-carga-excel.js */
  if (a.startsWith('ce')) return ceAct(a, t);
  switch (a) {
    case 'go':
      go(t.dataset.view);
      break;
    case 'closeModal':
      closeModal();
      break;
    case 'detail':
      detailModal(id);
      break;
    case 'newReq':
      newReqModal();
      break;
    case 'saveReq':
      saveReq();
      break;
    case 'closeFor':
      e.stopPropagation();
      closeModal();
      S.preselect = id;
      go('carga');
      break;
    case 'openPdf':
      try {
        window.open(await db.signedUrl(t.dataset.path), '_blank', 'noopener');
      } catch (er) {
        toast(er.message, 'err');
      }
      break;
    case 'escalate':
      try {
        await db.escalate(
          S.reqs.find(r => String(r.id) === id),
          'registro'
        );
        toast('Escalamiento registrado');
        await reload();
        render();
      } catch (er) {
        toast(er.message, 'err');
      }
      break;
    case 'escalateAll': {
      const pend = S.reqs.filter(r => r.sem === 'rojo' && !r.escalado_at);
      let n = 0;
      for (const r of pend) {
        try {
          await db.escalate(r, 'registro');
          n++;
        } catch (er) {
          toast(er.message, 'err');
          break;
        }
      }
      if (n) toast(n + ' escalamiento(s) registrado(s)');
      await reload();
      render();
      break;
    }
    case 'log': {
      const r = S.reqs.find(x => String(x.id) === id);
      if (r && canEscalate())
        db.escalate(r, t.dataset.canal)
          .then(async () => {
            await reload();
            render();
          })
          .catch(() => {});
      break;
    }
    case 'editCat':
      catModal(t.dataset.table, id);
      break;
    case 'saveCat':
      saveCat(t.dataset.table, id);
      break;
    case 'csv':
      exportCsv();
      break;
    case 'print':
      window.print();
      break;
    case 'verify':
      verifyChain();
      break;
    case 'tamper':
      if (DEMO.audit.length > 1) {
        DEMO.audit[1].payload.asunto = 'ALTERADO';
        DEMO.audit[1].payload.manipulado = true;
        toast('Se alteró en memoria el evento #2. Verifica la integridad.');
      } else toast('Genera primero algún evento (cierra o crea un requerimiento)', 'err');
      break;
    case 'ctaTitular':
      titularModal(t.dataset.org);
      break;
    case 'ctaTitularGuardar':
      await guardarTitular();
      break;
    case 'ctaInvitar':
      invitarModal();
      break;
    case 'ctaInvitarGuardar':
      await guardarInvitacion();
      break;
    case 'tmVentana':
      TM.ventana = +t.dataset.n;
      lsSet('ce_ventana', String(TM.ventana));
      render();
      break;
    case 'miClave':
      await miCuentaModal();
      break;
    case 'miClaveCambiar':
      claveModal(false);
      break;
    case 'mfaActivar':
      await mfaInscribir(false);
      break;
    case 'mfaConfirmar':
      await mfaConfirmar(t);
      break;
    case 'mfaCancelar':
      await mfaCancelar();
      break;
    case 'mfaQuitar':
      await mfaQuitar(t.dataset.id);
      break;
    case 'mfaVerificar':
      await mfaVerificarCodigo(t);
      break;
    case 'mfaSalir':
      await mfaSalir();
      break;
    case 'saveResumen':
      await guardarResumen();
      break;
    case 'probarResumen':
      await probarResumen(t);
      break;
    case 'miClaveGuardar':
      await guardarClave();
      break;
    case 'ctaCrear': {
      const org = t.dataset.org,
        x = titularDe(org);
      if (!x || !normMail(x.correo) || !fullName(x.nombre)) {
        titularModal(org);
        break;
      }
      t.disabled = true;
      try {
        const r = await db.cuenta('invitar', {
          correo: normMail(x.correo),
          nombre: x.nombre,
          rol: 'secretario',
          dependencia: org
        });
        toast(r.mensaje);
        await refrescarDeps();
        render();
      } catch (e) {
        t.disabled = false;
        toast(e.message, 'err');
      }
      break;
    }
    case 'ctaCrearTodas': {
      const pend = mainOrgsAll().filter(o => estadoCuenta(o)[0] === 'sin');
      if (
        !pend.length ||
        !confirm(
          `Se enviará una invitación al correo institucional del titular de ${pend.length} dependencia(s). ¿Continuar?`
        )
      )
        break;
      t.disabled = true;
      let ok = 0;
      const fallas = [];
      for (const o of pend) {
        const x = titularDe(o);
        try {
          await db.cuenta('invitar', {
            correo: normMail(x.correo),
            nombre: x.nombre,

            dependencia: o

        fallas.length ? 'err' : undefined

      break;
    }
    case 'ctaEnlace':

        toast(e.message, 'err');

    case 'ctaActivar':

    case 'saveProfile': {

          'ORFEO entrada',

      const otroM = DIRLIST.find((y, k) => k !== i && mail && String(y.correo || '').toLowerCase() === mail);
      if (otroM) {
        toast('Ese correo ya está asignado a ' + shortOrg(otroM.organismo), 'err');

      const otro = DIRLIST.find((y, k) => k !== i && tel && normPhone(y.telefono) === normPhone(tel));

    case 'dirAdd':
      if (

          x => orgKey(x.organismo) === orgKey(t.dataset.org) && x.cargo === defaultCargo(t.dataset.org)

      csvDownload(
        'directorio_gabinete.csv',
        ['Dependencia', 'Cargo', 'Nombre', 'Celular'],
        DIRLIST.map(x => [x.organismo, x.cargo, x.nombre, x.telefono])
      );
      break;
    case 'notifCsv':
      csvDownload(
        'notificaciones.csv',
        ['Fecha', 'Dependencia', 'Destinatario', 'Celular', 'Mensaje', 'Casos', 'Enviado por', 'Texto'],
        NOTIF.map(n => [n.ts, n.org, n.nombre, n.tel, (TPL[n.tpl] || [n.tpl])[0], n.n, n.usuario, n.mensaje])
      );
      break;
    case 'depCsv': {
      const org = scopeOrg() || X.org;
      csvDownload(
        'reporte_' + shortOrg(org).replace(/\W+/g, '_') + '.csv',
        [
          'Vigencia',
          'N.º radicación ente',
          'Ente',
          'Asunto',

          'Fecha respuesta',

    case 'saveConn':
      lsSet('ce_url', $('#cfUrl').value.trim());
      lsSet('ce_key', $('#cfKey').value.trim());
      location.reload();
      break;
  }
});

/* ---------- cálculo (Formulario 14.1 CGR) ----------
   Plazo (semanas) = (fecha fin − fecha inicio) / 7
   % avance        = mín(1, avance físico / cantidad de la meta)
   PLAI  = plazo × % avance                 (puntaje logrado por la actividad)
   PLAVI = PLAI si fecha fin ≤ fecha de evaluación, si no 0
   PAAVI = plazo si fecha fin ≤ fecha de evaluación, si no 0
   Cumplimiento (CPM) = Σ PLAVI / Σ PAAVI       Avance (AP) = Σ PLAI / Σ plazo           */
function pmSemanas(a) {
  if (!a.fecha_inicio || !a.fecha_fin) return 0;
  return Math.max(0, Math.round((parseD(a.fecha_fin) - parseD(a.fecha_inicio)) / 86400000) / 7);
}
function pmPct(a, cant) {
  const c = Number(a.cantidad) || 0,
    v = cant == null ? Number(a.avance) || 0 : Number(cant) || 0;
  return c > 0 ? Math.min(1, Math.max(0, v / c)) : 0;
}
/* Último avance VALIDADO con fecha de corte hasta la fecha indicada */
function pmAvAl(a, corte) {
  const l = PM.av
    .filter(v => v.accion_id === a.id && v.estado === 'validado' && v.fecha_corte <= corte)
    .sort(
      (x, y) =>
        String(y.fecha_corte).localeCompare(String(x.fecha_corte)) ||
        String(y.revisado_at || '').localeCompare(String(x.revisado_at || ''))
    );
  if (l.length) return l[0];
  if (a.fecha_corte && a.fecha_corte <= corte)
    return { cantidad: a.avance, fecha_corte: a.fecha_corte, descripcion: '' };
  return null;
}
function pmIndic(list, fev) {
  const o = { n: list.length, pbea: 0, pbec: 0, plai: 0, plavi: 0 };
  list.forEach(a => {
    const av = pmAvAl(a, fev),
      p = pmPct(a, av ? av.cantidad : 0),
      s = pmSemanas(a);
    o.pbea += s;
    o.plai += s * p;
    if (a.fecha_fin <= fev) {
      o.pbec += s;
      o.plavi += s * p;

  o.cpm = o.pbec ? o.plavi / o.pbec : null;

function pmIsoOk(y, m, d) {
  if (y < 100) y += 2000;
  if (y < 1990 || y > 2100 || m < 1 || m > 12 || d < 1) return null;
  if (d > new Date(y, m, 0).getDate()) return null;

/* Fecha desde Excel o texto: número de serie, 30/06/2022, 2022-06-30, 30/jun/2022, "30 de junio de 2022",
   "15 diciembre del 2022", "junio 30 de 2022". Devuelve AAAA-MM-DD o null. */
function pmFecha(v) {
  if (v == null || v === '') return null;
  if (v instanceof Date && !isNaN(v)) return pmIsoOk(v.getFullYear(), v.getMonth() + 1, v.getDate());
  if (typeof v === 'number') {
    if (v < 20000 || v > 80000) return null;
    const d = new Date(Math.round((v - 25569) * 86400000));
    return pmIsoOk(d.getUTCFullYear(), d.getUTCMonth() + 1, d.getUTCDate());
  }
  const s = pmKey(v).replace(/[()]/g, ' ');
  let m = s.match(/(\d{4}) (\d{1,2}) (\d{1,2})/);
  if (m) return pmIsoOk(+m[1], +m[2], +m[3]);
  m = s.match(/(\d{1,2}) (\d{1,2}) (\d{2,4})/);
  if (m) return pmIsoOk(+m[3], +m[2], +m[1]);
  m = s.match(/(\d{1,2}) (?:de )?([a-z]{3,})\.? (?:de |del )?(\d{2,4})/);
  if (m && PM_MESES[m[2].slice(0, 3)]) return pmIsoOk(+m[3], PM_MESES[m[2].slice(0, 3)], +m[1]);
  m = s.match(/([a-z]{3,}) (\d{1,2}) (?:de |del )?(\d{4})/);
  if (m && PM_MESES[m[1].slice(0, 3)]) return pmIsoOk(+m[3], PM_MESES[m[1].slice(0, 3)], +m[2]);
  return null;
}
function pmNum(v) {
  if (typeof v === 'number') return isFinite(v) ? v : NaN;
  let s = String(v == null ? '' : v)
    .replace(/[%\s$]/g, '')
    .trim();
  if (!s) return NaN;
  if (s.includes(',') && s.includes('.')) {
    s =
      s.lastIndexOf(',') > s.lastIndexOf('.') ? s.replace(/\./g, '').replace(',', '.') : s.replace(/,/g, '');
  } else if (s.includes(',')) s = s.replace(',', '.');
  return /^-?\d+(\.\d+)?$/.test(s) ? parseFloat(s) : NaN;
}

function pmBlockIfAvances(kind, id) {

    kind === 'acc'

        ? st.acc.filter(a => a.hallazgo_id === id).map(a => a.id)

const PM_TABLA = { plan: 'pm_planes', hall: 'pm_hallazgos', acc: 'pm_acciones' };
const PM_LISTA = { plan: 'planes', hall: 'hall', acc: 'acc' };
async function pmSave(kind, o, id) {
  if (!pmCanEdit()) throw new Error('Tu rol no puede modificar planes de mejoramiento');
  const tabla = PM_TABLA[kind];
  if (S.demo || !sb) {
    const st = pmDemoStore(),
      list = st[PM_LISTA[kind]];
    if (kind === 'hall' && list.some(h => h.plan_id === o.plan_id && h.numero === o.numero && h.id !== id))
      throw new Error('Ya existe un hallazgo con el número ' + o.numero + ' en este plan');
    const now = new Date().toISOString();
    if (id) {
      const t = list.find(x => x.id === id),
        antes = { ...t };
      Object.assign(t, o, { updated_at: now });
      await demoAudit(tabla, 'UPDATE', id, t, pmUser(), diff(antes, t));
    } else {
      const t = {
        ...o,
        id: kind[0] + Date.now().toString(36) + Math.random().toString(36).slice(2, 6),
        created_at: now,
        updated_at: now
      };
      if (kind === 'acc') Object.assign(t, { avance: 0, fecha_corte: null });
      list.push(t);
      await demoAudit(tabla, 'INSERT', t.id, t, pmUser());
      id = t.id;
    }
    pmDemoSave();
    return id;
  }
  if (id) {
    const { error } = await sb.from(tabla).update(o).eq('id', id);
    if (error) throw pmErr(error);
    return id;
  }
  const { data, error } = await sb.from(tabla).insert(o).select('id').single();
  if (error) throw pmErr(error);
  return data.id;
}
async function pmDelete(kind, id) {

    const st = pmDemoStore();
    if (kind === 'hall') st.acc = st.acc.filter(a => a.hallazgo_id !== id);
    st[PM_LISTA[kind]] = st[PM_LISTA[kind]].filter(x => x.id !== id);
    await demoAudit(PM_TABLA[kind], 'DELETE', id, { id }, pmUser());
    pmDemoSave();
    return;
  }
  const { error } = await sb.from(PM_TABLA[kind]).delete().eq('id', id);
  if (error) throw pmErr(error);
}
async function pmEliminarPlan(id) {
  if (rol() !== 'admin') throw new Error('Solo el Super administrador elimina planes');
  if (S.demo || !sb) {
    const st = pmDemoStore();
    if (st.av.some(v => v.plan_id === id && !/^Importado del archivo/.test(v.observacion || '')))

    st.av = st.av.filter(v => v.plan_id !== id);

async function pmReportar(o, file) {
  const a = pmAccOf(o.accion_id);
  if (!pmCanReport(a)) throw new Error('Solo puedes reportar avances de las acciones de tu dependencia');
  let path = null,
    hash = null;
  if (file) hash = await sha256Hex(await file.arrayBuffer());
  if (S.demo || !sb) {
    const st = pmDemoStore();
    if (st.av.some(v => v.accion_id === a.id && v.estado === 'reportado'))
      throw new Error('Esta acción ya tiene un avance pendiente de validar');
    const now = new Date().toISOString();
    const v = {
      id: 'v' + Date.now().toString(36),
      accion_id: a.id,
      plan_id: a.plan_id,
      dependencia_id: a.dependencia_id,
      fecha_corte: o.fecha_corte,
      cantidad: o.cantidad,
      descripcion: o.descripcion,
      radicado_orfeo: o.radicado_orfeo || '',
      soporte_path: file ? file.name : null,
      soporte_hash: hash,
      estado: 'reportado',
      observacion: '',
      reportado_email: pmUser(),
      revisado_email: '',
      revisado_at: null,
      created_at: now
    };
    st.av.push(v);
    await demoAudit('pm_avances', 'INSERT', v.id, v, pmUser());
    pmDemoSave();
    if (o.validar && pmCanEdit()) await pmRevisar(v.id, 'validado', 'Registrado y validado por ' + pmUser());
    return { hash };
  }
  if (file) {
    path = `pm/${a.plan_id}/${a.id}_${Date.now()}.pdf`;
    const up = await sb.storage
      .from('soportes')
      .upload(path, file, { contentType: 'application/pdf', upsert: false });
    if (up.error) throw new Error('No se pudo subir el PDF: ' + up.error.message);
  }
  const { error } = await sb.rpc('pm_reportar_avance', {
    p_accion: a.id,
    p_fecha: o.fecha_corte,
    p_cantidad: o.cantidad,
    p_descripcion: o.descripcion,
    p_orfeo: o.radicado_orfeo || '',
    p_path: path,
    p_hash: hash,
    p_validar: !!(o.validar && pmCanEdit())
  });
  if (error) {
    if (path) await sb.storage.from('soportes').remove([path]);
    throw pmErr(error);
  }
  return { hash };
}
async function pmRevisar(id, estado, obs) {
  if (!pmCanEdit()) throw new Error('Solo el Super administrador o Control Interno validan avances');
  if (S.demo || !sb) {
    const st = pmDemoStore(),
      v = st.av.find(x => x.id === id);
    if (!v) throw new Error('El avance no existe');
    if (v.estado !== 'reportado') throw new Error('Este avance ya fue revisado');
    if (estado === 'devuelto' && pmTxt(obs).length < 5)
      throw new Error('Indica a la dependencia por qué se devuelve el avance');
    const antes = { ...v };
    Object.assign(v, {
      estado,
      observacion: pmTxt(obs),
      revisado_email: pmUser(),
      revisado_at: new Date().toISOString()
    });
    await demoAudit('pm_avances', 'UPDATE', id, v, pmUser(), diff(antes, v));
    if (estado === 'validado') {
      const a = st.acc.find(x => x.id === v.accion_id),
        last = st.av
          .filter(x => x.accion_id === a.id && x.estado === 'validado')
          .sort(
            (x, y) =>
              String(y.fecha_corte).localeCompare(String(x.fecha_corte)) ||
              String(y.revisado_at).localeCompare(String(x.revisado_at))
          )[0];
      const ant = { ...a };
      a.avance = last.cantidad;
      a.fecha_corte = last.fecha_corte;
      await demoAudit('pm_acciones', 'UPDATE', a.id, a, pmUser(), diff(ant, a));
    }
    pmDemoSave();
    return;
  }
  const { error } = await sb.rpc('pm_revisar_avance', {
    p_id: id,
    p_estado: estado,
    p_observacion: obs || ''
  });
  if (error) throw pmErr(error);
}
async function pmImportar(payload) {
  if (!pmCanEdit()) throw new Error('Solo el Super administrador o Control Interno importan planes');
  if (S.demo || !sb) {
    const st = pmDemoStore(),
      now = new Date().toISOString(),
      uid = p => p + Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
    const plan = { ...payload.plan, id: uid('p'), created_at: now, updated_at: now };
    const hall = [],
      acc = [],
      av = [];
    payload.hallazgos.forEach((h, i) => {
      const hh = { ...h, id: uid('h'), plan_id: plan.id, orden: i + 1, created_at: now, updated_at: now };
      delete hh.acciones;
      hall.push(hh);
      h.acciones.forEach(a => {
        const aa = {
          ...a,
          id: uid('a'),
          plan_id: plan.id,
          hallazgo_id: hh.id,
          orden: acc.length + 1,
          avance: 0,
          fecha_corte: null,
          created_at: now,
          updated_at: now
        };
        delete aa.descripcion_avance;
        if (a.avance != null && a.fecha_corte) {
          aa.avance = a.avance;
          aa.fecha_corte = a.fecha_corte;
          av.push({
            id: uid('v'),
            accion_id: aa.id,
            plan_id: plan.id,
            dependencia_id: aa.dependencia_id,
            fecha_corte: a.fecha_corte,
            cantidad: a.avance,
            descripcion: a.descripcion_avance || 'Avance importado del archivo ' + payload.archivo,
            radicado_orfeo: '',
            soporte_path: null,
            soporte_hash: null,
            estado: 'validado',
            observacion: 'Importado del archivo ' + payload.archivo,
            reportado_email: pmUser(),
            revisado_email: pmUser(),
            revisado_at: now,
            created_at: now
          });
        }
        acc.push(aa);
      });
    });
    st.planes.push(plan);
    st.hall.push(...hall);
    st.acc.push(...acc);
    st.av.push(...av);
    await demoAudit(
      'pm_planes',
      'INSERT',
      plan.id,
      { ...plan, hallazgos: hall.length, acciones: acc.length, archivo: payload.archivo },
      pmUser()
    );
    pmDemoSave();
    return plan.id;
  }
  const { data, error } = await sb.rpc('pm_importar', { p: payload });
  if (error) throw pmErr(error);
  return data;
}

/* Revisión de calidad de datos del plan: todo lo que impide medir o exportar correctamente */
function pmCalidad(p, hall, acc) {
  const out = [];
  const add = (nivel, txt, act, id) => out.push({ nivel, txt, act, id });
  if (!p.fecha_suscripcion) add('r', 'El plan no tiene fecha de suscripción', 'pmEditPlan', p.id);
  if (p.formato === 'F14_CGR' && !p.nit)
    add('y', 'Falta el NIT de la entidad (lo exige el Formulario 14)', 'pmEditPlan', p.id);
  if (!p.representante_legal)
    add('y', 'Falta el nombre del representante legal para las firmas del formato', 'pmEditPlan', p.id);
  hall.forEach(h => {
    if (!acc.some(a => a.hallazgo_id === h.id))
      add('r', `El hallazgo ${h.numero} no tiene acciones`, 'pmNewAcc', h.id);
    if (!(h.connotaciones || []).length && p.formato === 'PM_01_CGSC')
      add('y', `El hallazgo ${h.numero} no tiene connotación`, 'pmEditHall', h.id);
  });
  acc.forEach(a => {
    const h = pmHallOf(a.hallazgo_id) || {},
      n = `Hallazgo ${h.numero || '?'} · «${shortTxt(a.accion, 60)}»`;
    if (!a.dependencia_id)
      add('r', `${n}: sin dependencia asignada (nadie la ve ni la reporta)`, 'pmEditAcc', a.id);
    if (pmSemanas(a) === 0)
      add('y', `${n}: inicio y fin el mismo día, no pesa en los indicadores`, 'pmEditAcc', a.id);
    if (p.fecha_suscripcion && a.fecha_fin < p.fecha_suscripcion)
      add('r', `${n}: termina antes de la suscripción del plan`, 'pmEditAcc', a.id);
    if (!pmTxt(a.meta) && p.formato === 'PM_01_CGSC')
      add('y', `${n}: sin meta (columna 11 del PM_01)`, 'pmEditAcc', a.id);
    if (!pmTxt(a.fuente_verificacion)) add('y', `${n}: sin fuente de verificación`, 'pmEditAcc', a.id);
    if (p.formato === 'F14_CGR' && !pmTxt(a.actividad))
      add('y', `${n}: sin descripción de actividades (Formulario 14)`, 'pmEditAcc', a.id);
    if (pmEstado(a).k === 'vencida' && !pmPend(a))
      add('r', `${n}: vencida sin cumplir y sin avance en validación`, 'pmOpenAcc', a.id);
  });
  return out.sort((a, b) => (a.nivel === 'r' ? 0 : 1) - (b.nivel === 'r' ? 0 : 1));
}
function pmTabCalidad(issues) {
  if (!issues.length)
    return '<div class="card"><div class="empty"><i class="fa-solid fa-circle-check"></i>Los datos del plan están completos y consistentes</div></div>';
  return `<div class="card">${issues
    .map(
      i =>
        `<div class="list-row pm-issue ${i.nivel}"><i class="fa-solid ${i.nivel === 'r' ? 'fa-circle-exclamation' : 'fa-triangle-exclamation'}"></i><span style="flex:1">${esc(i.txt)}</span>${(i.act === 'pmOpenAcc' || pmCanEdit()) && i.act ? `<button class="btn sm" data-act="${i.act}" data-id="${esc(i.id)}">${i.act === 'pmOpenAcc' ? 'Ver' : i.act === 'pmNewAcc' ? 'Agregar acción' : 'Corregir'}</button>` : ''}</div>`
    )
    .join('')}</div>`;
}

async function pmSavePlan(id) {
  const o = {
    formato: pmVal('pmPFmt'),
    contraloria: pmVal('pmPCtl'),
    ejercicio: pmVal('pmPEje'),
    tipo_ejercicio: pmVal('pmPTipo'),
    fecha_suscripcion: pmVal('pmPFs'),
    vigencia_pvcft: pmVal('pmPVig'),
    periodo_auditado: pmVal('pmPPer'),
    modalidad: pmVal('pmPMod'),
    nit: pmVal('pmPNit'),
    numero_informe: pmVal('pmPInf'),
    fecha_informe: pmVal('pmPFi') || null,
    radicado_orfeo: pmVal('pmPOrf'),
    estado: pmVal('pmPEst'),
    entidad: pmVal('pmPEnt') || 'Distrito Especial de Santiago de Cali',
    representante_legal: pmVal('pmPRep'),
    ordenador_gasto: pmVal('pmPOrd'),
    observaciones: pmVal('pmPObs')
  };
  if (!o.contraloria) return toast('Indica la contraloría', 'err');
  if (o.ejercicio.length < 4) return toast('Escribe el nombre del ejercicio de fiscalización', 'err');
  if (!pmFecha(o.fecha_suscripcion)) return toast('Indica la fecha de suscripción del plan', 'err');
  if (o.fecha_informe && !pmFecha(o.fecha_informe)) return toast('La fecha del informe no es válida', 'err');
  if (id) {
    const fuera = PM.acc.filter(a => a.plan_id === id && a.fecha_fin < o.fecha_suscripcion).length;
    if (
      fuera &&
      !confirm(
        `${fuera} acción(es) terminan antes de la nueva fecha de suscripción. ¿Guardar de todas formas?`
      )
    )
      return;
  }
  const en = S.entes.find(x => pmKey(x.nombre) === pmKey(o.contraloria));
  if (en) o.ente_id = en.id;
  try {
    const nid = await pmSave('plan', o, id || null);
    closeModal();
    toast(id ? 'Plan actualizado' : 'Plan creado. Ahora agrega sus hallazgos y acciones.');
    PM.plan = nid;
    PM.tab = 'acciones';
    await pmRefresh();
  } catch (e) {
    toast(e.message, 'err');
  }
}

async function pmSaveAcc(id, hallId) {
  const h = pmHallOf(hallId),
    p = pmPlanOf(h.plan_id);
  const o = {
    plan_id: h.plan_id,
    hallazgo_id: h.id,
    accion: pmVal('pmAAcc'),
    proposito: $('#pmAPro') ? pmVal('pmAPro') : (pmAccOf(id) || {}).proposito || '',
    actividad: $('#pmAAct') ? pmVal('pmAAct') : (pmAccOf(id) || {}).actividad || '',
    meta: pmVal('pmAMeta'),
    unidad_medida: pmVal('pmAUni'),
    cantidad: pmNum(pmVal('pmACan')),
    fecha_inicio: pmVal('pmAFi'),
    fecha_fin: pmVal('pmAFf'),
    dependencia_id: pmVal('pmADep') ? +pmVal('pmADep') || pmVal('pmADep') : null,
    responsable: pmVal('pmARes'),
    fuente_verificacion: pmVal('pmAFue'),
    lugar_verificacion: pmVal('pmALug')
  };
  if (o.accion.length < 4) return toast('Describe la acción', 'err');
  if (!o.unidad_medida) return toast('Indica la unidad de medida', 'err');
  if (!(o.cantidad > 0)) return toast('La cantidad de la meta debe ser mayor que cero', 'err');
  if (!pmFecha(o.fecha_inicio) || !pmFecha(o.fecha_fin))
    return toast('Indica las fechas de inicio y de terminación', 'err');
  if (o.fecha_fin < o.fecha_inicio)
    return toast('La fecha de terminación no puede ser anterior a la de inicio', 'err');
  if (!o.dependencia_id)
    return toast('Asigna la dependencia responsable: sin ella nadie podrá reportar el avance', 'err');
  if (
    p.fecha_suscripcion &&
    o.fecha_fin < p.fecha_suscripcion &&
    !confirm('La acción termina antes de la suscripción del plan. ¿Guardar de todas formas?')
  )
    return;
  const prev = pmAccOf(id);
  if (
    prev &&
    Number(prev.avance) > o.cantidad &&
    !confirm('El avance validado supera la nueva cantidad de la meta. ¿Guardar de todas formas?')
  )
    return;
  if (!id) o.orden = PM.acc.filter(a => a.plan_id === h.plan_id).length + 1;
  try {
    await pmSave('acc', o, id || null);
    closeModal();
    toast(id ? 'Acción actualizada' : 'Acción agregada');
    await pmRefresh();
  } catch (e) {
    toast(e.message, 'err');
  }
}

async function pmSaveAv(id, btn) {
  const a = pmAccOf(id);
  const o = {
    accion_id: id,
    fecha_corte: pmVal('pmVFc'),
    cantidad: pmNum(pmVal('pmVCan')),
    descripcion: pmVal('pmVDes'),
    radicado_orfeo: pmVal('pmVOrf').replace(/\s+/g, ''),
    validar: !!($('#pmVVal') && $('#pmVVal').checked)
  };
  const file = ($('#pmVPdf').files || [])[0] || null;
  if (!pmFecha(o.fecha_corte)) return toast('Indica la fecha de corte', 'err');
  if (o.fecha_corte > pmHoy()) return toast('La fecha de corte no puede ser futura', 'err');
  if (isNaN(o.cantidad) || o.cantidad < 0)
    return toast('El avance debe ser un número mayor o igual a cero', 'err');
  if (o.descripcion.length < 10) return toast('Describe el avance (mínimo 10 caracteres)', 'err');
  if (o.radicado_orfeo && !/^\d{10,20}$/.test(o.radicado_orfeo))
    return toast('El radicado ORFEO debe tener entre 10 y 20 dígitos', 'err');
  if (!file && !o.radicado_orfeo)
    return toast('Adjunta el PDF del soporte o indica el radicado ORFEO', 'err');
  if (file && file.type && file.type !== 'application/pdf' && !/\.pdf$/i.test(file.name))
    return toast('El soporte debe ser un archivo PDF', 'err');
  if (file && file.size > 10 * 1024 * 1024) return toast('El PDF supera 10 MB', 'err');
  if (
    o.cantidad < Number(a.avance) &&
    !confirm('El avance acumulado es menor que el ya validado. ¿Enviarlo de todas formas?')
  )
    return;
  if (
    o.cantidad > Number(a.cantidad) &&
    !confirm('El avance supera la cantidad de la meta. ¿Enviarlo de todas formas?')
  )
    return;
  if (btn) {
    btn.disabled = true;
    btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> Enviando…';
  }
  try {
    await pmReportar(o, file);
    closeModal();
    toast(
      o.validar
        ? 'Avance registrado y validado'
        : 'Avance enviado. Queda pendiente de validación por Control Interno.'
    );
    await pmRefresh();
  } catch (e) {
    toast(e.message, 'err');
    if (btn) {
      btn.disabled = false;
      btn.innerHTML = '<i class="fa-solid fa-paper-plane"></i> Enviar avance';
    }
  }
}

async function pmDoReview(id, estado) {
  const obs = pmVal('pmRObs');
  if (estado === 'devuelto' && obs.length < 5)
    return toast('Indica a la dependencia por qué se devuelve el avance', 'err');
  try {
    await pmRevisar(id, estado, obs);
    closeModal();
    toast(
      estado === 'validado'
        ? 'Avance validado: el indicador de la acción quedó actualizado'
        : 'Avance devuelto a la dependencia'
    );
    await pmRefresh();
  } catch (e) {
    toast(e.message, 'err');
  }
}

/* Encabezados reconocidos (en orden: los más específicos primero) */
const PM_COLS = [
  ['plavi', /puntaje logrado por las actividades vencidas/],
  ['plai', /puntaje logrado/],
  ['paavi', /puntaje atribuido/],
  ['pctcgr', /porcentaje de avance fisico/],
  ['avfis', /avance fisico/],
  ['pct', /(porcentaje|%) (de )?avance|^avance (%|porcentual)|^% avance/],
  ['descav', /descripcion del avance/],
  ['fcorte', /fecha de corte/],
  ['numero', /codigo (del )?hallazgo|^(n|no|nro|numero)? ?(de )?hallazgo( no| n)?$/],
  ['descripcion', /descripcion (de la condicion|del hallazgo|hallazgo)|^condicion/],
  ['causa', /^causa/],
  ['efecto', /^efecto/],
  ['connotacion', /connotacion/],
  ['macro', /macroproceso|criterio/],
  ['actividad', /descripcion de las actividades|^actividad(es)?$/],
  ['accion', /^accion|^acciones/],
  ['proposito', /proposito/],
  ['unidad', /unidad de medida/],
  ['cantidad', /cantidad/],
  ['meta', /^metas?$/],
  ['fuente', /fuente de verificacion/],
  ['lugar', /lugar de verificacion/],
  ['fini', /fecha (de )?inicio|fecha (de )?iniciacion/],
  ['ffin', /fecha (de )?terminacion|fecha (de )?finalizacion|fecha (de )?fin\b|fecha limite/],
  ['plazo', /plazo/],
  ['responsable', /responsable/],
  ['obs', /^observacion/],
  ['consec', /^(no|n|item|consecutivo)$/]
